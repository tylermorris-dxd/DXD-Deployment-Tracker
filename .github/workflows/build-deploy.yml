name: Build & Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dxd_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # ── Build Next.js frontend ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        run: npm install
        working-directory: frontend

      - name: Build Next.js static export
        run: npm run build
        working-directory: frontend

      # ── Build Rust backend (Linux x86_64 static musl) ─────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,native-tls

      - name: Run database migrations (against local CI postgres)
        run: sqlx migrate run
        working-directory: backend
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/dxd_tracker

      - name: Build Rust binary (static release)
        run: cargo build --release --target x86_64-unknown-linux-musl
        working-directory: backend
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/dxd_tracker

      # ── Package deploy artifact ─────────────────────────────────────────────
      - name: Stage artifact
        run: |
          mkdir -p dist/frontend dist/data
          cp backend/target/x86_64-unknown-linux-musl/release/dxd-tracker dist/dxd-tracker
          chmod +x dist/dxd-tracker
          cp -r frontend/out/* dist/frontend/
          printf '#!/bin/sh\nexec /home/site/wwwroot/dxd-tracker\n' > dist/startup.sh
          chmod +x dist/startup.sh
          printf '{"name":"dxd-tracker","version":"2.0.0","scripts":{"start":"./dxd-tracker"}}\n' > dist/package.json

      - name: Create deploy zip
        run: cd dist && zip -r ../deploy.zip .

      # ── Deploy to Azure App Service ─────────────────────────────────────────
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: onboarding-dev
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: deploy.zip
          startup-command: '/home/site/wwwroot/dxd-tracker'

      - name: Upload artifact (manual download fallback)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dxd-tracker-deploy
          path: deploy.zip
          retention-days: 7
