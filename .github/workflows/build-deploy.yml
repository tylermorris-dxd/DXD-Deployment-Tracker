name: Build & Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Build Next.js frontend ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build Next.js static export
        run: npm run build
        working-directory: frontend

      # ── Build Rust backend (Linux x86_64) ──────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build Rust binary (release)
        run: cargo build --release
        working-directory: backend

      # ── Package deploy artifact ─────────────────────────────────────────────
      - name: Stage artifact
        run: |
          mkdir -p dist/frontend dist/data
          cp backend/target/release/dxd-tracker dist/dxd-tracker
          chmod +x dist/dxd-tracker
          cp -r frontend/out/* dist/frontend/
          cp .deployment dist/.deployment 2>/dev/null || true

      - name: Create deploy zip
        run: cd dist && zip -r ../deploy.zip .

      # ── Deploy to Azure App Service ─────────────────────────────────────────
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: onboarding-dev
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip

      - name: Upload artifact (manual download fallback)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dxd-tracker-deploy
          path: deploy.zip
          retention-days: 7
