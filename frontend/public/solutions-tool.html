<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DXD Solutions Tool 3.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tomorrow:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0E0F; --panel:#161618; --panel2:#1C1C1F; --raised:#26262A;
  --line:#2C2C31; --line2:#3A3A40;
  --t1:#ECECEC; --t2:#9A9A9E; --t3:#606066;
  --red:#C0392B; --red2:#E2483F; --redDim:#5a2520;
  --green:#3FB95A; --amber:#E0A23B; --blue:#5AA2FF;
  --disp:'Tomorrow',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--t1);font-family:var(--body);font-size:13px;line-height:1.45;padding:20px;min-height:100vh}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:1180px;margin:0 auto}

/* ---------- header ---------- */
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:13px}
.mark{width:34px;height:34px;border:2px solid var(--red);border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;color:var(--red);font-size:18px;letter-spacing:-1px}
.logo{display:flex;align-items:center;flex:none}
.logo svg,.logo img{display:block;height:42px;width:auto}
.brand h1{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:.5px;line-height:1;display:flex;align-items:baseline;flex-wrap:wrap;gap:0 4px}
.credit{font-family:'Caveat',cursive;font-weight:600;font-size:21px;line-height:1;color:#fff;letter-spacing:.3px;margin-left:9px;transform:rotate(-3.5deg);transform-origin:left bottom;display:inline-block;text-shadow:0 1px 6px rgba(226,72,63,.35);white-space:nowrap;opacity:.92}
.brand .sub{font-size:10.5px;color:var(--t2);letter-spacing:2.5px;text-transform:uppercase;margin-top:3px}
.faces{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px;gap:3px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.printbtn{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.4px;padding:8px 14px;border-radius:8px;color:var(--t1);cursor:pointer;border:1px solid var(--line2);background:var(--panel);transition:.15s;white-space:nowrap}
.printbtn:hover{border-color:var(--red);color:#fff}
/* package comparison (Capture) */
.pcmp{width:100%;border-collapse:collapse;font-size:11.5px}
.pcmp th,.pcmp td{padding:7px 9px;border-bottom:1px solid var(--line)}
.pcmp th{font-family:var(--disp);font-weight:600;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--t2);text-align:center}
.pcmp th:first-child{text-align:left}
.pcmp td{font-family:var(--disp);font-weight:500;color:var(--t1);text-align:center}
.pcmp td.pl{color:var(--t2);text-align:left}
.pcmp .sel{background:rgba(192,57,43,.12)}
.pcmp th.sel{color:#fff;box-shadow:inset 0 -2px 0 var(--red)}
.cfm{color:var(--amber);font-style:italic;font-weight:600}
#printSheet{display:none}
.face{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.4px;padding:7px 15px;border-radius:6px;color:var(--t2);cursor:pointer;border:0;background:transparent;transition:.15s;white-space:nowrap}
.face:hover{color:var(--t1)}
.face.on{background:var(--red);color:#fff}
.face .fd{display:block;font-family:var(--body);font-weight:400;font-size:9px;letter-spacing:.2px;color:rgba(255,255,255,.65);margin-top:1px}
.face:not(.on) .fd{color:var(--t3)}

/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:880px){.grid{grid-template-columns:1fr}}
@media print{
  @page{margin:14mm}
  html,body{background:#0E0E0F !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:0 !important;min-height:0 !important}
  .wrap{display:none !important}
  #printSheet{display:block !important}
  .ps{color:#ECECEC;font-family:'Inter',system-ui,sans-serif}
  .ps-head{display:flex;align-items:center;gap:14px;border-bottom:2px solid #C0392B;padding-bottom:12px;margin-bottom:15px}
  .ps-logo{height:48px;width:auto}
  .ps-title{font-family:'Tomorrow',sans-serif;font-weight:700;font-size:21px;letter-spacing:.5px;color:#fff}
  .ps-sub{font-family:'Tomorrow',sans-serif;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#9A9A9E;margin-top:3px}
  .ps-config{font-family:'Tomorrow',sans-serif;font-weight:600;font-size:12px;color:#E2483F;background:rgba(192,57,43,.10);border:1px solid #5a2520;border-radius:8px;padding:10px 13px;margin-bottom:18px;letter-spacing:.3px;line-height:1.5}
  .ps-sec{margin-bottom:17px;break-inside:avoid}
  .ps-sec h3{font-family:'Tomorrow',sans-serif;font-weight:600;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#9A9A9E;margin:0 0 6px;border-bottom:1px solid #26262A;padding-bottom:5px}
  .ps-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .ps-tbl td{padding:6px 4px;border-bottom:1px solid #1C1C1F;font-family:'Tomorrow',sans-serif;font-weight:500;color:#ECECEC}
  .ps-tbl td:first-child{color:#9A9A9E}
  .ps-tbl td.amt{text-align:right;font-weight:700;color:#ECECEC}
  .ps-tbl tr.ps-total td{border-top:2px solid #C0392B;border-bottom:none;font-size:15px;padding-top:10px;color:#fff}
  .ps-tbl tr.ps-total td.amt{color:#3FB95A}
  .ps-fine{font-size:9.5px;color:#606066;margin-top:6px;font-style:italic}
  .ps-foot{margin-top:28px;padding-top:12px;border-top:1px solid #26262A;text-align:center}
  .ps-creed{font-family:'Tomorrow',sans-serif;font-weight:700;letter-spacing:2.5px;color:#E2483F;font-size:12px}
  .ps-sig{font-family:'Tomorrow',sans-serif;font-size:9px;letter-spacing:1.2px;color:#606066;margin-top:3px}
}
.col{display:flex;flex-direction:column;gap:14px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;border-bottom:1px solid var(--line)}
.card-h .ct{font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--t1)}
.card-h .cn{font-size:10px;color:var(--t3)}
.card-b{padding:15px}

/* segmented */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg.two>*{flex:1}
.seg.col-seg{flex-direction:column}
.opt{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;transition:.13s;text-align:left}
.opt:hover{border-color:var(--line2)}
.opt.on{border-color:var(--red);background:rgba(192,57,43,.12)}
.opt .ol{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--t1)}
.opt.on .ol{color:var(--red2)}
.opt .od{font-size:10.5px;color:var(--t2);margin-top:2px;line-height:1.35}

.lbl{font-family:var(--disp);font-weight:500;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--t2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.lbl .hint{font-family:var(--body);font-weight:400;letter-spacing:0;text-transform:none;color:var(--t3);font-size:10px}
.fieldset{margin-bottom:16px}
.fieldset:last-child{margin-bottom:0}

/* pills */
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 0;flex:1;text-align:center;cursor:pointer;font-family:var(--disp);font-weight:600;font-size:13px;color:var(--t2);transition:.13s;min-width:42px}
.pill:hover{color:var(--t1);border-color:var(--line2)}
.pill.on{border-color:var(--red);background:rgba(192,57,43,.14);color:var(--red2)}
.pill.sm{font-size:12px;padding:6px 0}

/* slider */
.slider-row{display:flex;align-items:center;gap:12px}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;background:var(--line2);border-radius:4px;flex:1;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--red2);cursor:pointer;border:2px solid #fff2}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--red2);cursor:pointer;border:2px solid #fff2}
.sval{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--red2);min-width:46px;text-align:right}

/* toggle */
.tg{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.tg .sw{width:38px;height:21px;border-radius:12px;background:var(--line2);position:relative;transition:.18s;flex-shrink:0}
.tg .sw::after{content:'';position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.18s}
.tg.on .sw{background:var(--amber)}
.tg.on .sw::after{left:20px}

/* checkbox add-ons */
.chk{display:flex;align-items:flex-start;gap:11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;transition:.13s;margin-bottom:7px}
.chk:hover{border-color:var(--line2)}
.chk.on{border-color:var(--red);background:rgba(192,57,43,.10)}
.chk.dis{opacity:.5;cursor:not-allowed}
.chk .box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:.13s}
.chk.on .box{background:var(--red);border-color:var(--red)}
.chk.on .box::after{content:'✓';color:#fff;font-size:11px;font-weight:700}
.chk .cmeta{flex:1;min-width:0}
.chk .cn{font-family:var(--disp);font-weight:600;font-size:12.5px;display:flex;justify-content:space-between;gap:8px}
.chk .cpr{color:var(--green);font-weight:600}
.chk .cd{font-size:10.5px;color:var(--t2);margin-top:2px}
.tag{font-family:var(--disp);font-size:8.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid var(--line2);color:var(--t2);white-space:nowrap}
.tag.cap{border-color:#3a5a8a;color:var(--blue)}
.tag.inf{border-color:#3a6a4a;color:var(--green)}
.tag.plan{border-color:var(--amber);color:var(--amber)}

/* the four numbers */
.bignum{font-family:var(--disp);font-weight:700}
.fournum .nr{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line)}
.fournum .nr:last-child{border-bottom:0}
.nr .nl{display:flex;flex-direction:column}
.nr .nl b{font-family:var(--disp);font-weight:600;font-size:13.5px}
.nr .nl span{font-size:10.5px;color:var(--t2);margin-top:1px}
.nr .nv{font-family:var(--disp);font-weight:600;font-size:16px;text-align:right}
.nr .nv small{display:block;font-family:var(--body);font-size:9.5px;color:var(--t3);font-weight:400}
.nv .povbox{display:inline-flex;align-items:center;gap:1px;background:rgba(0,0,0,.22);border:1px solid var(--line2);border-radius:7px;padding:2px 8px}
.nv .povbox:focus-within{border-color:var(--red)}
.nv .povbox.ovr{border-color:var(--amber);background:rgba(217,164,65,.08)}
.nv .povbox .fpfx{font-family:var(--disp);font-size:12px;color:var(--t2);font-weight:500}
.nv .povbox .fsfx{font-family:var(--disp);font-size:10px;color:var(--t3)}
.nv input.povinp{background:transparent;border:0;outline:none;color:#fff;font-family:var(--disp);font-weight:700;font-size:16px;line-height:1;width:auto;max-width:84px;text-align:right;padding:1px 0}
.nv .povbox.ovr input.povinp{color:var(--amber)}
.nv input.povinp::-webkit-outer-spin-button,.nv input.povinp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.total{margin-top:6px;padding:15px;border-radius:11px;background:linear-gradient(160deg,#201416,#161618);border:1px solid var(--redDim);display:flex;justify-content:space-between;align-items:flex-end}
.total .tl{font-family:var(--disp);font-weight:500;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--t2)}
.total .tl small{display:block;color:var(--t3);font-size:9.5px;letter-spacing:.3px;text-transform:none;margin-top:2px}
.total .tv{font-family:var(--disp);font-weight:700;font-size:34px;line-height:.95;color:#fff}
.total .tv span{font-size:15px;color:var(--t2);font-weight:500}

/* margin gauge */
.mbar{height:9px;border-radius:6px;background:var(--line);overflow:hidden;position:relative;margin-top:7px}
.mbar .fill{height:100%;border-radius:6px;transition:.3s}
.mbar .floor{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--t1);opacity:.85}
.mrow{display:flex;justify-content:space-between;align-items:baseline}
.mpct{font-family:var(--disp);font-weight:700;font-size:22px}

/* effective ratio panel */
.effbox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px}
.effrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eff-chip{font-family:var(--disp);font-weight:700;text-align:center;padding:8px 4px;border-radius:8px;flex:1;border:1px solid var(--line)}
.eff-chip .k{font-size:9px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:var(--t2);display:block;margin-bottom:3px}
.eff-chip .v{font-size:19px}
.eff-op{color:var(--t1)}
.eff-reg.pend{border-color:var(--amber);color:var(--amber)}
.eff-reg.off{color:var(--t3)}
.eff-eq{color:var(--t3);font-size:16px}
.eff-final{color:var(--red2);border-color:var(--redDim);background:rgba(192,57,43,.08)}
.eff-final.capped{color:var(--amber);border-color:var(--amber)}

/* pending projection */
.proj{margin-top:11px;border:1px dashed var(--amber);border-radius:9px;padding:11px 13px;background:repeating-linear-gradient(135deg,rgba(224,162,59,.05),rgba(224,162,59,.05) 8px,transparent 8px,transparent 16px)}
.proj .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.proj .pt{font-family:var(--disp);font-weight:600;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--amber)}
.proj .pg{display:flex;gap:14px;flex-wrap:wrap}
.proj .pg div{font-size:10.5px;color:var(--t2)}
.proj .pg b{font-family:var(--disp);font-size:16px;color:var(--t1);display:block;font-weight:700}

/* capital */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px}
.kpi .kl{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--t2);margin-bottom:4px;font-family:var(--disp);font-weight:500}
.kpi .kv{font-family:var(--disp);font-weight:700;font-size:19px}
.kpi .kv.neg{color:var(--red2)}
.kpi .ks{font-size:9.5px;color:var(--t3);margin-top:2px}
.spark{margin-top:12px}
.note{font-size:10.5px;color:var(--t3);line-height:1.5;margin-top:10px}
.note b{color:var(--t2);font-weight:600}

.passcap{display:flex;gap:12px;align-items:center;background:rgba(63,185,90,.07);border:1px solid #2a4a32;border-radius:10px;padding:13px}
.passcap .pi{width:30px;height:30px;border-radius:50%;border:2px solid var(--green);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.passcap b{color:var(--green);font-family:var(--disp);font-size:13px}
.passcap p{font-size:10.5px;color:var(--t2);margin-top:2px}

/* advanced */
.adv-toggle{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);border:1px dashed var(--line2);border-radius:9px;padding:9px;cursor:pointer;color:var(--t2);font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase;transition:.13s}
.adv-toggle:hover{color:var(--t1);border-color:var(--red)}
.adv-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.inp{display:flex;flex-direction:column;gap:4px}
.inp label{font-size:10px;color:var(--t2);letter-spacing:.3px}
.inp .ib{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:0 9px}
.inp .ib:focus-within{border-color:var(--red)}
.inp .ib .pfx{color:var(--t3);font-size:11px}
.inp input{background:transparent;border:0;color:var(--t1);font-family:var(--disp);font-size:13px;padding:7px 4px;width:100%;outline:none;text-align:right}
.inp input::-webkit-outer-spin-button,.inp input::-webkit-inner-spin-button{-webkit-appearance:none}

/* ---------- add-on quantity rows ---------- */
.aon{display:flex;align-items:center;gap:11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;transition:.13s;margin-bottom:7px}
.aon.on{border-color:var(--red);background:rgba(192,57,43,.10)}
.aon.dis{opacity:.55}
.aon .cmeta{flex:1;min-width:0}
.aon .cn{font-family:var(--disp);font-weight:600;font-size:12.5px;display:flex;justify-content:space-between;gap:8px}
.aon .cpr{color:var(--green);font-weight:600}
.aon .cd{font-size:10.5px;color:var(--t2);margin-top:2px}

/* ---------- steppers (shared) ---------- */
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-shrink:0;background:var(--panel)}
.step button{width:26px;height:28px;border:0;background:transparent;color:var(--t2);font-family:var(--disp);font-weight:700;font-size:15px;cursor:pointer;line-height:1;transition:.12s}
.step button:hover{background:var(--raised);color:var(--t1)}
.step input{width:34px;height:28px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);background:transparent;color:var(--t1);font-family:var(--disp);font-weight:700;font-size:12.5px;text-align:center;outline:none}
.step.sm button{width:22px;height:24px;font-size:13px}
.step.sm input{width:28px;height:24px;font-size:11.5px}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.aon.on .step{border-color:var(--red)} .aon.on .step input{color:var(--red2)}
.uedit{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.uedit:focus-within{border-color:var(--red)}
.uedit .pfx{color:var(--t3);font-size:10px}
.uedit input{background:transparent;border:0;color:var(--t1);font-family:var(--disp);font-size:11.5px;font-weight:600;padding:5px 2px;width:100%;outline:none;text-align:right}
.uedit input::-webkit-outer-spin-button,.uedit input::-webkit-inner-spin-button{-webkit-appearance:none}
.uedit .sfx{color:var(--t3);font-size:9px;margin-left:1px}
.xbtn{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--t3);cursor:pointer;font-size:13px;transition:.12s}
.xbtn:hover{border-color:var(--red);color:var(--red2)}

/* ---------- packages BOM section ---------- */
.bom-wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:4px}
@media(max-width:880px){.bom-wrap{grid-template-columns:1fr}}
.bom-sub{font-family:var(--disp);font-weight:600;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--t2);margin-bottom:8px}
.bom-sub .muted{font-weight:400;letter-spacing:0;text-transform:none;font-size:10px}
.bomt{width:100%;border-collapse:collapse;font-size:11.5px}
.bomt th,.bomt td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line)}
.bomt th{font-family:var(--disp);font-weight:600;font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--t2);background:var(--panel2)}
.bomt th:first-child,.bomt td.nm{text-align:left}
.bomt td.ce,.bomt td.am{font-family:var(--disp);font-weight:600;color:var(--t1);white-space:nowrap}
.bomt td.am{color:var(--red2)}
.bomt tr.tot td{font-family:var(--disp);font-weight:700;color:var(--t1);border-top:1.5px solid var(--line2);border-bottom:0;padding-top:8px}
.bomt tr.tot td.am{color:var(--red2)}
/* editable cells */
.bomt.edit td{padding:4px 6px}
.bomt.edit td.nm input{width:100%;background:transparent;border:1px solid transparent;border-radius:5px;color:var(--t1);font-family:var(--body);font-size:11.5px;padding:5px 6px;outline:none}
.bomt.edit td.nm input:hover{border-color:var(--line)}
.bomt.edit td.nm input:focus{border-color:var(--red);background:var(--panel2)}
.bomt.edit td.q{padding:3px 4px}
.bomt.edit td.q .step{display:inline-flex}
.bomt.edit td.u{width:108px}
.bomt.edit td.u .uedit{width:100px;margin-left:auto}
.bomt.edit td.x{width:34px;padding:3px}
.addrow{margin-top:8px;width:100%;border:1px dashed var(--line2);border-radius:7px;background:transparent;color:var(--t2);font-family:var(--disp);font-weight:600;font-size:10px;letter-spacing:.6px;text-transform:uppercase;padding:8px;cursor:pointer;transition:.12s}
.addrow:hover{border-color:var(--red);color:var(--t1)}
.bom-recon{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.bom-recon .rc{display:flex;flex-direction:column}
.bom-recon .rl{font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:var(--t3);font-family:var(--disp);font-weight:500}
.bom-recon .rv{font-family:var(--disp);font-weight:700;font-size:16px;color:var(--t1)}
.plus-reset{margin-left:auto;font-family:var(--body);font-size:10px;color:var(--t3);cursor:pointer;border:0;background:transparent;text-decoration:underline;text-underline-offset:2px}
.plus-reset:hover{color:var(--red2)}
.plus-reset:disabled{opacity:.4;cursor:default;text-decoration:none}
.bom-side{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px}
.bomname{background:transparent;border:1px solid transparent;border-radius:5px;color:var(--t1);font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;padding:2px 6px;outline:none;min-width:180px;width:auto}
.bomname:hover{border-color:var(--line2)}
.bomname:focus{border-color:var(--red);background:var(--panel2);text-transform:none;letter-spacing:.3px}
.addon-bom{margin-bottom:13px}
.addon-bom:last-child{margin-bottom:0}
.addon-bom .ab-h{font-family:var(--disp);font-weight:600;font-size:11.5px;color:var(--t1);margin-bottom:5px}
.addon-bom .ab-h .muted{font-weight:400;font-size:10px}

/* editable monthly fee (Solutions) + OT install fee */
.total.ovr{border-color:var(--amber);background:linear-gradient(160deg,#221a0c,#161618)}
.feebox{display:flex;align-items:center;gap:2px;background:rgba(0,0,0,.25);border:1px solid var(--line2);border-radius:9px;padding:4px 10px}
.feebox:focus-within{border-color:var(--red)}
.feebox .fpfx{font-family:var(--disp);font-weight:500;font-size:16px;color:var(--t2)}
.feebox .fsfx{font-family:var(--disp);font-size:12px;color:var(--t2);margin-left:2px}
.feebox input.feeinp{background:transparent;border:0;outline:none;color:#fff;font-family:var(--disp);font-weight:700;font-size:30px;line-height:1;width:auto;max-width:150px;text-align:right;padding:2px 0}
.total.ovr .feebox input.feeinp{color:var(--amber)}
.feebox input.feeinp::-webkit-outer-spin-button,.feebox input.feeinp::-webkit-inner-spin-button{-webkit-appearance:none}
.feebox.sm input.feeinp{font-size:18px;max-width:110px}
.feebox.sm{padding:3px 9px}
.otline{margin-top:8px;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:flex;justify-content:space-between;align-items:center;gap:10px}
.otline .otl{font-family:var(--disp);font-weight:600;font-size:12.5px;color:var(--t1)}
.otline .otsub{display:block;font-family:var(--body);font-weight:400;font-size:9.5px;color:var(--t3);margin-top:1px}
.otline.buy{border-color:var(--redDim);background:rgba(192,57,43,.07)}
.otline .otv{font-family:var(--disp);font-weight:700;font-size:18px;color:var(--t1);white-space:nowrap}
.feereset{text-align:right;margin-top:5px}
.feereset button{font-family:var(--body);font-size:10px;color:var(--t3);cursor:pointer;border:0;background:transparent;text-decoration:underline;text-underline-offset:2px}
.feereset button:hover{color:var(--red2)}

/* matrix table */
.mtx{width:100%;border-collapse:collapse;font-size:11px;margin-top:4px}
.mtx th,.mtx td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}
.mtx th{font-family:var(--disp);font-weight:600;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--t2);background:var(--panel2)}
.mtx th:first-child,.mtx td:first-child{text-align:left;font-family:var(--disp);font-weight:600}
.mtx td.num{font-family:var(--disp)}
.mtx tr.hl td{background:rgba(192,57,43,.10);color:var(--red2)}
.mtx tr.cap td{color:var(--amber)}

/* fleet */
.fleet{width:100%;border-collapse:collapse;font-size:12px}
.fleet th,.fleet td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
.fleet th{font-family:var(--disp);font-weight:600;font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--t2)}
.fleet th:first-child,.fleet td:first-child{text-align:left}
.fleet td{font-family:var(--disp);font-weight:500}
.fleet .gm{color:var(--green)}

/* leadership overhaul */
.scen{display:flex;flex-wrap:wrap;gap:6px}
.scen .chip{font-family:var(--disp);font-weight:600;font-size:10.5px;letter-spacing:.4px;color:var(--t1);background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:4px 9px}
.twostat{display:flex;align-items:stretch;gap:10px}
.twostat .ts{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.twostat .ts.wv{border-color:var(--amber);background:rgba(217,164,65,.07)}
.twostat .tsl{font-family:var(--disp);font-weight:600;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--t2)}
.twostat .ts.wv .tsl{color:var(--amber)}
.twostat .tsv{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1.1;color:var(--green);margin-top:3px}
.twostat .ts.wv .tsv{color:var(--amber)}
.twostat .tss{font-family:var(--disp);font-size:11px;color:var(--t2);margin-top:1px}
.twostat .tsarrow{align-self:center;font-family:var(--disp);font-size:20px;color:var(--t3)}
.lsch{width:100%;border-collapse:collapse;font-size:11.5px}
.lsch th,.lsch td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line)}
.lsch th{font-family:var(--disp);font-weight:600;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--t2)}
.lsch th:first-child,.lsch td:first-child{text-align:left}
.lsch td{font-family:var(--disp);font-weight:500;color:var(--t1)}
.lsch td.gm{color:var(--green)}
.lsch td.neg{color:var(--red2)}
.lsch td.mk{color:var(--t3);font-size:9.5px;text-align:left;white-space:nowrap}
.lsch tr.today td{background:rgba(192,57,43,.10)}
.lsch tr.today td:first-child{box-shadow:inset 2px 0 0 var(--red);font-weight:700}
.lsch tr.wv td{background:rgba(217,164,65,.10)}
.lsch tr.wv td.mk{color:var(--amber);font-weight:600}

.banner{display:flex;gap:11px;align-items:flex-start;border-radius:10px;padding:11px 13px;font-size:11.5px;line-height:1.5}
.banner.info{background:rgba(90,162,255,.07);border:1px solid #2a3f5a;color:var(--t2)}
.banner.warn{background:rgba(224,162,59,.07);border:1px solid #5a4a2a;color:var(--t2)}
.banner b{color:var(--t1);font-weight:600}
.flag{font-family:var(--disp);font-size:8.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}

.foot{text-align:center;color:var(--t3);font-size:10px;margin-top:22px;letter-spacing:.3px}
.hidden{display:none!important}
.muted{color:var(--t3)}
.eng-desc{font-size:11px;color:var(--t2);line-height:1.5;margin-top:10px;padding-top:11px;border-top:1px solid var(--line)}
.eng-desc b{color:var(--t1)}
</style>
</head>

  // working per-deal copy of the selected package BOM (Solutions Packages view)
  bom:null, bomPkg:null, bomEngine:null, bomName:null,
  // Solutions creative overrides (null = use the solver's recommendation)
  priceOverride:{hw:null, sw:null, pilot:null, add:null},  // per-bucket final price, default = recommended
  otFeeOverride:null,    // one-time install & onboarding fee (default 1× monthly)
  installCost:0,         // optional cost behind the OT fee (margin visibility)
  // SFL
  systems:1,
  sflFlyer:"sfl",        // "sfl" (vendor-piloted, current model) | "dxd" (DXD flies at the DJI/Skydio rate, no QC needed)
  sflPriceOverride:null, // hold a specific per-system client price instead of the recommendation (null = use recommended)
  // Hybrid (DJI + SFL Beehive, one site — surge model)
  surgeRate:PB.hybrid.surgeRate,       // $/hour when DJI is called into action
  surgeHoursEst:PB.hybrid.surgeHoursEst,// est. surge hours per month for scoping
  // pricing (live, Solutions-owned)
  pilotRate:PB.piloting.rate,
  pilotDays:PB.piloting.days,
  marginTarget:PB.margin.target,
  marginFloor:PB.margin.floor,   // adjustable across the board (was hard 30%)
  growth:"med",                  // leadership ramp tier: low | med | high
  advOpen:false
};

/* ---------- helpers ---------- */
const $ = (id)=>document.getElementById(id);
const money=(n,dec=0)=>n==null?"—":"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec});
const pct=(n)=>(n*100).toFixed(1)+"%";
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function leversAvailable(){ return (S.engine==="dji"||S.engine==="hybrid"||S.engine==="skydio"||(S.engine==="sfl"&&S.sflFlyer==="dxd")) && S.cadence==="recurring" && S.deployment==="deployed"; }
function cornerLabel(){
  const c=S.cadence==="recurring"?"Recurring":"One-time";
  const d=S.deployment==="deployed"?"deployed on-site":"mobilized";
  return c+" · "+d;
}

/* ---------- package / add-on derivation ---------- */
function pkgEngineKey(){ return S.engine==="skydio" ? "skydio" : "dji"; }  // hybrid's package selector is the DJI half
function sumLines(lines){ let s=0; (lines||[]).forEach(l=>s+=(+l.qty||0)*(+l.unit||0)); return s; }
function bomTotals(bom, opts){
  // opts: {qty, includeTraining, amortMonths} — all optional. Lines flagged perSite:true
  // don't multiply by qty (site-level, not per-dock); lines flagged training:true drop
  // out entirely when includeTraining is false. Omitting opts reproduces the original
  // qty-1/training-included/36-month behavior exactly, so DJI and every other caller
  // that doesn't pass opts is unaffected by this generalization.
  const qty = (opts && opts.qty) || 1;
  const inclTraining = !opts || opts.includeTraining !== false;
  const amortMonths = (opts && opts.amortMonths) || 36;
  let hwCapex=0, sw=0;
  (bom.hw||[]).forEach(l=>{ if(l.training && !inclTraining) return; hwCapex += (+l.qty||0)*(+l.unit||0)*(l.perSite?1:qty); });
  (bom.sw||[]).forEach(l=>{ if(l.training && !inclTraining) return; sw += (+l.qty||0)*(+l.unit||0)*(l.perSite?1:qty); });
  return {hwCapex, hwAmort:hwCapex/amortMonths, sw};
}
function skydioOpts(){
  return {
    qty: Math.max(1, Math.round(+S.skydioSystems||1)),
    includeTraining: S.skydioTraining!==false,
    amortMonths: Math.max(1, Math.round(+S.skydioTerm||36)),
  };
}
function bomOptsFor(ek){ return ek==="skydio" ? skydioOpts() : undefined; }
function computeSkydioAtTerm(term){
  // Same BOM, same everything else — just asks "what would this look like on
  // the other term" without touching the term the user actually has selected.
  const saved=S.skydioTerm;
  S.skydioTerm=String(term);
  const result=computeDockEngine("skydio");
  S.skydioTerm=saved;
  return result;
}
function pkgBaseTotals(key, ek){ ek=ek||pkgEngineKey(); const pkgs=PB[ek].packages; return bomTotals(pkgs[key]||pkgs[Object.keys(pkgs)[0]], bomOptsFor(ek)); }
function ensureBOM(){
  // per-deal working copy of the selected package BOM; reloads when the package OR engine changes
  const ek=pkgEngineKey();
  if(!S.bom || S.bomPkg!==S.pkg || S.bomEngine!==ek){
    let p=PB[ek].packages[S.pkg];
    if(!p){ S.pkg=Object.keys(PB[ek].packages)[0]; p=PB[ek].packages[S.pkg]; }  // self-correct rather than crash if engine/pkg ever fall out of sync
    S.bom={ hw:p.hw.map(x=>({...x})), sw:p.sw.map(x=>({...x})) };
    S.bomPkg=S.pkg; S.bomEngine=ek; S.bomName=null;
  }
  return S.bom;
}
function addOnUnit(a){
  const hwCapex=sumLines(a.hw), sw=sumLines(a.sw);
  return {price:a.price, hwCapex, sw, hwAmort:hwCapex/36, cost:hwCapex/36+sw};
}

/* ---------- ENGINE ---------- */
function computeDockEngine(key){
  const pb=PB[key];
  const pkg=pb.packages[S.pkg];
  const bom=ensureBOM();                       // per-deal working BOM (verified in Packages view)
  const bomOpts=bomOptsFor(key);
  const pkgT=bomTotals(bom, bomOpts);          // derived package totals — always tie out to the lines
  const amortMonths=(bomOpts && bomOpts.amortMonths) || 36;
  const av=leversAvailable();
  const op = av ? S.opRatio : 1;             // operational ratio (LIVE today)
  const m = S.marginTarget;
  const pilotFull = S.pilotRate * S.coverage * S.pilotDays;   // full monthly pilot cost (1 pilot)

  // hardware ownership: DXD-owned (amortized into the monthly) vs client buys outright
  const clientOwns = S.hwMode==="purchased";

  // monthly cost / client — QUOTE is built on the operational ratio (what's defensible today)
  const hwCost = clientOwns ? 0 : pkgT.hwAmort + (S.financed? pb.financedMonthlyAdd:0);
  const swCost = pkgT.sw;
  const opPilotCost = pilotFull/op;

  // four numbers — core buckets marked up to clear target margin (held)
  const hwPrice = hwCost/(1-m);
  const swPrice = swCost/(1-m);
  const pilotPrice = opPilotCost/(1-m);

  // one-time hardware sale (client-purchased path): package iron sold outright, marked to margin
  const hwBuyCost  = clientOwns ? pkgT.hwCapex : 0;
  const hwBuyPrice = clientOwns ? hwBuyCost/(1-m) : 0;
  const hwBuyMargin = hwBuyPrice>0 ? (hwBuyPrice-hwBuyCost)/hwBuyPrice : 0;

  // add-ons (priced menu — margin embedded). Quantity-capable; each is a HW+SW bundle.
  // Add-on HW capitalizes into the upfront; its monthly cost = HW amort + SW.
  let addPrice=0, addCost=0, addHwCapex=0; const adds=[];
  PB.addOns.forEach(a=>{
    const q=S.addOns[a.id]||0;
    if(q>0 && a.price!=null){
      const u=addOnUnit(a);
      addPrice+=q*u.price; addCost+=q*u.cost; addHwCapex+=q*u.hwCapex;
      adds.push({id:a.id,name:a.name,type:a.type,qty:q,unit:u});
    }
  });

  // recommended (solver) bucket prices
  const recoBuckets = {hw:hwPrice, sw:swPrice, pilot:pilotPrice, add:addPrice};
  const recoMonthly = hwPrice+swPrice+pilotPrice+addPrice;     // solver's recommended price
  const opCost = hwCost+swCost+opPilotCost+addCost;

  // Solutions can override the FINAL price of each of the four buckets (default = recommended).
  // The monthly fee is the sum of the (overridden-or-recommended) bucket prices.
  const ov=S.priceOverride;
  const bP = {
    hw:    ov.hw   !=null ? ov.hw    : hwPrice,
    sw:    ov.sw   !=null ? ov.sw    : swPrice,
    pilot: ov.pilot!=null ? ov.pilot : pilotPrice,
    add:   ov.add  !=null ? ov.add   : addPrice,
  };
  const overridden = (ov.hw!=null||ov.sw!=null||ov.pilot!=null||ov.add!=null);
  const clientFee = bP.hw+bP.sw+bP.pilot+bP.add;
  const margin = clientFee>0 ? (clientFee-opCost)/clientFee : 0;  // realized at the fee actually charged
  const recoMargin = recoMonthly>0 ? (recoMonthly-opCost)/recoMonthly : 0; // at the solver price (capture rails)
  const monthlyNet = clientFee-opCost;
  const totalPrice = clientFee;                                  // downstream uses the fee charged

  // one-time Install & Onboarding fee — defaults to a per-engine multiple of the
  // monthly fee (1x for DJI; $0 for Skydio, since Axon's own Commissioning &
  // Training already covers onboarding), Solutions-adjustable either way.
  // Carries install/travel; optional installCost surfaces its margin without v10's travel sprawl.
  const installMultiple = pb.defaultInstallMultiple!=null ? pb.defaultInstallMultiple : 1;
  const defaultOtFee = clientFee*installMultiple;
  const otFee = (S.otFeeOverride!=null) ? S.otFeeOverride : defaultOtFee;
  const installCost = +S.installCost||0;
  const otMargin = otFee>0 ? (otFee-installCost)/otFee : 0;

  // capital (per client) — DXD's hardware outlay. When the client buys the package iron
  // outright, that CapEx is client-funded (no DXD hole); only add-on iron remains DXD's.
  const hwCapexTotal = pkgT.hwCapex + addHwCapex;
  const djdCapex = clientOwns ? addHwCapex : hwCapexTotal;
  const upfront = S.financed && !clientOwns ? djdCapex*pb.financedFactor : djdCapex;
  const payback = monthlyNet>0 ? upfront/monthlyNet : Infinity;

  // REGULATORY PROVISION — hold the price (the fee charged), drop the cost (pilot spread over effective ratio).
  let proj=null;
  if(av){
    const reg=S.regMult;
    const effRaw=op*reg, capped=effRaw>PB.qcCap, eff=Math.min(effRaw,PB.qcCap);
    const realPilot=pilotFull/eff;
    const realCost=hwCost+swCost+realPilot+addCost;
    const realNet=clientFee-realCost;           // per client, price held at the fee charged
    const realMargin=clientFee>0?realNet/clientFee:0;
    const routeNet=eff*realNet;                 // one pilot now carries `eff` clients
    proj={reg,eff,capped,realMargin,realNet,routeNet,
          gain:realNet-monthlyNet, addRoute:routeNet-(op*monthlyNet)};
  }

  return {engineKey:key,pkg,pkgT,bom,addHwCapex,hwCapexTotal,djdCapex,adds,av,op,pilotFull,
    nonPilotCost:hwCost+swCost+addCost,
    clientOwns,hwBuyCost,hwBuyPrice,hwBuyMargin,
    recoMonthly,clientFee,overridden,recoMargin,otFee,defaultOtFee,installCost,otMargin,
    rows:[
      {key:"hw", b:"Hardware", s:clientOwns?("Client-owned \u2014 one-time "+money(hwBuyPrice,0)):((S.financed?amortMonths+"-mo financed":amortMonths+"-mo amortized")+" \u00B7 "+bom.hw.length+" line"+(bom.hw.length!==1?"s":"")), v:bP.hw, reco:recoBuckets.hw, ov:ov.hw!=null, c:hwCost},
      {key:"sw", b:"Software", s:"Monthly licenses \u00B7 "+bom.sw.length+" line"+(bom.sw.length!==1?"s":""), v:bP.sw, reco:recoBuckets.sw, ov:ov.sw!=null, c:swCost},
      {key:"pilot", b:"Piloting", s:"Pilot \u00F7 operational 1:"+op+" @ "+S.coverage+"hr", v:bP.pilot, reco:recoBuckets.pilot, ov:ov.pilot!=null, c:opPilotCost},
      {key:"add", b:"Add-Ons", s:adds.length?adds.map(a=>a.name+(a.qty>1?" \u00D7"+a.qty:"")).join(", "):"None selected", v:bP.add, reco:recoBuckets.add, ov:ov.add!=null, c:addCost, menu:true},
    ],
    totalPrice,totalCost:opCost,margin,monthlyNet,upfront,payback,proj};
}
function computeDJI(){ return computeDockEngine("dji"); }
function computeSkydio(){ return computeDockEngine("skydio"); }

function sflInterpolate(table,cov){
  if(cov<=8)  return table[8]*cov/8;
  if(cov<=12) return table[8]+(table[12]-table[8])*(cov-8)/4;
  return table[12]+(table[24]-table[12])*(cov-12)/12;
}

function computeSFL(){
  const cov=S.coverage;
  const sys=S.systems;
  let disc=0.161; for(const t of PB.sfl.volumeDiscount){ if(sys<=t.max){disc=t.d;break;} }
  const leasePer=PB.sfl.baseLease*(1-disc);
  const swPer=PB.sfl.sw;
  const selfFly = S.sflFlyer==="dxd";
  const av = leversAvailable();
  const op = (selfFly && av) ? S.opRatio : 1;

  // Piloting: SFL's flat contracted number (pass-through, vendor-flown) OR the
  // same rate × coverage × days formula already established for DJI & Skydio —
  // including the same 1:many operational-ratio leverage — when DXD flies
  // instead. Self-flown drops SFL's QC line entirely — there's no third-party
  // piloting left to audit.
  const pilotFull = S.pilotRate * cov * S.pilotDays;
  const pilotCostPer = selfFly ? (pilotFull/op) : sflInterpolate(PB.sfl.piloting,cov);
  const pilotPer = selfFly ? pilotCostPer/(1-S.marginTarget) : pilotCostPer;
  const qcPer = selfFly ? 0 : PB.sfl.qcOps;

  // Recommended client price: SFL-flown keeps the existing flat package price
  // (table lookup, unchanged). Self-flown rebuilds bottom-up since the cost
  // structure genuinely changed (margined piloting in, QC out) — lease and
  // software stay pass-through either way.
  const recoPricePer = selfFly ? (leasePer + swPer + pilotPer) : sflInterpolate(PB.sfl.clientPrice,cov);
  const costPer=leasePer+pilotCostPer+swPer+qcPer;

  // Solutions can hold a specific per-system price instead of the recommendation
  // — same idea as DJI/Skydio's bucket overrides, but as one number, since SFL
  // doesn't price four independent buckets the way the dock engines do.
  const overridden = S.sflPriceOverride!=null;
  const pricePer = overridden ? S.sflPriceOverride : recoPricePer;
  const netPer=pricePer-costPer;
  const marginPer=pricePer>0?netPer/pricePer:0;

  const totalPrice=pricePer*sys, totalCost=costPer*sys, net=netPer*sys;
  const netAtDeploy=(PB.sfl.deployCapex-PB.sfl.installCharge)*sys;

  const rows=[
    {key:"hw", b:"Hardware", s:"Beehive lease (pass-through, 36-mo)", v:leasePer*sys, c:leasePer*sys, passthrough:true},
    {key:"sw", b:"Software", s:"Dronetag license", v:swPer*sys, c:swPer*sys, passthrough:true},
    {key:"pilot", b:"Piloting", s: selfFly ? ("DXD-piloted \u00B7 1:"+op+" \u00B7 "+money(S.pilotRate)+"/hr \u00D7 "+cov+"hr \u00D7 "+S.pilotDays+"d, margined to "+pct(S.marginTarget)) : "SFL contracted (1:many baked in)", v:pilotPer*sys, c:pilotCostPer*sys},
  ];
  if(!selfFly) rows.push({key:"qc", b:"QC Ops", s:"DXD oversight of SFL quality", v:qcPer*sys, c:qcPer*sys});

  // Upfront/payback — same shape as DJI/Skydio, just tiny here since the lease
  // (not a hardware purchase) is what's due at deploy, net of the install charge.
  const upfront = netAtDeploy;
  const payback = net>0 ? upfront/net : Infinity;

  // REGULATORY PROVISION — identical shape to computeDockEngine's proj, so the
  // same 1:Many Leverage card and Op×Reg matrix render for SFL self-fly with
  // no separate code path. Hold the price (pricePer), drop the cost (pilot
  // spread over the effective ratio) — computed per system, same as the rest
  // of this engine's per-unit figures.
  let proj=null;
  if(selfFly && av){
    const reg=S.regMult;
    const effRaw=op*reg, capped=effRaw>PB.qcCap, eff=Math.min(effRaw,PB.qcCap);
    const realPilotPer=pilotFull/eff;
    const realCostPer=leasePer+swPer+realPilotPer;   // no QC — self-flown
    const realNetPer=pricePer-realCostPer;
    const realMarginPer=pricePer>0?realNetPer/pricePer:0;
    const routeNetPer=eff*realNetPer;
    proj={reg,eff,capped,realMargin:realMarginPer,realNet:realNetPer,routeNet:routeNetPer,
          gain:realNetPer-netPer, addRoute:routeNetPer-(op*netPer)};
  }

  return {sys,disc,leasePer,pricePer,recoPricePer,overridden,selfFly,av,op,pilotFull,
    rows,
    totalPrice,totalCost,margin:(totalPrice-totalCost)/totalPrice,net,netAtDeploy,upfront,payback,proj,perSys:{pricePer,costPer,netPer,marginPer}};
}

/* Hybrid — one DJI system + SFL Beehive at the same site, plus a customizable
   surge premium. Reuses computeDJI()/computeSFL() unmodified so the math is
   guaranteed identical to the pure-DJI and pure-SFL paths — this just sums them. */
function computeHybrid(){
  const dji=computeDJI();
  const sfl=computeSFL();

  // In Hybrid, DJI piloting is NOT full-shift like in pure DJI mode. SFL runs
  // the constant patrol; DJI only launches when the client calls for it. So
  // we strip the pilot bucket out of DJI's monthly and treat piloting as a
  // per-hour cost that only incurs during actual surge use.
  const djiPilotRow = dji.rows.find(r=>r.key==='pilot');
  const djiPilotFee = djiPilotRow ? djiPilotRow.v : 0;
  const djiPilotCost = djiPilotRow ? djiPilotRow.c : 0;

  // Fixed monthly = DJI HW/SW/Add-ons + SFL (guaranteed regardless of surge use)
  const djiFixedFee  = dji.clientFee - djiPilotFee;
  const djiFixedCost = dji.totalCost - djiPilotCost;
  const fixedMonthly = djiFixedFee + sfl.totalPrice;
  const fixedCost    = djiFixedCost + sfl.totalCost;

  // Variable surge economics — $/hr charged when client calls DJI into action.
  // Cost is the pilot rate for those hours (the pilot flies DJI during surge).
  const surgeRate    = +S.surgeRate || 0;
  const surgeHoursEst= +S.surgeHoursEst || 0;
  const surgeRev     = surgeRate * surgeHoursEst;
  const surgeCost    = S.pilotRate * surgeHoursEst;
  const surgeNet     = surgeRev - surgeCost;
  const surgeMargin  = surgeRev>0 ? surgeNet/surgeRev : 0;

  // Estimated combined totals (fixed + est. surge)
  const totalPrice   = fixedMonthly + surgeRev;
  const totalCost    = fixedCost + surgeCost;
  const monthlyNet   = totalPrice - totalCost;
  const margin       = totalPrice>0 ? monthlyNet/totalPrice : 0;
  const fixedMargin  = fixedMonthly>0 ? (fixedMonthly-fixedCost)/fixedMonthly : 0;

  // Rows: DJI without the pilot bucket + SFL + surge line
  const rows=[
    ...dji.rows.filter(r=>r.key!=='pilot').map(x=>({...x,b:"DJI \u2014 "+x.b})),
    ...sfl.rows.map(x=>({...x,b:"SFL \u2014 "+x.b})),
    {key:"surge", b:"Surge (est.)",
     s:"$"+surgeRate+"/hr when client needs DJI \u00B7 est. "+surgeHoursEst+" hr/mo",
     v:surgeRev, reco:surgeRev, ov:false, c:surgeCost, menu:true},
  ];

  return {dji, sfl,
    surgeRate, surgeHoursEst, surgeRev, surgeCost, surgeNet, surgeMargin,
    djiFixedFee, djiFixedCost, fixedMonthly, fixedCost, fixedMargin,
    totalPrice, totalCost, monthlyNet, margin, rows};
}

/* J-curve ramp for leadership view */
function jcurve(upfront, monthlyNet, perMonth, months, cap){
  let active=0, cum=0, trough=0, be=null; const series=[];
  for(let m=1;m<=months;m++){
    let add=perMonth; if(cap!=null && active+add>cap) add=Math.max(0,cap-active);
    active+=add;
    cum += active*monthlyNet - add*upfront;
    trough=Math.min(trough,cum);
    if(cum>0 && be===null) be=m;
    series.push(cum);
  }
  return {series,peak:-trough,be,active,end:cum};
}
