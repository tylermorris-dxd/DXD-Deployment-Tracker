        </div>
      </div>
      <div class="fieldset" style="margin-bottom:0">
        <div class="lbl">Hardware ownership <span class="hint">who carries the iron</span></div>
        <div class="seg two">
          ${opt("hwMode","amortized","DXD-owned","Amortized into the monthly")}
          ${opt("hwMode","purchased","Client buys","Outright \u2014 MRR is SW + Piloting + Add-ons")}
        </div>
      </div>
    `));

    // leverage
    if(leversAvailable()){
      if(S.face==="capture"){
        L.push(card("Operational Ratio","one pilot, sequenced coverage", `
          <div class="fieldset" style="margin-bottom:0">
            <div class="lbl">Sites per pilot <span class="hint">scoping presets</span></div>
            <div class="pills">${[1,4,7].map(x=>`<div class="pill ${S.opRatio===x?'on':''}" data-set="opRatio" data-val="${x}">1:${x}</div>`).join("")}</div>
            <div class="note">One pilot covers ${S.opRatio} site${S.opRatio>1?'s':''} across a shift \u2014 live and within the waiver today. Deeper ratios and the regulatory provision live in Solutions.</div>
          </div>
        `));
      } else {
        L.push(card("1:Many Leverage","inside the piloting bucket", `
          <div class="fieldset">
            <div class="lbl">Operational ratio <span class="hint">live today</span></div>
            <div class="slider-row">
              <input type="range" min="1" max="7" value="${S.opRatio}" data-range="opRatio">
              <div class="sval">1:${S.opRatio}</div>
            </div>
            <div class="note">One pilot covers ${S.opRatio} site${S.opRatio>1?'s':''} across a shift — sequenced coverage, fully within the waiver.</div>
          </div>
          <div class="fieldset">
            <div class="tg ${S.regOn?'on':''}" data-toggle="regOn">
              <div class="sw"></div>
              <div><div style="font-family:var(--disp);font-weight:600;font-size:12.5px">Model Regulatory 1:Many <span class="flag">Pending IP</span></div>
              <div class="note" style="margin-top:2px">Simultaneous multi-flight per pilot — layers on top once the IP clears testing.</div></div>
            </div>
            ${S.regOn?`<div style="margin-top:11px"><div class="lbl">Regulatory multiplier</div>
              <div class="pills">${[2,3,4].map(x=>`<div class="pill sm ${S.regMult===x?'on':''}" data-set="regMult" data-val="${x}">×${x}</div>`).join("")}</div></div>`:""}
          </div>
        `));
      }
    }
  }

  // Skydio-only: systems on site, amortization term, training toggle
  if(S.engine==="skydio"){
    const skyPkg=PB.skydio.packages[S.pkg]||PB.skydio.packages[Object.keys(PB.skydio.packages)[0]];
    const trainingValue=sumLines((skyPkg.hw||[]).filter(l=>l.training));
    L.push(card("Skydio Fleet & Terms","systems, contract term, training", `
      <div class="fieldset">
        <div class="lbl">Systems on site <span class="hint">additional docks</span></div>
        <div class="slider-row">
          <input type="range" min="1" max="20" value="${S.skydioSystems}" data-range="skydioSystems">
          <div class="sval">${S.skydioSystems}</div>
        </div>
        <div class="note">Scales the airframe, sensors, camera, and recurring software per dock. Drone Tag Scout, the non-penetrating mount, Professional Implementation, and training are site-level and don't repeat per dock \u2014 the same convention DJI's own Enhanced package uses (it holds those lines flat too). Piloting/coverage hours are a separate setting and don't auto-scale with systems count.</div>
      </div>
      <div class="fieldset">
        <div class="lbl">Amortization term <span class="hint">what DXD spreads hardware over</span></div>
        <div class="seg two">
          ${opt("skydioTerm","36","36 mo","DXD's standard convention")}
          ${opt("skydioTerm","60","60 mo","Matches Axon's contract \u2014 zero tail risk")}
        </div>
        ${(()=>{
          const r36=computeSkydioAtTerm(36), r60=computeSkydioAtTerm(60);
          const row=(label,r,active)=>`<tr class="${active?'today':''}"><td>${label}</td><td>${money(r.clientFee,0)}</td><td class="gm">${money(r.monthlyNet,0)}</td><td>${isFinite(r.payback)?'Mo '+Math.ceil(r.payback):'\u2014'}</td></tr>`;
          return `<table class="lsch" style="margin-top:10px">
            <tr><th>Term</th><th>Monthly fee</th><th>Net/mo</th><th>Cash-positive</th></tr>
            ${row('36 mo',r36,S.skydioTerm==="36")}
            ${row('60 mo',r60,S.skydioTerm==="60")}
          </table>
          <div class="note" style="margin-top:8px">${S.hwMode==="purchased"
            ? `Term doesn't move these numbers right now \u2014 the client owns the hardware outright, so nothing is being amortized either way.`
            : `Same upfront (${money(r36.upfront,0)}) either term \u2014 only how fast you recoup it changes. 60mo prices ${money(r36.clientFee-r60.clientFee,0)}/mo cheaper to the client and still clears cash-positive well inside a typical 36-month contract, since it also matches Axon's own 60-month term \u2014 no tail risk. 36mo recovers faster and nets more per month once you're past breakeven, at a higher ask.`}</div>`;
        })()}
      </div>
      <div class="fieldset" style="margin-bottom:0">
        <div class="tg ${S.skydioTraining?'on':''}" data-toggle="skydioTraining">
          <div class="sw"></div>
          <div><div style="font-family:var(--disp);font-weight:600;font-size:12.5px">Include Axon Training &amp; Commissioning</div>
          <div class="note" style="margin-top:2px">${S.skydioTraining?`Included \u2014 adds ${money(trainingValue,0)} to hardware CapEx (Commissioning &amp; Training + Instructor Training), amortized like the rest of the hardware.`:`Excluded \u2014 saves ${money(trainingValue,0)} in hardware CapEx. Switch on if the client needs Axon-led onboarding.`}</div></div>
        </div>
      </div>
    `));
  }

  // config — SFL half (sfl or hybrid)
  if(S.engine==="sfl" || S.engine==="hybrid"){
    L.push(card(S.engine==="hybrid"?"Configuration \u2014 SFL Beehive":"Configuration","systems & coverage", `
      <div class="fieldset">
        <div class="lbl">Who flies? <span class="hint">changes the piloting line</span></div>
        <div class="seg two">
          ${opt("sflFlyer","sfl","SFL Flies","Vendor-piloted \u00B7 today's model, QC included")}
          ${opt("sflFlyer","dxd","DXD Flies","Same rate as DJI &amp; Skydio \u00B7 QC not needed")}
        </div>
        <div class="note" style="margin-top:8px">${S.sflFlyer==="dxd"
          ? `DXD provides the pilot at ${money(S.pilotRate)}/hr \u00D7 ${S.coverage}hr/day \u00D7 ${S.pilotDays} days, split 1:${S.opRatio} and margined to ${pct(S.marginTarget)} \u2014 the same formula and leverage as DJI and Skydio. SFL's QC Ops line drops out since there's no third-party flying left to audit. At 1:1 (no leverage) this pilot costs ${money(S.pilotRate*S.coverage*S.pilotDays,0)}/mo dedicated to just this client \u2014 pick a ratio that reflects how many sites this pilot actually covers.`
          : `SFL contracts and flies its own pilots at a flat rate; DXD pays that rate and keeps a QC Ops line to oversee SFL's flying quality.`}</div>
      </div>
      <div class="fieldset">
        <div class="lbl">Systems on site <span class="hint">drops the lease at volume</span></div>
        <div class="slider-row">
          <input type="range" min="1" max="24" value="${S.systems}" data-range="systems">
          <div class="sval">${S.systems}</div>
        </div>
      </div>
      ${S.engine==="sfl" ? `
      <div class="fieldset">
        <div class="lbl">Coverage hours / day</div>
        <div class="slider-row">
          <input type="range" min="1" max="24" value="${S.coverage}" data-range="coverage">
          <div class="sval">${S.coverage}hr</div>
        </div>
      </div>` : `<div class="note">Coverage hours are shared with the DJI configuration above (currently ${S.coverage}hr/day).</div>`}
      <div class="note">Thermal &amp; 36-mo term are Solutions-owned defaults. Volume discount auto-applies off systems.</div>
    `));

    // 1:Many leverage — only meaningful once DXD is actually flying (SFL's own
    // contracted piloting already has leverage vendor-baked into its rate).
    // Same card structure as DJI/Skydio: simple presets in Capture, full
    // slider + regulatory provision in Solutions.
    if(S.engine==="sfl" && S.sflFlyer==="dxd" && leversAvailable()){
      if(S.face==="capture"){
        L.push(card("Operational Ratio","one pilot, sequenced coverage", `
          <div class="fieldset" style="margin-bottom:0">
            <div class="lbl">Sites per pilot <span class="hint">scoping presets</span></div>
            <div class="pills">${[1,4,7].map(x=>`<div class="pill ${S.opRatio===x?'on':''}" data-set="opRatio" data-val="${x}">1:${x}</div>`).join("")}</div>
            <div class="note">One pilot covers ${S.opRatio} site${S.opRatio>1?'s':''} across a shift \u2014 same leverage model as DJI/Skydio. Deeper ratios and the regulatory provision live in Solutions.</div>
          </div>
        `));
      } else {
        L.push(card("1:Many Leverage","inside the piloting bucket", `
          <div class="fieldset">
            <div class="lbl">Operational ratio <span class="hint">live today</span></div>
            <div class="slider-row">
              <input type="range" min="1" max="7" value="${S.opRatio}" data-range="opRatio">
              <div class="sval">1:${S.opRatio}</div>
            </div>
            <div class="note">One pilot covers ${S.opRatio} site${S.opRatio>1?'s':''} across a shift — sequenced coverage, fully within the waiver.</div>
          </div>
          <div class="fieldset">
            <div class="tg ${S.regOn?'on':''}" data-toggle="regOn">
              <div class="sw"></div>
              <div><div style="font-family:var(--disp);font-weight:600;font-size:12.5px">Model Regulatory 1:Many <span class="flag">Pending IP</span></div>
              <div class="note" style="margin-top:2px">Simultaneous multi-flight per pilot — layers on top once the IP clears testing.</div></div>
            </div>
            ${S.regOn?`<div style="margin-top:11px"><div class="lbl">Regulatory multiplier</div>
              <div class="pills">${[2,3,4].map(x=>`<div class="pill sm ${S.regMult===x?'on':''}" data-set="regMult" data-val="${x}">×${x}</div>`).join("")}</div></div>`:""}
          </div>
        `));
      }
    }
  }

  // Hybrid surge model — hourly rate + estimated hours, appears in all three faces
  if(S.engine==="hybrid"){
    const rh=computeHybrid();
    L.push(card("Surge Pricing","hourly \u00B7 charged only when DJI is called", `
      <div class="fieldset">
        <div class="lbl">Surge rate / hour <span class="hint">what the client pays when DJI launches</span></div>
        <div class="feebox sm"><span class="fpfx">$</span><input type="number" class="feeinp" value="${Math.round(S.surgeRate)}" data-num="surgeRate"><span class="fsfx">/hr</span></div>
      </div>
      <div class="fieldset" style="margin-bottom:0">
        <div class="lbl">Estimated surge hours / month <span class="hint">for scoping only</span></div>
        <div class="slider-row">
          <input type="range" min="0" max="80" value="${S.surgeHoursEst}" data-range="surgeHoursEst">
          <div class="sval">${S.surgeHoursEst} hr</div>
        </div>
        <div class="note" style="margin-top:8px">At <b>${money(S.surgeRate,0)}/hr \u00D7 ${S.surgeHoursEst} hr/mo</b>, expected surge revenue is <b>${money(rh.surgeRev,0)}/mo</b> against ${money(rh.surgeCost,0)} pilot cost \u2014 <b style="color:var(--green)">${money(rh.surgeNet,0)} net</b> at <b>${pct(rh.surgeMargin)}</b> margin. Actual revenue varies with real client usage.</div>
      </div>
    `));
  }

  // add-ons (dock engines — SFL is a self-contained lease). Quantity-based: a client can take several.
  if(S.engine==="dji" || S.engine==="hybrid" || S.engine==="skydio"){
    L.push(card("Add-Ons","pre-priced menu \u00B7 set a quantity", PB.addOns.map(a=>{
      const dis=a.price==null;
      const q=S.addOns[a.id]||0; const on=q>0;
      const tagcls=a.type==="cap"?"cap":a.type==="plan"?"plan":"inf";
      const tagtxt=a.type==="cap"?"Capability":a.type==="plan"?"Planned":"Network";
      const stepper = dis
        ? `<span class="muted" style="font-family:var(--disp);font-size:11px">TBD</span>`
        : `<div class="step">
             <button data-aonstep="${a.id}" data-dir="-1" aria-label="decrease">\u2212</button>
             <input type="number" min="0" value="${q}" data-aonqty="${a.id}">
             <button data-aonstep="${a.id}" data-dir="1" aria-label="increase">+</button>
           </div>`;
      return `<div class="aon ${on?'on':''} ${dis?'dis':''}">
        <div class="cmeta">
          <div class="cn"><span>${a.name} <span class="tag ${tagcls}">${tagtxt}</span></span>
            <span class="cpr">${dis?'':money(a.price)+'/mo'}</span></div>
          <div class="cd">${a.note}</div>
        </div>
        ${stepper}</div>`;
    }).join("")));
  }

  $("leftcol").innerHTML=L.join("");
}

/* ---------------- RIGHT (results) ---------------- */
function renderRight(){
  const R=[];

  if(S.engine==="hybrid"){
    renderRightHybrid(R);
    $("rightcol").innerHTML=R.join("");
    return;
  }

  const isDock = (S.engine==="dji" || S.engine==="skydio");  // DJI and Skydio share one engine shape
  const r = isDock ? computeDockEngine(S.engine) : computeSFL();

  // four numbers
  if(isDock){
    const sol = S.face!=="capture";
    const buyLine = r.clientOwns
      ? `<div class="otline buy">
           <div class="otl">Hardware purchase <span class="otsub">one-time \u00B7 client owns the DJI iron \u00B7 ${pct(r.hwBuyMargin)} margin</span></div>
           <div class="otv">${money(r.hwBuyPrice,0)}</div>
         </div>` : "";
    const totalBlock = sol
      ? `<div class="total ${r.overridden?'ovr':''}">
           <div class="tl">Monthly fee (MRR)<small>${r.overridden?`sum of the four \u00B7 solver recommends ${money(r.recoMonthly,0)}`:'sum of the four \u2014 edit any bucket above to re-solve margin'}</small></div>
           <div class="tv">${money(r.clientFee,0)}<span>/mo</span></div>
         </div>
         ${r.overridden?`<div class="feereset"><button data-povreset="1">reset all four to recommended (${money(r.recoMonthly,0)})</button></div>`:''}
         ${buyLine}
         <div class="otline">
           <div class="otl">Install &amp; Onboarding <span class="otsub">one-time \u00B7 ${r.engineKey==="skydio"?"defaults to $0 \u2014 Axon's commissioning is already priced in":"default 1\u00D7 monthly"}</span></div>
           <div class="feebox sm"><span class="fpfx">$</span><input type="number" class="feeinp" value="${Math.round(r.otFee)}" data-otfee="1"><span class="fsfx">once</span></div>
         </div>
         ${(S.otFeeOverride!=null)?`<div class="feereset"><button data-otreset="1">reset to default (${money(r.defaultOtFee,0)})</button></div>`:''}`
      : `<div class="total">
           <div class="tl">Recommended monthly<small>${r.clientOwns?`hardware bought out \u2014 one-time ${money(r.hwBuyPrice,0)}${r.defaultOtFee>0?` + install ${money(r.defaultOtFee,0)}`:''}`:(r.defaultOtFee>0?`+ one-time install &amp; onboarding ${money(r.defaultOtFee,0)}`:'no separate one-time install fee by default')}</small></div>
           <div class="tv">${money(r.recoMonthly,0)}<span>/mo</span></div>
         </div>
         ${r.clientOwns?`<div class="otline buy"><div class="otl">Hardware purchase <span class="otsub">one-time \u00B7 client owns the iron</span></div><div class="otv">${money(r.hwBuyPrice,0)}</div></div>`:''}`;
    R.push(card("The Four Numbers", r.overridden?"prices set \u2014 margin re-solved":"cost-built \u00B7 marked to "+pct(S.marginTarget), `
      <div class="fournum">
        ${r.rows.map(row=> sol
          ? `<div class="nr">
               <div class="nl"><b>${row.b}</b><span>${row.s}</span></div>
               <div class="nv">
                 <div class="povbox ${row.ov?'ovr':''}"><span class="fpfx">$</span><input type="number" class="povinp" value="${Math.round(row.v)}" data-pov="${row.key}"><span class="fsfx">/mo</span></div>
                 <small>cost ${money(row.c,0)}${row.ov?` \u00B7 reco ${money(row.reco,0)}`:''}</small>
               </div>
             </div>`
          : `<div class="nr">
               <div class="nl"><b>${row.b}</b><span>${row.s}</span></div>
               <div class="nv">${money(row.reco,0)}</div>
             </div>`).join("")}
      </div>
      ${totalBlock}
      ${marginBlock(sol?r.margin:r.recoMargin)}
      ${sol && r.installCost>0?`<div class="note" style="margin-top:8px">Install &amp; onboarding margin: <b style="color:var(--${r.otMargin>=0.3?'green':'amber'})">${pct(r.otMargin)}</b> at ${money(r.installCost,0)} cost. Adjust install cost in Advanced.</div>`:''}
    `));
  } else {
    const sol = S.face!=="capture";
    R.push(card("Cost Stack \u2192 Client Price","per system · "+S.systems+" on site", `
      <div class="fournum">
        ${r.rows.map(row=>`<div class="nr">
          <div class="nl"><b>${row.b}</b><span>${row.s}</span></div>
          <div class="nv">${money(row.c/ S.systems,0)}<small>/system</small></div>
        </div>`).join("")}
      </div>
      ${sol ? `
      <div class="total ${r.overridden?'ovr':''}">
        <div class="tl">Client price<small>${r.overridden?`held \u00B7 recommended ${money(r.recoPricePer,0)}/sys`:`${money(r.perSys.costPer,0)} cost/sys`} \u00B7 ${S.systems} system${S.systems>1?'s':''}</small></div>
        <div class="tv">${money(r.totalPrice,0)}<span>/mo</span></div>
      </div>
      <div class="otline" style="margin-top:8px">
        <div class="otl">Per-system rate <span class="otsub">edit to hold a number \u00B7 applies across all ${S.systems} system${S.systems>1?'s':''}</span></div>
        <div class="feebox sm"><span class="fpfx">$</span><input type="number" class="feeinp" value="${Math.round(r.perSys.pricePer)}" data-sflfee="1"><span class="fsfx">/sys</span></div>
      </div>
      ${r.overridden?`<div class="feereset"><button data-sflfeereset="1">reset to recommended (${money(r.recoPricePer,0)}/sys)</button></div>`:''}
      ` : `
      <div class="total">
        <div class="tl">Client price<small>${money(r.perSys.costPer,0)} cost/sys \u00B7 ${money(r.perSys.pricePer,0)}/sys</small></div>
        <div class="tv">${money(r.totalPrice,0)}<span>/mo</span></div>
      </div>
      `}
      ${marginBlock(r.margin)}
    `));
  }

  // effective ratio (dock engines + levers) — Solutions only
  if(isDock && r.av && S.face==="solutions"){
    R.push(leverageCard(r));
  }
  // same leverage card for SFL, only when DXD is actually flying it
  if(!isDock && r.selfFly && r.av && S.face==="solutions"){
    R.push(leverageCard(r));
  }

  // capital
  if(isDock){
    if(S.face==="leadership"){
      R.push(leadershipDJI(r));
    } else {
      const engName = S.engine==="skydio" ? "Skydio" : "DJI";
      R.push(card("Capital — per client","what it costs to say yes", `
        <div class="kpis">
          <div class="kpi"><div class="kl">Upfront</div><div class="kv neg">${money(r.upfront,0)}</div><div class="ks">${r.clientOwns?"add-on iron only":(S.financed?"financed":"hardware CapEx")}</div></div>
          <div class="kpi"><div class="kl">Monthly net</div><div class="kv" style="color:var(--green)">${money(r.monthlyNet,0)}</div><div class="ks">per client</div></div>
          <div class="kpi"><div class="kl">Payback</div><div class="kv">${isFinite(r.payback)?Math.ceil(r.payback)+" mo":"—"}</div><div class="ks">to clear CapEx</div></div>
        </div>
        <div class="note">${r.clientOwns
          ? `<b style="color:var(--green)">Client buys the hardware.</b> DXD collects ${money(r.hwBuyPrice,0)} one-time on the iron (${pct(r.hwBuyMargin)} margin) and fronts only add-on hardware \u2014 the J-curve nearly vanishes for this client.`
          : `<b>${engName} carries a CapEx hole.</b> The hardware is bought outright by DXD, so each new client is cash out before it's cash in.`}</div>
      `));
    }
  } else {
    R.push(card("Capital","the land-play advantage", `
      <div class="kpis">
        <div class="kpi"><div class="kl">Upfront</div><div class="kv neg">${money(r.upfront,0)}</div><div class="ks">${S.systems} system${S.systems>1?'s':''} \u00B7 lease net of install charge</div></div>
        <div class="kpi"><div class="kl">Monthly net</div><div class="kv" style="color:var(--green)">${money(r.net,0)}</div><div class="ks">per client</div></div>
        <div class="kpi"><div class="kl">Payback</div><div class="kv">${isFinite(r.payback)?Math.ceil(r.payback)+" mo":"—"}</div><div class="ks">to clear the lease hole</div></div>
      </div>
      <div class="note" style="margin-top:2px">Per system: ${money(r.perSys.netPer,0)}/mo net.</div>
      <div class="passcap" style="margin-top:11px">
        <div class="pi">✓</div>
        <div><b>Pass-through lease — no capital hole.</b>
        <p>The Beehive lease passes straight to the client, so SFL carries no J-curve on hardware${r.selfFly?' \u2014 the net above now includes DXD-flown piloting margin, not just the lease pass-through':''}.</p></div>
      </div>
      <div class="note"><b>Why we lead with it.</b> SFL gets systems airborne and revenue booked without balance-sheet pain${r.selfFly?', and with DXD flying, piloting margin lands here too':' \u2014 then DJI or Skydio scale the margin'}.</div>
    `));
  }

  // Capture: plain-English package comparison, below Capital — per client
  if(isDock && S.face==="capture"){
    R.push(packageCompare());
  }

  // solutions: effective-ratio matrix + advanced
  if(isDock && S.face==="solutions" && r.av){
    R.push(card("Op × Reg Matrix","margin by combination", matrix(r)));
  }
  if(!isDock && r.selfFly && S.face==="solutions" && r.av){
    R.push(card("Op × Reg Matrix","margin by combination", matrix(r)));
  }
  if(S.face==="solutions"){
    R.push(advancedCard());
  }

  $("rightcol").innerHTML=R.join("");
}

/* ---------------- RIGHT (Hybrid engine) ----------------
   Reuses computeDJI()/computeSFL() outputs untouched via computeHybrid().
   New surge model: fixed monthly = DJI HW/SW/Add-ons + SFL. Piloting is
   stripped out of DJI's monthly and treated as a per-hour surge cost that
   only incurs when the client actually calls DJI into action. */
function renderRightHybrid(R){
  const rr=computeHybrid();
  const sol=S.face==="solutions";

  // DJI rows (WITHOUT the pilot bucket — piloting is now surge-based)
  const djiEquipRows = rr.dji.rows.filter(r=>r.key!=='pilot');
  const djiRowsHtml = djiEquipRows.map(row=> sol
    ? `<div class="nr">
         <div class="nl"><b>DJI \u2014 ${row.b}</b><span>${row.s}</span></div>
         <div class="nv">
           <div class="povbox ${row.ov?'ovr':''}"><span class="fpfx">$</span><input type="number" class="povinp" value="${Math.round(row.v)}" data-pov="${row.key}"><span class="fsfx">/mo</span></div>
           <small>cost ${money(row.c,0)}${row.ov?` \u00B7 reco ${money(row.reco,0)}`:''}</small>
         </div>
       </div>`
    : `<div class="nr"><div class="nl"><b>DJI \u2014 ${row.b}</b><span>${row.s}</span></div><div class="nv">${money(row.reco,0)}</div></div>`
  ).join("");
  const sflRowsHtml = rr.sfl.rows.map(row=>`<div class="nr"><div class="nl"><b>SFL \u2014 ${row.b}</b><span>${row.s}</span></div><div class="nv">${money(row.v,0)}</div></div>`).join("");

  // Surge line — hourly rate charged only on demand. Note we display the rate
  // clearly; the /mo number is an estimate based on the hours-est input.
  const surgeHtml = `<div class="nr">
    <div class="nl"><b>Surge Pricing</b><span>${money(rr.surgeRate,0)}/hr charged when DJI is called \u00B7 est. ${rr.surgeHoursEst} hr/mo</span></div>
    <div class="nv">${money(rr.surgeRev,0)}<small>est. /mo</small></div>
  </div>`;

  R.push(card("The Four Numbers \u2014 Hybrid","fixed monthly + on-demand surge", `
    <div class="fournum">${djiRowsHtml}${sflRowsHtml}${surgeHtml}</div>
    <div class="total ${rr.dji.overridden?'ovr':''}">
      <div class="tl">Estimated monthly<small>fixed ${money(rr.fixedMonthly,0)} + est. surge ${money(rr.surgeRev,0)} (${rr.surgeHoursEst} hr \u00D7 ${money(rr.surgeRate,0)}/hr)</small></div>
      <div class="tv">${money(rr.totalPrice,0)}<span>/mo</span></div>
    </div>
    ${rr.dji.overridden?`<div class="feereset"><button data-povreset="1">reset DJI buckets to recommended (${money(rr.dji.recoMonthly,0)})</button></div>`:''}
    <div class="otline">
      <div class="otl">Fixed monthly (guaranteed) <span class="otsub">DJI equipment + SFL Beehive \u00B7 billed regardless of surge use</span></div>
      <div class="otv">${money(rr.fixedMonthly,0)}<small style="display:block;font-family:var(--body);font-size:9.5px;color:var(--t3);font-weight:400;text-align:right">${pct(rr.fixedMargin)} margin</small></div>
    </div>
    ${sol?`<div class="otline">
      <div class="otl">DJI Install &amp; Onboarding <span class="otsub">one-time \u00B7 default 1\u00D7 DJI monthly</span></div>
      <div class="feebox sm"><span class="fpfx">$</span><input type="number" class="feeinp" value="${Math.round(rr.dji.otFee)}" data-otfee="1"><span class="fsfx">once</span></div>
    </div>
    ${(S.otFeeOverride!=null)?`<div class="feereset"><button data-otreset="1">reset to 1\u00D7 DJI monthly (${money(rr.dji.clientFee,0)})</button></div>`:''}`:''}
    ${marginBlock(rr.margin)}
    <div class="note" style="margin-top:8px"><b>How this bills.</b> Client pays <b>${money(rr.fixedMonthly,0)}/mo</b> for DJI equipment + SFL Beehive regardless of usage, plus <b>${money(rr.surgeRate,0)} per hour</b> whenever DJI is called into action within the shift window. The ${money(rr.surgeRev,0)}/mo above is a scoping estimate at ${rr.surgeHoursEst} hr/mo \u2014 real revenue tracks actual client demand.</div>
  `));

  // In Hybrid, DJI is not full-shift — 1:Many leverage on DJI doesn't apply
  // the same way, since the pilot only touches DJI when the client calls a
  // surge. We keep the Op\u00D7Reg matrix available in Solutions for scoping
  // reference but skip the operational-leverage card here.

  // capital — combine DJI CapEx hole with SFL's pass-through
  if(S.face==="leadership"){
    R.push(leadershipHybrid(rr));
  } else {
    R.push(card("Capital \u2014 Hybrid","DJI CapEx + SFL pass-through", `
      <div class="kpis">
        <div class="kpi"><div class="kl">DJI upfront</div><div class="kv neg">${money(rr.dji.upfront,0)}</div><div class="ks">${rr.dji.clientOwns?"add-on iron only":(S.financed?"financed":"hardware CapEx")}</div></div>
        <div class="kpi"><div class="kl">SFL net at deploy</div><div class="kv" style="color:var(--green)">${money(rr.sfl.netAtDeploy,0)}</div><div class="ks">lease pass-through</div></div>
        <div class="kpi"><div class="kl">Est. combined net</div><div class="kv" style="color:var(--green)">${money(rr.monthlyNet,0)}</div><div class="ks">per month @ ${rr.surgeHoursEst} hr surge</div></div>
      </div>
      <div class="note">SFL carries no capital hole (pass-through lease); DJI's ${money(rr.dji.upfront,0)} hardware outlay is the only real CapEx exposure. Surge revenue (<b>${money(rr.surgeRev,0)}/mo at ${rr.surgeHoursEst} hr</b>) runs at <b style="color:var(--green)">${pct(rr.surgeMargin)}</b> margin on pilot cost \u2014 it's variable revenue on top of the guaranteed ${money(rr.fixedMonthly,0)}/mo fixed base.</div>
    `));
  }

  // Capture: plain-English package comparison for the DJI half
  if(S.face==="capture"){ R.push(packageCompare()); }

  // Solutions: DJI-side op×reg matrix
  if(S.face==="solutions" && rr.dji.av){
    R.push(card("Op × Reg Matrix \u2014 DJI side","margin by combination", matrix(rr.dji)));
  }
  if(S.face==="solutions"){ R.push(advancedCard()); }
}

/* ---------------- BOTTOM (Packages BOM — Solutions) ---------------- */
function renderBottom(){
  const host=$("bottomcol");
  if(!((S.engine==="dji"||S.engine==="hybrid"||S.engine==="skydio") && S.face==="solutions")){ host.innerHTML=""; return; }
  const ek=pkgEngineKey();
  const bom=ensureBOM();
  const pkg=PB[ek].packages[S.pkg];
  const bomOpts=bomOptsFor(ek);
  const t=bomTotals(bom, bomOpts);
  const base=pkgBaseTotals(S.pkg, ek);
  const drift = Math.abs(t.hwCapex-base.hwCapex)>0.005 || Math.abs(t.sw-base.sw)>0.005;

  const hwRows=bom.hw.map((l,i)=>{
    const capex=(+l.qty||0)*(+l.unit||0);
    return `<tr>
      <td class="nm"><input type="text" value="${String(l.name||'').replace(/"/g,'&quot;')}" data-bom="hw" data-i="${i}" data-f="name"></td>
      <td class="q"><div class="step sm">
        <button data-bomstep="hw" data-i="${i}" data-dir="-1" aria-label="decrease">\u2212</button>
        <input type="number" min="0" value="${+l.qty||0}" data-bom="hw" data-i="${i}" data-f="qty">
        <button data-bomstep="hw" data-i="${i}" data-dir="1" aria-label="increase">+</button></div></td>
      <td class="u"><div class="uedit"><span class="pfx">$</span><input type="number" step="0.01" value="${l.unit}" data-bom="hw" data-i="${i}" data-f="unit"></div></td>
      <td class="ce">${money(capex,2)}</td>
      <td class="am">${money(capex/((bomOpts&&bomOpts.amortMonths)||36),2)}</td>
      <td class="x"><button class="xbtn" data-bomdel="hw" data-i="${i}" aria-label="remove">\u00D7</button></td>
    </tr>`;
  }).join("");

  const swRows=bom.sw.map((l,i)=>{
    const mo=(+l.qty||0)*(+l.unit||0);
    return `<tr>
      <td class="nm"><input type="text" value="${String(l.name||'').replace(/"/g,'&quot;')}" data-bom="sw" data-i="${i}" data-f="name"></td>
      <td class="q"><div class="step sm">
        <button data-bomstep="sw" data-i="${i}" data-dir="-1" aria-label="decrease">\u2212</button>
        <input type="number" min="0" value="${+l.qty||0}" data-bom="sw" data-i="${i}" data-f="qty">
        <button data-bomstep="sw" data-i="${i}" data-dir="1" aria-label="increase">+</button></div></td>
      <td class="u"><div class="uedit"><span class="pfx">$</span><input type="number" step="0.01" value="${l.unit}" data-bom="sw" data-i="${i}" data-f="unit"><span class="sfx">/mo</span></div></td>
      <td class="ce">\u2014</td>
      <td class="am">${money(mo,2)}</td>
      <td class="x"><button class="xbtn" data-bomdel="sw" data-i="${i}" aria-label="remove">\u00D7</button></td>
    </tr>`;
  }).join("");

  let addonBlock="";
  const sel=PB.addOns.filter(a=>(S.addOns[a.id]||0)>0 && a.price!=null);
  if(sel.length){
    const blocks=sel.map(a=>{
      const q=S.addOns[a.id]; const u=addOnUnit(a);
      const hw=(a.hw||[]).map(l=>`<tr><td class="nm">${l.name}</td><td>${l.qty*q}</td><td class="u">${money(l.unit,2)}</td><td class="ce">${money(l.qty*l.unit*q,2)}</td><td class="am">${money(l.qty*l.unit*q/36,2)}</td></tr>`).join("");
      const sw=(a.sw||[]).map(l=>`<tr><td class="nm">${l.name}</td><td>${l.qty*q}</td><td class="u">${money(l.unit,2)}/mo</td><td class="ce">\u2014</td><td class="am">${money(l.qty*l.unit*q,2)}</td></tr>`).join("");
      return `<div class="addon-bom">
        <div class="ab-h">${a.name}${q>1?' \u00D7'+q:''} <span class="muted">\u2014 ${money(u.cost*q,2)}/mo cost \u00B7 ${money(u.price*q,2)}/mo list</span></div>
        <table class="bomt"><tr><th>Item</th><th>#</th><th>Unit</th><th>CapEx</th><th>/mo</th></tr>${hw}${sw}</table>
      </div>`;
    }).join("");
    addonBlock=`<div class="bom-side"><div class="bom-sub">Selected add-on bundles <span class="muted">— verification, from the price book</span></div>${blocks}</div>`;
  }

  let html=`<div class="card" style="margin-top:18px"><div class="card-h">
      <div class="ct">Packages \u2014 <input type="text" class="bomname" value="${String(S.bomName||(pkg.label+' build')).replace(/"/g,'&quot;')}" data-bomname="1" title="Name this build (bespoke clients get their own)"></div>
      <div class="cn">${drift?'bespoke / edited':'catalog'} build \u00B7 edit or add lines${S.engine==="hybrid"?' \u00B7 DJI half of this hybrid bundle':''}</div>
    </div>
    <div class="card-b">
      <div class="banner ${drift?'warn':'info'}">
        <div>${drift
          ? `<b>Bespoke build.</b> This deal differs from the catalog ${pkg.label} baseline \u2014 CapEx ${money(t.hwCapex,2)} vs ${money(base.hwCapex,2)}, SW ${money(t.sw,2)}/mo vs ${money(base.sw,2)}/mo. Name it above; the four numbers reflect what's listed here. Standard &amp; Enhanced stay codified \u2014 this customization rides on top for this client only.`
          : `<b>Verified against the price book.</b> This is the catalog ${pkg.label} build, untouched, summing to ${money(t.hwCapex,2)} CapEx and ${money(t.sw,2)}/mo software. Edit a unit to wheel and deal, change a quantity, or add a line to build a bespoke package \u2014 everything upstream re-settles instantly.`}</div>
      </div>
      ${ek==="skydio" ? (()=>{
          const trainingValue = sumLines((pkg.hw||[]).filter(l=>l.training));
          return `<div class="banner info" style="margin-top:10px"><div><b>${bomOpts.qty} system${bomOpts.qty>1?'s':''}.</b> Rows below are stored per dock; totals and the reconciliation panel already apply \u00D7${bomOpts.qty} to the airframe, sensors, camera, and recurring software \u2014 Drone Tag Scout, the non-penetrating mount, Professional Implementation, and training don't repeat per dock (matches how DJI's own Enhanced package holds shared items flat). Training is ${bomOpts.includeTraining?`<b>included</b> (${money(trainingValue,0)})`:'<b>excluded</b>'}, set in the Skydio Fleet &amp; Terms card. Amortized over <b>${bomOpts.amortMonths} months</b>. Piloting is set separately in Advanced and doesn't auto-scale with systems count.</div></div>`;
        })() : ''}
      <div class="bom-wrap">
        <div class="bom-main">
          <div class="bom-sub">Hardware <span class="muted">\u2014 ${bomOpts?bomOpts.amortMonths:36}-month amortization</span></div>
          <table class="bomt edit"><tr><th>Equipment</th><th>#</th><th>Unit Cost</th><th>CapEx</th><th>Amort/${bomOpts?bomOpts.amortMonths:36}</th><th></th></tr>
            ${hwRows}
            <tr class="tot"><td>Hardware total</td><td></td><td></td><td class="ce">${money(t.hwCapex,2)}</td><td class="am">${money(t.hwAmort,2)}</td><td></td></tr>
          </table>
          <button class="addrow" data-bomadd="hw">+ Add hardware line</button>

          <div class="bom-sub" style="margin-top:16px">Software <span class="muted">\u2014 monthly recurring</span></div>
          <table class="bomt edit"><tr><th>Item</th><th>#</th><th>Unit/mo</th><th></th><th>Monthly</th><th></th></tr>
            ${swRows}
            <tr class="tot"><td>Software total</td><td></td><td></td><td></td><td class="am">${money(t.sw,2)}</td><td></td></tr>
          </table>
          <button class="addrow" data-bomadd="sw">+ Add software line</button>

          <div class="bom-recon">
            <span class="rc"><span class="rl">HW CapEx</span><span class="rv">${money(t.hwCapex,0)}</span></span>
            <span class="rc"><span class="rl">HW amort / mo</span><span class="rv">${money(t.hwAmort,0)}</span></span>
            <span class="rc"><span class="rl">Software / mo</span><span class="rv">${money(t.sw,0)}</span></span>
            <button class="plus-reset" ${drift?'':'disabled'} data-bomreset="1">reset to ${pkg.label} baseline</button>
          </div>
        </div>
        ${addonBlock}
      </div>
      <div class="note" style="margin-top:14px">Piloting is costed separately as the live variable (Advanced) and isn't part of the package BOM. Add-on bundles are maintained in the price book \u2014 change their <b>quantity</b> in the Add-Ons panel; a client can take several.</div>
    </div></div>`;

  if(S.engine==="hybrid"){
    const sfl=computeSFL();
    const rh=computeHybrid();
    html += card("SFL Beehive + Surge \u2014 Bundle Components","not part of the DJI BOM above", `
      <div class="note">This hybrid bundle also includes <b>${S.systems} SFL Beehive system${S.systems>1?'s':''}</b> at ${money(sfl.perSys.pricePer,0)}/system/mo (${money(sfl.totalPrice,0)}/mo total, billed monthly), plus <b>${money(S.surgeRate,0)}/hr surge pricing</b> charged when the client calls DJI into action (estimated <b>${money(rh.surgeRev,0)}/mo at ${S.surgeHoursEst} hr</b>). Adjust systems and surge parameters in the Configuration panels on the left.</div>
    `);
  }

  host.innerHTML=html;
}

  }

  const total = eng==="dji"?r.clientFee:r.totalPrice;
  const lineRows=r.rows.map(x=>`<tr><td>${x.b}</td><td class="amt">${money(x.v,0)}${x.key==='surge'&&eng==='hybrid'?' est.':''}/mo</td></tr>`).join("");

}

/* Capture: plain-English "what's in the box" — Standard vs Enhanced.
   Values marked <confirm> are pending Winston's numbers (amber in UI). */
function packageCompare(){
  if(S.engine==="skydio") return skydioSpecCard();
  const sel=S.pkg;                       // 'standard' | 'enhanced'
  const C="\u2014 confirm \u2014";

  </div>`;

function sparkline(series){
  const w=300,h=64,pad=4;
  const min=Math.min(0,...series), max=Math.max(0,...series), rng=(max-min)||1;
  const x=i=>pad+i*(w-2*pad)/(series.length-1);
  const y=v=>h-pad-((v-min)/rng)*(h-2*pad);
  const zero=y(0);
  const path=series.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  const area=path+` L ${x(series.length-1).toFixed(1)} ${zero.toFixed(1)} L ${x(0).toFixed(1)} ${zero.toFixed(1)} Z`;
  return `<div class="spark"><svg viewBox="0 0 ${w} ${h}" width="100%" height="64" preserveAspectRatio="none">
    <defs><linearGradient id="jg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3FB95A" stop-opacity=".35"/><stop offset="100%" stop-color="#3FB95A" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pad}" y1="${zero.toFixed(1)}" x2="${w-pad}" y2="${zero.toFixed(1)}" stroke="#3A3A40" stroke-dasharray="3 3"/>
    <path d="${area}" fill="url(#jg)"/>
    <path d="${path}" fill="none" stroke="#3FB95A" stroke-width="2"/>
  </svg></div>`;
}

/* ===== LEADERSHIP — workbook-style scaling analysis for the current scenario ===== */
function leadershipDJI(r){
  const price=r.clientFee, fixed=r.pilotFull, perCli=r.nonPilotCost, cap=PB.qcCap, op=r.op;
  const net=n=>price*n-(fixed+n*perCli);
  const marg=n=>{const rev=price*n;return rev>0?net(n)/rev:0;};
  const waiverN = r.av ? Math.min(op*S.regMult, cap) : op;
  const marginalNet=price-perCli;
  const engName = r.engineKey==="skydio" ? "Skydio" : "DJI";
  const skyChips = r.engineKey==="skydio" ? [
    (Math.max(1,Math.round(+S.skydioSystems||1)))+" system"+(S.skydioSystems>1?"s":""),
    (Math.max(1,Math.round(+S.skydioTerm||36)))+"-mo term",
    S.skydioTraining?"Training incl.":"No training",
  ] : [];

  // scenario readout
  const cfg=[engName,S.cadence==="recurring"?"Recurring":"One-time",S.deployment==="deployed"?"On-Site":"Mobile",
    PB[r.engineKey].packages[S.pkg].label,...skyChips,S.coverage+"hr",r.clientOwns?"Client-owned":"DXD-owned","1:"+op];
  let out = card("Scenario Under Analysis","exact Solutions build", `
    <div class="scen">${cfg.map(c=>`<span class="chip">${c}</span>`).join("")}</div>
    <div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="kl">Price / client</div><div class="kv">${money(price,0)}</div><div class="ks">/mo held</div></div>
      <div class="kpi"><div class="kl">Margin today</div><div class="kv" style="color:var(--green)">${pct(r.margin)}</div><div class="ks">at 1:${op}</div></div>
      <div class="kpi"><div class="kl">Net / client</div><div class="kv" style="color:var(--green)">${money(r.monthlyNet,0)}</div><div class="ks">per month</div></div>
    </div>`);

  if(r.av){
    // operating leverage — hold price, add clients to one route
    const rows=[];
    for(let n=1;n<=cap;n++){
      const cls=n===op?'today':(n===waiverN?'wv':'');
      const mk=n===op?'\u25C0 today':(n===waiverN?'\u25C0 waiver full':'');
      rows.push(`<tr class="${cls}"><td>1:${n}</td><td class="gm">${money(net(n),0)}</td><td>${pct(marg(n))}</td><td class="mk">${mk}</td></tr>`);
    }
    const expandPts=(marg(waiverN)-marg(op))*100;
    out += card("Operating Leverage","one pilot route \u00B7 hold price, add clients", `
      <div class="twostat">
        <div class="ts"><div class="tsl">TODAY \u2014 1:${op}</div><div class="tsv">${pct(marg(op))}</div><div class="tss">${money(net(op),0)}/mo net</div></div>
        <div class="tsarrow">\u2192</div>
        <div class="ts wv"><div class="tsl">WAIVER FULL \u2014 1:${waiverN}</div><div class="tsv">${pct(marg(waiverN))}</div><div class="tss">${money(net(waiverN),0)}/mo net</div></div>
      </div>
      <div class="note" style="margin:10px 0">Same price, same pilot. Each added client costs only <b>${money(perCli,0)}</b> but bills <b>${money(price,0)}</b> \u2014 marginal net <b style="color:var(--green)">+${money(marginalNet,0)}/client</b>. Margin expands <b style="color:var(--amber)">+${expandPts.toFixed(0)} pts</b> from today to the waiver target.</div>
      <table class="lsch"><tr><th>Ratio</th><th>Route net/mo</th><th>Margin</th><th></th></tr>${rows.join("")}</table>
      <div class="note">QC ceiling 1:${cap}. The regulatory 1:Many provision is pending IP \u2014 the waiver row is the theoretical target, not yet operational.</div>`);

    // ratio pricing schedule — every option, priced to target
    const sched=[];
    for(let R=1;R<=7;R++){
      const costR=perCli+fixed/R, priceR=costR/(1-S.marginTarget);
      const netCap=priceR*R-(fixed+R*perCli);
      const capexFill=R*r.hwCapexTotal;
      const beBasis=r.clientOwns?R*r.addHwCapex:capexFill;
      const beMo=netCap>0?Math.ceil(beBasis/netCap)+' mo':'\u2014';
      sched.push(`<tr class="${R===op?'today':''}"><td>1:${R}</td><td>${money(priceR,0)}</td><td class="gm">${money(netCap,0)}</td><td>${money(capexFill,0)}</td><td>${beMo}</td></tr>`);
    }
    out += card("Ratio Pricing Schedule","every option, priced to "+pct(S.marginTarget), `
      <table class="lsch"><tr><th>Ratio</th><th>Price/client</th><th>Route net@cap</th><th>CapEx to fill</th><th>Breakeven</th></tr>${sched.join("")}</table>
      <div class="note">Deeper ratios drop the per-client price but lift route net \u2014 the fixed pilot spreads further. ${r.clientOwns?'Client-owned: CapEx-to-fill is client-funded; breakeven reflects add-on iron only.':'CapEx-to-fill is DXD\u2019s hardware outlay to fill that route.'}</div>`);

    // fleet scale
    const netWF=net(waiverN);
    out += card("Fleet Scale","each pilot runs to 1:"+waiverN+" (theoretical)", `
      <table class="fleet"><tr><th>Pilots</th><th>Clients</th><th>Monthly net</th><th>Annual net</th></tr>
      ${[1,2,3,5,10].map(p=>`<tr><td>${p}</td><td>${p*waiverN}</td><td class="gm">${money(p*netWF,0)}</td><td class="gm">${money(p*netWF*12,0)}</td></tr>`).join("")}</table>
      <div class="note">Same price, same service \u2014 the waiver multiplies clients per pilot. Today at 1:${op}, one pilot nets ${money(net(op),0)}/mo; at the waiver target it reaches ${money(netWF,0)}/mo.</div>`);
  }

  // capital J-curve + growth tiers
  const ramps={low:1,med:2,high:3};
  const tierRows=Object.entries(ramps).map(([k,pm])=>{
    const jc=jcurve(r.upfront,r.monthlyNet,pm,36,null);
    return `<tr class="${S.growth===k?'today':''}"><td>${k[0].toUpperCase()+k.slice(1)} (+${pm}/mo)</td><td class="neg">${money(-jc.peak,0)}</td><td>${jc.be?'Mo '+jc.be:'\u2014'}</td><td class="gm">${money(jc.end,0)}</td><td>${jc.active}</td></tr>`;
  }).join("");
  const jcSel=jcurve(r.upfront,r.monthlyNet,ramps[S.growth],36,null);
  out += card("Capital \u2014 J-Curve & Growth Tiers","CapEx hole \u00B7 drawdown \u00B7 breakeven", `
    <div class="pills" style="margin-bottom:10px">${Object.keys(ramps).map(k=>`<div class="pill sm ${S.growth===k?'on':''}" data-opt="growth" data-val="${k}">${k[0].toUpperCase()+k.slice(1)}</div>`).join("")}</div>
    ${sparkline(jcSel.series)}
    <table class="lsch" style="margin-top:10px"><tr><th>Tier</th><th>Peak funding</th><th>Breakeven</th><th>Cum @ Mo 36</th><th>Clients</th></tr>${tierRows}</table>
    <div class="note">${r.clientOwns?`<b style="color:var(--green)">Client-funded hardware nearly closes the hole</b> \u2014 DXD fronts only ${money(r.upfront)}/client of add-on iron.`:`Each client needs ${money(r.upfront)} of hardware upfront. ${S.financed?'Financing is applied here.':'Toggle financing or client-purchase in Solutions to shrink the trough.'}`}</div>`);

  return out;
}

             S.cadence==="recurring"?"Recurring":"One-time",

  // Surge sensitivity table — how net moves with actual hours of client demand
  const scenarios=[0,4,8,16,32,64];
  const rows=scenarios.map(h=>{
    const rev=rr.surgeRate*h, cost=S.pilotRate*h, net=rev-cost;
    const total=rr.fixedMonthly+rev;
    const totalCost=rr.fixedCost+cost;
    const totalNet=total-totalCost;
    const totalMargin=total>0?totalNet/total:0;
    const cls=h===rr.surgeHoursEst?'today':'';
    const mk=h===rr.surgeHoursEst?'\u25C0 est.':'';
    return `<tr class="${cls}"><td>${h} hr</td><td>${money(rev,0)}</td><td class="gm">${money(net,0)}</td><td>${money(total,0)}</td><td class="gm">${money(totalNet,0)}</td><td>${pct(totalMargin)}</td><td class="mk">${mk}</td></tr>`;
  }).join("");
  out += card("Surge Sensitivity","how net moves with actual client demand", `
    <table class="lsch"><tr><th>Surge hr/mo</th><th>Surge rev</th><th>Surge net</th><th>Total /mo</th><th>Total net</th><th>Margin</th><th></th></tr>${rows}</table>

  `);

  // Capital view — mirror the pure-DJI J-curve for the DJI equipment side, but
  // use the FIXED margin (not the surge-blended one) since fixed is guaranteed
  const ramps={low:1,med:2,high:3};
  const tierRows=Object.entries(ramps).map(([k,pm])=>{
    const jc=jcurve(rr.dji.upfront, rr.monthlyNet, pm, 36, null);
    return `<tr class="${S.growth===k?'today':''}"><td>${k[0].toUpperCase()+k.slice(1)} (+${pm}/mo)</td><td class="neg">${money(-jc.peak,0)}</td><td>${jc.be?'Mo '+jc.be:'\u2014'}</td><td class="gm">${money(jc.end,0)}</td><td>${jc.active}</td></tr>`;
  }).join("");
  const jcSel=jcurve(rr.dji.upfront, rr.monthlyNet, ramps[S.growth], 36, null);
  out += card("Capital \u2014 J-Curve & Growth Tiers","DJI CapEx \u00B7 SFL pass-through \u00B7 est. net includes surge", `
    <div class="pills" style="margin-bottom:10px">${Object.keys(ramps).map(k=>`<div class="pill sm ${S.growth===k?'on':''}" data-opt="growth" data-val="${k}">${k[0].toUpperCase()+k.slice(1)}</div>`).join("")}</div>
    ${sparkline(jcSel.series)}
    <table class="lsch" style="margin-top:10px"><tr><th>Tier</th><th>Peak funding</th><th>Breakeven</th><th>Cum @ Mo 36</th><th>Clients</th></tr>${tierRows}</table>
    <div class="note">${rr.dji.clientOwns?`<b style="color:var(--green)">Client-funded DJI hardware nearly closes the hole</b> \u2014 DXD fronts only ${money(rr.dji.upfront)}/client of add-on iron. SFL adds no CapEx.`:`Each hybrid client needs ${money(rr.dji.upfront)} of DJI hardware upfront; SFL adds no CapEx. Net-per-client uses the estimated ${rr.surgeHoursEst} hr/mo of surge \u2014 real payback tracks actual client demand.`}</div>`);

  return out;
}

function matrix(r){
  const t=S.marginTarget, pilotFull=r.pilotFull;
  const findRow=k=>r.rows.find(x=>x.key===k);
  const priceFor=row=>!row?0:(row.passthrough?row.c:row.c/(1-t));   // pass-through stays at cost; margined buckets re-solve at the current target
  const hwR=findRow("hw"), swR=findRow("sw"), addR=findRow("add");
  const hwCost=hwR?hwR.c:0, swCost=swR?swR.c:0;
  const hwPriceF=priceFor(hwR), swPriceF=priceFor(swR);
  const addCost=addR?addR.c:0, addPrice=addR?addR.v:0;
  let rows="";
  for(let op=1;op<=7;op++){
    const opPilot=pilotFull/op;
    const quote=hwPriceF+swPriceF+(opPilot/(1-t))+addPrice;             // held quote at this op
    const effRaw=op*S.regMult, capped=effRaw>PB.qcCap, eff=Math.min(effRaw,PB.qcCap);
    const realCost=hwCost+swCost+(pilotFull/eff)+addCost;
    const realMargin=(quote-realCost)/quote;
    rows+=`<tr class="${op===S.opRatio?'hl':''} ${capped?'cap':''}">
      <td>1:${op}</td><td class="num">${money(quote,0)}</td><td class="num">1:${eff}${capped?' \u26A0':''}</td><td class="num">${pct(realMargin)}</td></tr>`;
  }
  return `<table class="mtx">
    <tr><th>Op ratio</th><th>Quote/mo</th><th>Eff (\u00D7${S.regMult})</th><th>Realized margin</th></tr>
    ${rows}</table>
    <div class="note">Quote built at the operational ratio (today). Realized margin assumes the regulatory provision (\u00D7${S.regMult}) is operational with price held. Highlighted = current; capped at 1:${PB.qcCap}.</div>`;
}

        <div class="inp"><label>Install &amp; onboarding cost</label><div class="ib"><span class="pfx">$</span><input type="number" value="${Math.round(+S.installCost||0)}" data-num="installCost"></div></div>
      </div>
      <div style="margin-top:13px" class="tg ${S.financed?'on':''}" data-toggle="financed">
        <div class="sw"></div><div><div style="font-family:var(--disp);font-weight:600;font-size:12.5px">Finance the hardware</div>
        <div class="note" style="margin-top:2px">Halves the upfront hole; adds ~${money(PB[pkgEngineKey()].financedMonthlyAdd)}/client/mo${pkgEngineKey()==="skydio"?' (est. \u2014 confirm with financing partner)':''}.</div></div>
      </div>
      <div class="note" style="margin-top:12px"><b>Open conventions:</b> canonical piloting source · package names · whether the floor sits on the package core or the all-in total (add-ons currently layered at list).</div>
    </div></div>`;
}

/* ---------- small html builders ---------- */
function card(title,note,bodyHTML){
  return `<div class="card"><div class="card-h"><div class="ct">${title}</div><div class="cn">${note||""}</div></div><div class="card-b">${bodyHTML}</div></div>`;
}
function opt(key,val,label,desc){
  return `<div class="opt ${S[key]===val?'on':''}" data-opt="${key}" data-val="${val}"><div class="ol">${label}</div><div class="od">${desc}</div></div>`;
}
function optWide(key,val,label,desc){ return opt(key,val,label,desc); }

/* ---------- events ---------- */
function bind(){
  document.querySelectorAll("[data-face]").forEach(e=>e.onclick=()=>{S.face=e.dataset.face;render();});
  document.querySelectorAll("[data-opt]").forEach(e=>e.onclick=()=>{
    const k=e.dataset.opt, v=e.dataset.val;
    S[k]=v;
    if(k==="engine"){
      // DJI's package keys (standard/enhanced) and Skydio's (x10) don't overlap —
      // reset to a valid default for whichever engine we just switched to.
      const ek=pkgEngineKey();
      const keys=Object.keys(PB[ek].packages);
      if(!keys.includes(S.pkg)) S.pkg=keys[0];
    }
    render();
  });
  document.querySelectorAll("[data-set]").forEach(e=>e.onclick=()=>{S[e.dataset.set]=+e.dataset.val;render();});
  document.querySelectorAll("[data-toggle]").forEach(e=>e.onclick=()=>{S[e.dataset.toggle]=!S[e.dataset.toggle];render();});
  /* add-on quantity steppers */
  document.querySelectorAll("[data-aonstep]").forEach(e=>e.onclick=()=>{
    const id=e.dataset.aonstep; S.addOns[id]=Math.max(0,(S.addOns[id]||0)+(+e.dataset.dir)); render();
  });
  document.querySelectorAll("[data-aonqty]").forEach(e=>e.onchange=()=>{
    S.addOns[e.dataset.aonqty]=Math.max(0, Math.round(+e.value)||0); render();
  });
  /* packages BOM: steppers, inline edits, add/remove, reset */
  document.querySelectorAll("[data-bomstep]").forEach(e=>e.onclick=()=>{
    const b=ensureBOM(), row=b[e.dataset.bomstep][+e.dataset.i];
    row.qty=Math.max(0,(+row.qty||0)+(+e.dataset.dir)); render();
  });
  document.querySelectorAll("[data-bom]").forEach(e=>e.onchange=()=>{
    const b=ensureBOM(), row=b[e.dataset.bom][+e.dataset.i], f=e.dataset.f;
    if(f==="name") row.name=e.value;
    else if(f==="qty") row.qty=Math.max(0, Math.round(+e.value)||0);
    else if(f==="unit") row.unit=Math.max(0, +e.value||0);
    render();
  });
  document.querySelectorAll("[data-bomdel]").forEach(e=>e.onclick=()=>{
    ensureBOM()[e.dataset.bomdel].splice(+e.dataset.i,1); render();
  });
  document.querySelectorAll("[data-bomadd]").forEach(e=>e.onclick=()=>{
    ensureBOM()[e.dataset.bomadd].push({name:"",qty:1,unit:0}); render();
  });
  document.querySelectorAll("[data-bomreset]").forEach(e=>e.onclick=()=>{
    S.bom=null; S.bomPkg=null; ensureBOM(); render();
  });
  /* Solutions per-bucket price overrides + one-time install fee */
  document.querySelectorAll("[data-pov]").forEach(e=>e.onchange=()=>{
    const k=e.dataset.pov, raw=String(e.value).trim();
    S.priceOverride[k] = raw==="" ? null : Math.max(0, +raw||0);
    render();
  });
  document.querySelectorAll("[data-povreset]").forEach(e=>e.onclick=()=>{
    S.priceOverride={hw:null,sw:null,pilot:null,add:null}; render();
  });
  document.querySelectorAll("[data-otfee]").forEach(e=>e.onchange=()=>{
    const v=+e.value; S.otFeeOverride=(isFinite(v)&&v>0)?v:null; render();
  });
  document.querySelectorAll("[data-otreset]").forEach(e=>e.onclick=()=>{ S.otFeeOverride=null; render(); });
  document.querySelectorAll("[data-sflfee]").forEach(e=>e.onchange=()=>{
    const v=+e.value; S.sflPriceOverride=(isFinite(v)&&v>0)?v:null; render();
  });
  document.querySelectorAll("[data-sflfeereset]").forEach(e=>e.onclick=()=>{ S.sflPriceOverride=null; render(); });
  document.querySelectorAll("[data-bomname]").forEach(e=>e.onchange=()=>{ S.bomName=e.value; render(); });
  document.querySelectorAll("[data-range]").forEach(e=>{
    e.oninput=()=>{const k=e.dataset.range; S[k]=+e.value;
      // live update the value label without full rerender for smoothness
      const sval=e.parentElement.querySelector(".sval");
      if(sval){
        if(k==="opRatio") sval.textContent="1:"+e.value;
        else if(k==="surgeHoursEst") sval.textContent=e.value+" hr";
        else if(k==="coverage") sval.textContent=e.value+"hr";
        else sval.textContent=e.value;
      }};
    e.onchange=()=>{S[e.dataset.range]=+e.value;render();};
  });
  document.querySelectorAll("[data-num]").forEach(e=>{
    e.onchange=()=>{const k=e.dataset.num; const v=+e.value;
      if(k==="marginPct") S.marginTarget=clamp(v/100,0,0.85);
      else if(k==="floorPct") S.marginFloor=clamp(v/100,0,0.85);
      else S[k]=v; render();};
  });
}

render();

/* Print / Save-as-PDF — renders the condensed one-pager, then prints */
(function(){
  const renderSheet=()=>{ const el=document.getElementById("printSheet"); if(el) el.innerHTML=buildPrintSheet(); };
  const pb=document.getElementById("printBtn");
  if(pb) pb.onclick=()=>{ renderSheet(); window.print(); };
  if(window.addEventListener) window.addEventListener("beforeprint", renderSheet);
})();

/* ─── postMessage bridge — used when the tool is embedded in the DXD
       Deployment Tracker inside an iframe.

   ▸  solutions:ready         — posted on first paint. Parent replies with
                                solutions:init { state } to rehydrate from
                                the per-deal saved copy.
   ▸  solutions:init { state } — merge saved fields into the live S object,
                                then re-render.
   ▸  solutions:state { state } — debounced, posted after every render() so
                                the parent can persist to project.pricingCache.

   Standalone use (opened directly from disk / no parent frame) skips the
   whole bridge so nothing changes. */
(function(){
  if (window === window.parent) return;

  const originalRender = render;
  let saveTimer = null;
  let suppressNextSave = false;

  render = function(){
    originalRender();
    if (suppressNextSave) { suppressNextSave = false; return; }
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try {
        var snapshot = JSON.parse(JSON.stringify(S));
        window.parent.postMessage({ type: 'solutions:state', payload: snapshot }, '*');
      } catch (e) { /* non-serializable field — skip this tick */ }
    }, 400);
  };

  window.addEventListener('message', function(evt){
    var msg = evt.data;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type !== 'solutions:init' || !msg.payload || typeof msg.payload !== 'object') return;
    // Merge in only keys we already know about — never trust the parent to
    // introduce new fields into S. bom/bomPkg get reset to null so the
    // engine rebuilds them from PB against the loaded pkg.
    Object.keys(msg.payload).forEach(function(k){
      if (Object.prototype.hasOwnProperty.call(S, k)) S[k] = msg.payload[k];
    });
    S.bom = null; S.bomPkg = null; S.bomEngine = null; S.bomName = null;
    suppressNextSave = true;
    render();
  });

  window.parent.postMessage({ type: 'solutions:ready' }, '*');
})();
</script>
