*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#0f0f0f;--bg1:#1a1a1a;--bg2:#222;--bg3:#2a2a2a;
  --border:#2e2e2e;--border2:#3a3a3a;
  --t1:#e8e8e8;--t2:#888;--t3:#555;
  --red:#c0392b;--red2:#e24b4a;
  --green:#4ec94e;--yellow:#f5c45b;--blue:#4a9eff;

body{background:var(--bg0);color:var(--t1);font-family:'Barlow',sans-serif;font-size:13px;padding:16px;min-width:1000px}
input[type=number],input[type=text],select,textarea{

  border-radius:3px;font-family:'Barlow',sans-serif;outline:none;

input[type=number]:focus,input[type=text]:focus,select:focus,textarea:focus{border-color:var(--red)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
button{cursor:pointer;font-family:'Barlow Condensed',sans-serif}
.hdr{background:var(--red);padding:10px 18px;border-radius:6px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.hdr-title{color:#fff;font-weight:700;font-size:18px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1.5px}
.hdr-sub{color:rgba(255,255,255,0.65);font-size:11px;margin-top:2px}
.hdr-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.ctrl-grp{display:flex;align-items:center;gap:8px;background:var(--bg1);padding:6px 12px;border-radius:6px}
.ctrl-label{font-size:11px;color:var(--t2);font-family:'Barlow Condensed',sans-serif;letter-spacing:0.5px}
.cfg-btn{padding:3px 10px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--t1);font-size:12px;transition:all .15s;font-family:'Barlow Condensed',sans-serif}
.cfg-btn.active{border-color:var(--red);background:var(--red);color:#fff;font-weight:700}
.sky-toggle{padding:3px 12px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--t2);font-size:12px;font-weight:700;transition:all .15s}
.sky-toggle.active{border-color:var(--yellow);background:var(--yellow);color:#1a0a00}
.save-btn{padding:4px 12px;border-radius:4px;border:1px solid var(--green);background:transparent;color:var(--green);font-size:12px}
.reset-btn{padding:4px 12px;border-radius:4px;border:1px solid var(--border2);background:transparent;color:var(--t2);font-size:12px}
.saved-indicator{font-size:10px;color:var(--t3)}
.sec{margin-bottom:18px}
.sec-hdr{background:var(--red);color:#fff;font-weight:700;font-size:11px;padding:5px 12px;letter-spacing:1.5px;border-radius:4px 4px 0 0;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif}
.sec-body{background:var(--bg0);border:0.5px solid var(--border);border-top:none;border-radius:0 0 4px 4px;padding:12px}

.hw-kit-box{background:var(--bg2);border-radius:4px;padding:8px 10px;margin-bottom:8px;border:0.5px solid var(--border)}

.hw-kit-lbl{color:var(--t2)}

function newEventType(overrides={}) {

      daysPerEvent: 7,
      coverageHours: 24,
      otMultiplier: 1.0,
      intRate: 65,
      pilotRate: 68.46,
      dronesCount: 3,
      travel: {airfare:350, numTravelers:1, lodgingNights:7, lodgingRate:150, perDiemDays:7, rental:0, gas:0, eventWeeks:1},
      swItems: defSwItems(),
    },
  };
  const merged = Object.assign(base, overrides);
  if(overrides.vlos1099Rate)   merged.vlos.rate1099   = overrides.vlos1099Rate;
  if(overrides.vlosPilots)     merged.vlos.pilots      = overrides.vlosPilots;
  if(overrides.bvlosIntRate)   merged.bvlos.intRate    = overrides.bvlosIntRate;
  if(overrides.bvlos1099Rate)  merged.bvlos.pilotRate  = overrides.bvlos1099Rate;
  if(overrides.daysPerEvent)   { merged.vlos.daysPerEvent = overrides.daysPerEvent; merged.bvlos.daysPerEvent = overrides.daysPerEvent; }
  if(overrides.coverageHours)  { merged.vlos.coverageHours = overrides.coverageHours; merged.bvlos.coverageHours = overrides.coverageHours; }
  if(overrides.configType)     merged.activeConfig = overrides.configType;
  if(overrides.travel) {
    if(merged.activeConfig==='vlos') merged.vlos.travel = overrides.travel;
    else merged.bvlos.travel = overrides.travel;
  }
  return merged;
}

}

const S = {
  skydioRisk: false,
  amortWeeks: 36,
  seasonWeeks: 36,
  djiVlosHw:  clone(DJI_VLOS_HW),
  djiBvlosHw: clone(DJI_BVLOS_HW),
  skyVlosHw:  clone(SKYDIO_VLOS_HW),
  skyBvlosHw: clone(SKYDIO_BVLOS_HW),
  hwPackages: [
    defaultVlosPackage(),
    defaultBvlosPackage(),
  ],
  eventTypes: [
    newEventType({id:1, name:"PGA Tour", color:"#4ec94e", configType:"bvlos",
      eventsPerYear:20, revenuePerEvent:45000, daysPerEvent:7, coverageHours:24,
      bvlosIntRate:65, bvlos1099Rate:68.46,
      travel:{airfare:350,numTravelers:1,lodgingNights:7,lodgingRate:150,perDiemDays:7,rental:0,gas:0,eventWeeks:1},
      open:true}),
    newEventType({id:2, name:"Fill-In Events", color:"#4a9eff", configType:"vlos",
      eventsPerYear:8, revenuePerEvent:25000, daysPerEvent:4, coverageHours:12,
      vlos1099Rate:68.46, vlosPilots:3,
      travel:{airfare:350,numTravelers:3,lodgingNights:4,lodgingRate:120,perDiemDays:4,rental:400,gas:80,eventWeeks:1},
      open:false}),
  ],
  notes: "",
};

function calcTableTotals(items, dronesCount, isSwTable, amortWeeks, eventDays, skydioMode) {
  let cost=0, bill=0;
  items.forEach(it => {
    if (skydioMode && it.isDji) return;
    const eq = isSwTable ? (it.perDrone ? it.qty*dronesCount : it.qty) : it.qty;
    const tc = it.unitCost*eq;
    const tb = tc + tc*(it.margin/100);
    const ac = isSwTable ? tc : (it.annual ? tc/52 : (tc/amortWeeks)*(eventDays/7));
    const ab = isSwTable ? tb : (it.annual ? tb/52 : (tb/amortWeeks)*(eventDays/7));
    cost+=ac; bill+=ab;
  });
  return {cost, bill};
}

function calcHwOneTime(items, skydioMode) {
  return items.reduce((s,it)=>(skydioMode&&it.isDji)?s:s+it.unitCost*it.qty, 0);
}

function calcHwAnnualRecurring(items, skydioMode) {
  return items.filter(i=>i.annual&&!(skydioMode&&i.isDji)).reduce((s,i)=>s+i.unitCost*i.qty, 0);
}

function calcTravelTotal(t) {
  return (t.airfare*t.numTravelers)+(t.lodgingNights*t.lodgingRate*t.numTravelers)+(75*t.perDiemDays*t.numTravelers)+t.rental+t.gas;
}

function getPackageItems(packageId, configType) {
  const pkg = S.hwPackages && S.hwPackages.find(p=>p.id===packageId);
  if(pkg) return pkg.hwItems || [];
  const sm = S.skydioRisk;
  if(configType==='vlos') return sm ? [...S.djiVlosHw,...S.skyVlosHw] : S.djiVlosHw;
  return sm ? [...S.djiBvlosHw,...S.skyBvlosHw] : S.djiBvlosHw;
}
function getActiveHw(configType) {
  const sm = S.skydioRisk;
  if(configType==='vlos') return sm ? [...S.djiVlosHw,...S.skyVlosHw] : S.djiVlosHw;
  return sm ? [...S.djiBvlosHw,...S.skyBvlosHw] : S.djiBvlosHw;
}

function calcProfileCost(et, configType) {
  const sm = S.skydioRisk;
  if(!et.vlos || !et.bvlos) {
    const migrated = migrateEventType(et);
    et.vlos = migrated.vlos;
    et.bvlos = migrated.bvlos;
    if(!et.activeConfig) et.activeConfig = migrated.activeConfig;
  }
  const prof = et[configType];
  if(!prof) { console.warn('Missing profile for', configType, et); return {labor:0,swCost:0,swBill:0,hwCost:0,hwBill:0,travel:0,totalCost:0,totalBill:0}; }
  const isVlos = configType === "vlos";

  let labor;
  if (isVlos) {
    labor = prof.pilots * prof.rate1099 * prof.coverageHours * prof.otMultiplier * prof.daysPerEvent;
  } else {
    const intCost   = prof.intRate   * prof.coverageHours * prof.otMultiplier * 7;
    const pilotCost = prof.pilotRate * prof.coverageHours * prof.otMultiplier * prof.daysPerEvent;
    labor = intCost + (2 * pilotCost);
  }
  const sw     = calcTableTotals(prof.swItems, prof.dronesCount, true,  S.amortWeeks, prof.daysPerEvent, false);
  const travel = calcTravelTotal(prof.travel);
  const pkgId  = prof.packageId || (isVlos ? 1 : 2);
  const hwItems= getPackageItems(pkgId, configType);
  const hw     = calcTableTotals(hwItems, prof.dronesCount, false, S.amortWeeks, prof.daysPerEvent, false);
  const _pkg   = S.hwPackages ? S.hwPackages.find(p=>p.id===pkgId) : null;

  return {
    labor,
    swCost: sw.cost,  swBill: sw.bill,
    hwCost: hw.cost,  hwBill: hw.bill,
    travel,
    packageName: _pkg ? _pkg.name : 'Unknown Package',
    totalCost: labor + hw.cost + sw.cost + travel,
    totalBill: labor + hw.bill + sw.bill + travel,
  };
}

function calcEventTypeCostPerEvent(et) {
  return calcProfileCost(et, et.activeConfig || 'bvlos');
}

function derivePortfolio() {
  const sm = S.skydioRisk;
  const ets = S.eventTypes;

  const usedPkgIds = new Set();
  ets.forEach(et => {
    const prof = et[et.activeConfig||'bvlos'] || et.bvlos || et.vlos;
    if(prof && et.eventsPerYear > 0) usedPkgIds.add(prof.packageId || (et.activeConfig==='vlos'?1:2));
  });
  const usedPkgs = [...usedPkgIds].map(id => S.hwPackages ? S.hwPackages.find(p=>p.id===id) : null).filter(Boolean);

  const vlosHwItems  = getActiveHw("vlos");
  const bvlosHwItems = getActiveHw("bvlos");
  const hasVlosEvents  = ets.some(e=>e.activeConfig==='vlos' && e.eventsPerYear>0);
  const hasBvlosEvents = ets.some(e=>e.activeConfig==='bvlos' && e.eventsPerYear>0);

  const pkgCapEx = {};
  const pkgAnnual = {};
  if(S.hwPackages && S.hwPackages.length > 0){
    usedPkgs.forEach(pkg => {
      pkgCapEx[pkg.id]  = pkg.hwItems.reduce((s,i)=>s+i.unitCost*i.qty, 0);
      pkgAnnual[pkg.id] = pkg.hwItems.filter(i=>i.annual).reduce((s,i)=>s+i.unitCost*i.qty, 0);
    });
  }

  const vlosPkgId  = (() => { const et=ets.find(e=>e.activeConfig==='vlos'); const p=et&&(et.vlos||et.bvlos); return p ? (p.packageId||1) : 1; })();
  const bvlosPkgId = (() => { const et=ets.find(e=>e.activeConfig==='bvlos'); const p=et&&(et.bvlos||et.vlos); return p ? (p.packageId||2) : 2; })();
  const hwOneTimeVlos  = pkgCapEx[vlosPkgId]  || calcHwOneTime(vlosHwItems,  sm);
  const hwOneTimeBvlos = pkgCapEx[bvlosPkgId] || calcHwOneTime(bvlosHwItems, sm);
  const hwAnnualVlos   = pkgAnnual[vlosPkgId]  || calcHwAnnualRecurring(vlosHwItems,  sm);
  const hwAnnualBvlos  = pkgAnnual[bvlosPkgId] || calcHwAnnualRecurring(bvlosHwItems, sm);

  const hwOneTime     = usedPkgs.length > 0
    ? Object.values(pkgCapEx).reduce((s,v)=>s+v,0)
    : (hasVlosEvents?hwOneTimeVlos:0)+(hasBvlosEvents?hwOneTimeBvlos:0);
  const hwAnnualTotal = usedPkgs.length > 0
    ? Object.values(pkgAnnual).reduce((s,v)=>s+v,0)
    : (hasVlosEvents?hwAnnualVlos:0)+(hasBvlosEvents?hwAnnualBvlos:0);

  const etCalcs = ets.map(et => {
    const perEvt = calcEventTypeCostPerEvent(et);
    const totalRevenue    = et.eventsPerYear * et.revenuePerEvent;
    const totalCostFull   = et.eventsPerYear * perEvt.totalCost;
    const totalBillFull   = et.eventsPerYear * perEvt.totalBill;
    const totalOpCostNoHw = et.eventsPerYear * (perEvt.labor + perEvt.swCost + perEvt.travel);
    const profit          = totalRevenue - totalCostFull;
    const margin          = totalRevenue > 0 ? profit/totalRevenue : 0;
    const weeksUsed       = et.eventsPerYear * ((et[et.activeConfig||'bvlos']||et.bvlos||et.vlos||{daysPerEvent:7}).daysPerEvent/7);
    const profitPerEvt    = et.revenuePerEvent - perEvt.totalCost;
    const marginPerEvt    = et.revenuePerEvent > 0 ? profitPerEvt/et.revenuePerEvent : 0;
    return {
      et, perEvt,
      totalRevenue, totalCostFull, totalBillFull, totalOpCostNoHw,
      profit, margin, weeksUsed,
      profitPerEvt, marginPerEvt,
    };
  });

  const totalRevenue   = etCalcs.reduce((s,e)=>s+e.totalRevenue, 0);
  const totalOpCost    = etCalcs.reduce((s,e)=>s+e.totalOpCostNoHw, 0);
  const totalEvents    = ets.reduce((s,e)=>s+e.eventsPerYear, 0);
  const totalWeeksUsed = etCalcs.reduce((s,e)=>s+e.weeksUsed,    0);
  const utilPct        = S.seasonWeeks > 0 ? Math.min(1, totalWeeksUsed/S.seasonWeeks) : 0;

  const totalFullCost    = etCalcs.reduce((s,e)=>s+e.totalCostFull, 0);
  const opProfitBeforeHw = totalRevenue - totalOpCost;
  const netProfitAfterHw = opProfitBeforeHw - hwOneTime;
  const fullProfit       = totalRevenue - totalFullCost;
  const opMargin         = totalRevenue > 0 ? opProfitBeforeHw/totalRevenue : 0;
  const fullMargin       = totalRevenue > 0 ? fullProfit/totalRevenue : 0;

  const vlosEventsPerYear  = ets.filter(e=>e.activeConfig==='vlos').reduce((s,e)=>s+e.eventsPerYear,0);
  const bvlosEventsPerYear = ets.filter(e=>e.activeConfig==='bvlos').reduce((s,e)=>s+e.eventsPerYear,0);
  const vlosProfitPerEvt = (() => {
    const vlosCalcs = etCalcs.filter(e=>e.et.activeConfig==='vlos');
    const rev = vlosCalcs.reduce((s,e)=>s+e.totalRevenue,0);
    const cst = vlosCalcs.reduce((s,e)=>s+e.totalCostFull,0);
    return vlosEventsPerYear > 0 ? (rev-cst)/vlosEventsPerYear : 0;
  })();
  const bvlosProfitPerEvt = (() => {
    const bCalcs = etCalcs.filter(e=>e.et.activeConfig==='bvlos');
    const rev = bCalcs.reduce((s,e)=>s+e.totalRevenue,0);
    const cst = bCalcs.reduce((s,e)=>s+e.totalCostFull,0);
    return bvlosEventsPerYear > 0 ? (rev-cst)/bvlosEventsPerYear : 0;
  })();
  const vlosBeEvents  = hasVlosEvents  && vlosProfitPerEvt  > 0 ? Math.ceil(hwOneTimeVlos /vlosProfitPerEvt)  : null;
  const bvlosBeEvents = hasBvlosEvents && bvlosProfitPerEvt > 0 ? Math.ceil(hwOneTimeBvlos/bvlosProfitPerEvt) : null;

  function calcPeriod(months) {
    const scale  = months/12;
    const rev    = totalRevenue * scale;
    const opCst  = totalOpCost  * scale;
    const annHw  = hwAnnualTotal * scale;
    const cost   = hwOneTime + opCst + annHw;
    const profit = rev - cost;
    const days   = months * 30.4;
    return {
      rev, opCst, annHw, cost, profit,
      margin: rev > 0 ? profit/rev : 0,
      events: Math.round(totalEvents * scale),
      dailyRev:  rev/days,   hourlyRev:  rev/(days*24),
      dailyCost: cost/days,  hourlyCost: cost/(days*24),
      dailyProfit: profit/days, hourlyProfit: profit/(days*24),
    };
  }

  return {
    etCalcs,
    vlosHwItems, bvlosHwItems,
    hwOneTimeVlos, hwOneTimeBvlos, hwOneTime,
    hwAnnualVlos, hwAnnualBvlos, hwAnnualTotal,
    hasVlosEvents, hasBvlosEvents,
    vlosBeEvents, bvlosBeEvents,
    totalRevenue, totalOpCost, totalFullCost, totalEvents, totalWeeksUsed, utilPct,
    opProfitBeforeHw, netProfitAfterHw, opMargin,
    fullProfit, fullMargin,
    sm,
    periods: [
      {label:"12 Months", data:calcPeriod(12)},
      {label:"24 Months", data:calcPeriod(24)},
      {label:"36 Months", data:calcPeriod(36)},
      {label:"48 Months", data:calcPeriod(48)},
      {label:"60 Months", data:calcPeriod(60)},
    ],
  };
}

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})) {
    if (k==='class') e.className=v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k,v);
  }
  kids.forEach(c=>c!=null&&e.append(typeof c==='string'?c:c));
  return e;
}
const div  = (cls,...kids) => el('div',{class:cls},...kids);

function makeSection(title,...kids) {
  const s=div('sec'), h=div('sec-hdr'), b=div('sec-body');
  h.textContent=title; kids.forEach(k=>k&&b.append(k)); s.append(h,b); return s;
}

function makeRow(label, value, onChange, opts={}) {
  const w=div('row'), lw=div(''), lb=div('row-lbl');
  lb.textContent=label; lw.append(lb);
  if(opts.note){const n=div('row-note'+(opts.warn?' warn':'')); n.textContent=opts.note; lw.append(n);}
  const iw=div('row-inp-wrap');
  const pfx=el('span',{class:'row-pfx'}); pfx.textContent=opts.prefix||'$';
  const inp=el('input',{type:'number',class:'row-inp',value:value});
  if(onChange){
    inp.addEventListener('blur',e=>onChange(+e.target.value));
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
  }
  iw.append(pfx,inp); w.append(lw,iw); return w;
}

function makeStatCard(label,value,color,sub) {
  const c=div('stat-card'), l=div('stat-lbl'), v=div('stat-val');
  l.textContent=label; v.textContent=value; if(color)v.style.color=color; c.append(l,v);
  if(sub){const s=div('stat-sub'); s.textContent=sub; c.append(s);}
  return c;
}

function miniRow(label, value, valueColor) {
  const r=div('mini-row');
  const lb=div('mini-lbl'); lb.textContent=label;
  const vl=el('span',{}); vl.textContent=value; if(valueColor)vl.style.color=valueColor;
  r.append(lb,vl); return r;
}

function makeItemTable(getItems, setItems, getDrops, isSwTable, getAmort, getEventDays, getSkydioMode) {
  const HW_COLS="2fr 45px 80px 55px 75px 65px 24px";
  const SW_COLS="2fr 45px 80px 55px 75px 70px 24px";
  const container=div('');

  function rebuild() {
    container.innerHTML='';
    const items=getItems(), dronesCount=getDrops(), amortWeeks=getAmort();
    const eventDays=getEventDays(), skydioMode=getSkydioMode();
    const cols=isSwTable?SW_COLS:HW_COLS;
    const headers=["Item Name","Qty","Unit Cost","Margin%","Bill/Event",isSwTable?"Scope":"Amort",""];

    const hdr=div('itbl-hdr'); hdr.style.gridTemplateColumns=cols;
    headers.forEach((h,i)=>{const d=div('itbl-col');d.textContent=h;if(i>0)d.style.textAlign='center';hdr.append(d);});
    container.append(hdr);

    let totalCostAmort=0, totalBillAmort=0;
    items.forEach(it=>{
      const skip=skydioMode&&it.isDji;
      const eq=isSwTable?(it.perDrone?it.qty*dronesCount:it.qty):it.qty;
      const tc=it.unitCost*eq, tb=tc+tc*(it.margin/100);
      const ac=isSwTable?tc:(it.annual?tc/52:(tc/amortWeeks)*(eventDays/7));
      const ab=isSwTable?tb:(it.annual?tb/52:(tb/amortWeeks)*(eventDays/7));
      if(!skip){totalCostAmort+=ac;totalBillAmort+=ab;}

      const rowBg=skydioMode&&it.isSkydio?"#0d2a1a":skydioMode&&it.isDji?"#2a0d0d":"transparent";
      const row=div('itbl-row'); row.style.gridTemplateColumns=cols;
      if(rowBg!=='transparent'){row.style.background=rowBg;row.style.borderRadius='3px';row.style.padding='2px 3px';}

      const nameCell=div('name-cell');
      if(skydioMode&&it.isSkydio){const b=div('badge-sky');b.textContent='SKY';nameCell.append(b);}
      if(skydioMode&&it.isDji){const b=div('badge-dji');b.textContent='DJI';nameCell.append(b);}
      const nameInp=el('input',{type:'text',class:'itbl-name',value:it.name});
      nameInp.addEventListener('blur',e=>{it.name=e.target.value;setItems([...items]);rerender();});
      nameInp.addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
      nameCell.append(nameInp);

      const qtyInp=el('input',{type:'number',class:'itbl-inp',value:it.qty});
      qtyInp.addEventListener('blur',e=>{it.qty=+e.target.value;setItems([...items]);rerender();});
      qtyInp.addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});

      const costInp=el('input',{type:'number',class:'itbl-inp',value:it.unitCost,step:'0.01'});
      costInp.addEventListener('blur',e=>{it.unitCost=+e.target.value;setItems([...items]);rerender();});
      costInp.addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});

      const mWrap=div('row-inp-wrap');
      const mInp=el('input',{type:'number',class:'itbl-inp',value:it.margin});
      mInp.addEventListener('blur',e=>{it.margin=+e.target.value;setItems([...items]);rerender();});
      mInp.addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
      const pctSp=el('span',{class:'row-pfx'});pctSp.textContent='%';
      mWrap.append(mInp,pctSp);

      const billDiv=div('');
      billDiv.style.cssText='font-size:11px;text-align:right;font-weight:500;';
      billDiv.style.color=it.margin>0?'#4ec94e':it.margin<0?'#e24b4a':'#888';
      billDiv.textContent=fmt(skip?0:ab);

      const typeEl=el('select',{class:'itbl-sel'});
      if(isSwTable){
        ['Per site','Per drone'].forEach((opt,idx)=>{
          const o=el('option',{value:idx===0?'site':'drone'});o.textContent=opt;
          if(it.perDrone===(idx===1))o.selected=true;typeEl.append(o);
        });
        typeEl.addEventListener('change',e=>{it.perDrone=e.target.value==='drone';setItems([...items]);rerender();});
      } else {
        ['Per event','Annual/52'].forEach((opt,idx)=>{
          const o=el('option',{value:idx===0?'event':'annual'});o.textContent=opt;
          if(it.annual===(idx===1))o.selected=true;typeEl.append(o);
        });
        typeEl.addEventListener('change',e=>{it.annual=e.target.value==='annual';setItems([...items]);rerender();});
      }

      const removeBtn=el('button',{class:'itbl-remove'});removeBtn.textContent='x';
      removeBtn.addEventListener('click',()=>{setItems(items.filter(x=>x.id!==it.id));rerender();});

      row.append(nameCell,qtyInp,costInp,mWrap,billDiv,typeEl,removeBtn);
      container.append(row);
    });

    const footer=div('itbl-footer');
    const totDiv=div('');totDiv.style.cssText='font-size:11px;font-weight:500';
    totDiv.innerHTML='Total/Event &nbsp;<span style="color:var(--t2);font-weight:400">Cost: '+fmt(totalCostAmort)+'</span>&nbsp;<span style="color:var(--green)">Billable: '+fmt(totalBillAmort)+'</span>';
    const addBtn=el('button',{class:'add-btn'});addBtn.textContent='+ Add Item';
    addBtn.addEventListener('click',()=>{
      const newItem=isSwTable
        ?{id:Date.now()+Math.random(),name:"New Item",qty:1,unitCost:0,margin:30,perDrone:false}
        :{id:Date.now()+Math.random(),name:"New Item",qty:1,unitCost:0,margin:30,annual:false,isDji:false,isSkydio:false};
      setItems([...items,newItem]);rerender();
    });
    footer.append(totDiv,addBtn); container.append(footer);
  }
  rebuild();
  return container;
}

function makeProfilePanel(et, configType, profCalc, isActive) {

  const isBvlos = configType === 'bvlos';

  const panel = div('');
  panel.style.cssText = 'background:var(--bg1);border-radius:6px;border:1.5px solid '+(isActive?'var(--red)':'var(--border)')+';overflow:hidden;';

  const ph = div('');
  ph.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:'+(isActive?'rgba(192,57,43,0.18)':'var(--bg2)')+';';
  const phLeft = div('');
  phLeft.style.cssText = 'display:flex;align-items:center;gap:8px;';
  const configBadge = div('et-badge '+(isVlos?'vlos':'bvlos'));
  configBadge.textContent = configType.toUpperCase();

  setActiveBtn.textContent = isActive ? 'Active' : 'Set Active';
  setActiveBtn.style.cssText = 'font-size:10px;padding:2px 8px;';
  setActiveBtn.addEventListener('click', () => { et.activeConfig = configType; rerender(); });
  ph.append(phLeft, setActiveBtn);
  panel.append(ph);

  const statsBar = div('');
  statsBar.style.cssText = 'display:flex;gap:16px;padding:6px 12px;background:var(--bg2);border-top:0.5px solid var(--border);flex-wrap:wrap;';
  const rev = et.revenuePerEvent;
  const profitRaw = rev - profCalc.totalCost;
  const margRaw   = profitRaw / Math.max(1,rev);
  [['Cost/Event', fmt(profCalc.totalCost), undefined],
   ['Profit/Event', fmt(profitRaw), profitRaw<0?'#e24b4a':'#4ec94e'],
   ['Margin', pct(margRaw), margRaw<0?'#e24b4a':margRaw<0.15?'#f5c45b':'#4ec94e'],
  ].forEach(([lbl,val,color]) => {
    const s=div('');s.style.cssText='min-width:90px;';
    const l=div('et-stat-lbl');l.textContent=lbl;
    const v=div('et-stat-val');v.textContent=val;if(color)v.style.color=color;
    s.append(l,v);statsBar.append(s);
  });
  panel.append(statsBar);

  const innerScroll = div('');
  innerScroll.className = 'panel-scroll';
  innerScroll.style.cssText = 'overflow-x:auto;';
  const inner = div('');
  inner.style.cssText = 'display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:0;min-width:660px;';

  const colA = div('');
  colA.style.cssText = 'padding:10px;border-right:0.5px solid var(--border);';
  const s1=div('');s1.style.cssText='font-size:10px;font-weight:700;color:var(--t2);letter-spacing:1px;margin-bottom:8px;text-transform:uppercase;';s1.textContent='Scheduling';
  colA.append(s1);

function makeEventTypeCard(et, etCalc) {
  const card=div('et-card');
  const hdr=div('et-header');
  hdr.addEventListener('click',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'||e.target.tagName==='SELECT')return;
    et.open=!et.open;rerender();
  });
  const dot=div('et-color-dot');dot.style.background=et.color;
  const nameInp=el('input',{type:'text',class:'et-name-inp',value:et.name});
  nameInp.addEventListener('blur',e=>{et.name=e.target.value;rerender();});
  nameInp.addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
  const badges=div('et-badges');
  const cfgBadge=div('et-badge '+(et.activeConfig==='vlos'?'vlos':'bvlos'));
  cfgBadge.textContent=et.activeConfig.toUpperCase()+' ACTIVE';
  const evtBadge=div('et-badge events');evtBadge.textContent=et.eventsPerYear+' events/yr';
  const wkBadge=div('et-badge events');wkBadge.textContent=etCalc.weeksUsed.toFixed(1)+' wks';
  badges.append(cfgBadge,evtBadge,wkBadge);
  const vc=calcProfileCost(et,'vlos'),bc=calcProfileCost(et,'bvlos'),rv=et.revenuePerEvent;
  const stats=div('et-stats');
  const addStat=(lbl,val,color)=>{const s=div('et-stat'),l=div('et-stat-lbl'),v=div('et-stat-val');l.textContent=lbl;v.textContent=val;if(color)v.style.color=color;s.append(l,v);stats.append(s);};
  addStat('VLOS Cost',fmt(vc.totalCost),undefined);
  addStat('VLOS Margin',pct((rv-vc.totalCost)/Math.max(1,rv)),(rv-vc.totalCost)<0?'#e24b4a':(rv-vc.totalCost)/rv<0.15?'#f5c45b':'#4ec94e');
  addStat('BVLOS Cost',fmt(bc.totalCost),undefined);
  addStat('BVLOS Margin',pct((rv-bc.totalCost)/Math.max(1,rv)),(rv-bc.totalCost)<0?'#e24b4a':(rv-bc.totalCost)/rv<0.15?'#f5c45b':'#4ec94e');
  const removeBtn=el('button',{class:'et-remove'});removeBtn.textContent='x';
  removeBtn.title='Remove event type';
  removeBtn.addEventListener('click',e=>{e.stopPropagation();if(S.eventTypes.length<=1){alert('Need at least one event type.');return;}S.eventTypes=S.eventTypes.filter(x=>x.id!==et.id);rerender();});
  hdr.append(dot,nameInp,badges,stats,removeBtn);card.append(hdr);

  const body=div('et-body'+(et.open?' open':''));
  const sharedRow=div('');sharedRow.style.cssText='display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;padding:8px 0;border-bottom:0.5px solid var(--border);';
  const colorLbl=div('');colorLbl.style.cssText='font-size:11px;color:var(--t2)';colorLbl.textContent='Color:';
  const colorInp=el('input',{type:'color',value:et.color});
  colorInp.style.cssText='width:26px;height:20px;border:none;background:none;cursor:pointer;padding:0';
  colorInp.addEventListener('input',e=>{et.color=e.target.value;dot.style.background=et.color;});
  colorInp.addEventListener('change',()=>rerender());
  const sharedF=div('');sharedF.style.cssText='display:flex;gap:24px;align-items:flex-start;flex:1;flex-wrap:wrap;';
  sharedF.append(
    makeRow("Revenue Per Event",et.revenuePerEvent,v=>{et.revenuePerEvent=v;rerender();}),
    makeRow("Events Per Year",et.eventsPerYear,v=>{et.eventsPerYear=Math.max(0,v);rerender();},{prefix:'#'}),
  );
  sharedRow.append(colorLbl,colorInp,sharedF);body.append(sharedRow);

  const panelRow=div('');panelRow.style.cssText='display:grid;grid-template-columns:repeat(2,minmax(480px,1fr));gap:10px;overflow-x:auto;';
  panelRow.append(
    makeProfilePanel(et,'vlos', calcProfileCost(et,'vlos'), et.activeConfig==='vlos'),
    makeProfilePanel(et,'bvlos',calcProfileCost(et,'bvlos'),et.activeConfig==='bvlos'),
  );
  body.append(panelRow);card.append(body);return card;
}

function makeUtilBar(etCalcs, totalWeeksUsed, seasonWeeks) {
  const wrap=div('util-bar-wrap');
  let offset=0;
  etCalcs.forEach(ec=>{
    const w=Math.min(100-offset,(ec.weeksUsed/seasonWeeks)*100);
    const seg=div('util-bar-segment');
    seg.style.left=offset+'%';seg.style.width=w+'%';
    seg.style.background=ec.et.color;seg.style.opacity='0.85';
    seg.title=ec.et.name+': '+ec.weeksUsed.toFixed(1)+' wks';
    wrap.append(seg);offset+=w;
  });
  if(offset<100){
    const idle=div('util-bar-segment');
    idle.style.left=offset+'%';idle.style.width=(100-offset)+'%';
    idle.style.background='#2a2a2a';idle.title='Idle';wrap.append(idle);
  }
  const lbl=div('util-bar-label');
  const used=Math.min(totalWeeksUsed,seasonWeeks).toFixed(1);
  const idle=Math.max(0,seasonWeeks-totalWeeksUsed).toFixed(1);
  lbl.textContent=used+' / '+seasonWeeks+' wks · '+idle+' idle';
  wrap.append(lbl);
  return wrap;
}

  root.append(statRow);

  const utilBody=div('');
  utilBody.append(makeUtilBar(p.etCalcs, p.totalWeeksUsed, S.seasonWeeks));
  const legend=div('');legend.style.cssText='display:flex;gap:16px;flex-wrap:wrap;margin-top:6px';
  p.etCalcs.forEach(ec=>{
    const item=div('');item.style.cssText='display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t2)';
    const dot=div('');dot.style.cssText='width:10px;height:10px;border-radius:50%;background:'+ec.et.color+';flex-shrink:0';
    const txt=document.createTextNode(ec.et.name+' ('+ec.et.activeConfig.toUpperCase()+' active): '+ec.weeksUsed.toFixed(1)+' wks');
    item.append(dot,txt);legend.append(item);
  });
  if(idleWks>0){
    const item=div('');item.style.cssText='display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t3)';
    const dot=div('');dot.style.cssText='width:10px;height:10px;border-radius:50%;background:#2a2a2a;flex-shrink:0';
    item.append(dot,document.createTextNode('Idle: '+idleWks.toFixed(1)+' wks'));legend.append(item);
  }
  utilBody.append(legend);
  root.append(makeSection('DXD SEASON UTILIZATION — '+S.seasonWeeks+' WK / YR TARGET', utilBody));

  const tableRows=[
    {label:"Events in Period",           fn:d=>`${d.events}`},
    {label:"Gross Revenue",              fn:d=>fmt(d.rev)},
    {label:"VLOS HW (one-time CapEx)",   fn:()=>p.hasVlosEvents?fmt(p.hwOneTimeVlos):'—'},
    {label:"BVLOS HW (one-time CapEx)",  fn:()=>p.hasBvlosEvents?fmt(p.hwOneTimeBvlos):'—'},
    {label:"Op Costs (labor+SW+travel)", fn:d=>fmt(d.opCst), note:'HW CapEx shown separately above'},
    {label:"Annual HW Recurring",        fn:d=>fmt(d.annHw), color:'#f5c45b'},
    {label:"Total Costs",                fn:d=>fmt(d.cost),   bold:true},
    {label:"Net Profit",                 fn:d=>fmt(d.profit), bold:true, colorFn:d=>d.profit<0?'#e24b4a':'#4ec94e'},
    {label:"Net Margin",                 fn:d=>pct(d.margin), bold:true, colorFn:d=>d.margin<0?'#e24b4a':d.margin<0.15?'#f5c45b':'#4ec94e'},
    {label:"-- HW Break-Even --",        fn:()=>'', dim:true},
    {label:"VLOS Kit Recovered By",      fn:d=>{ if(!p.hasVlosEvents||!p.vlosBeEvents) return '—'; return d.events>=p.vlosBeEvents?'Recovered >= event '+p.vlosBeEvents:'Event '+p.vlosBeEvents+' (need '+(p.vlosBeEvents-d.events)+' more)'; }, colorFn:d=>(!p.hasVlosEvents||!p.vlosBeEvents)?'#555':(d.events>=p.vlosBeEvents?'#4ec94e':'#f5c45b')},
    {label:"BVLOS Kit Recovered By",     fn:d=>{ if(!p.hasBvlosEvents||!p.bvlosBeEvents) return '—'; return d.events>=p.bvlosBeEvents?'Recovered >= event '+p.bvlosBeEvents:'Event '+p.bvlosBeEvents+' (need '+(p.bvlosBeEvents-d.events)+' more)'; }, colorFn:d=>(!p.hasBvlosEvents||!p.bvlosBeEvents)?'#555':(d.events>=p.bvlosBeEvents?'#4ec94e':'#f5c45b')},
    {label:"-- Daily / Hourly --",       fn:()=>'', dim:true},
    {label:"Daily Revenue",              fn:d=>fmtD(d.dailyRev)},
    {label:"Daily Cost",                 fn:d=>fmtD(d.dailyCost)},
    {label:"Daily Profit",               fn:d=>fmtD(d.dailyProfit),  colorFn:d=>d.dailyProfit<0?'#e24b4a':'#4ec94e'},
    {label:"Hourly Revenue",             fn:d=>fmtD(d.hourlyRev)},
    {label:"Hourly Cost",                fn:d=>fmtD(d.hourlyCost)},
    {label:"Hourly Profit",              fn:d=>fmtD(d.hourlyProfit), colorFn:d=>d.hourlyProfit<0?'#e24b4a':'#4ec94e'},
  ];

  const tbl=el('table',{class:'ptbl'});
  const thead=el('thead',{});const thr=el('tr',{});
  const th0=el('th',{});th0.textContent='Portfolio '+(S.skydioRisk?'(Skydio)':'(DJI)');th0.style.textAlign='left';thr.append(th0);
  p.periods.forEach(pp=>{const th=el('th',{});th.textContent=pp.label;thr.append(th);});
  thead.append(thr);tbl.append(thead);
  const tbody=el('tbody',{});
  tableRows.forEach(row=>{
    const tr=el('tr',{class:row.bold?'bold':row.dim?'dim':''});
    const td0=el('td',{});td0.textContent=row.label;
    if(row.dim)td0.style.color='var(--t3)';
    if(row.color)td0.style.color=row.color;
    tr.append(td0);
    p.periods.forEach(pp=>{
      const td=el('td',{});td.textContent=row.fn(pp.data);
      if(row.colorFn)td.style.color=row.colorFn(pp.data);
      else if(row.color)td.style.color=row.color;
      tr.append(td);
    });
    tbody.append(tr);
  });
  tbl.append(tbody);
  const tblWrap=div('overflow-x');tblWrap.append(tbl);
  root.append(makeSection('5-YEAR NET ANALYSIS — PORTFOLIO (12 / 24 / 36 / 48 / 60 MONTHS)', tblWrap));

  const etBody=div('portfolio-grid');
  p.etCalcs.forEach(ec=>etBody.append(makeEventTypeCard(ec.et, ec)));
  const addBtn=el('button',{class:'add-et-btn'});addBtn.textContent='+ ADD EVENT TYPE';
  addBtn.addEventListener('click',()=>{
    const usedColors=S.eventTypes.map(e=>e.color);
    const color=ET_COLORS.find(c=>!usedColors.includes(c))||ET_COLORS[S.eventTypes.length%ET_COLORS.length];
    S.eventTypes.push(newEventType({color,open:true}));rerender();
  });
  root.append(makeSection('EVENT TYPE PORTFOLIO — Click header to expand / collapse', etBody, addBtn));

  const pkgLibBody = div('portfolio-grid');

  S.hwPackages.forEach(pkg => {
    const capex   = pkg.hwItems.reduce((s,i)=>s+i.unitCost*i.qty, 0);
    const annual  = pkg.hwItems.filter(i=>i.annual).reduce((s,i)=>s+i.unitCost*i.qty, 0);
    const inUse   = S.eventTypes.some(et => {
      const vp = et.vlos||{}; const bp = et.bvlos||{};
      return (vp.packageId===pkg.id || bp.packageId===pkg.id);
    });
    const isDjiPkg= pkg.hasDji !== false;
    const djiBanned = S.skydioRisk && isDjiPkg;

    const card = div('et-card');
    card.style.border = djiBanned ? '1px solid var(--yellow)' : inUse ? '1px solid var(--red)' : '0.5px solid var(--border)';

    const pkgHdr = div('et-header');
    pkgHdr.addEventListener('click', e => {
      if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'||e.target.tagName==='SELECT') return;
      pkg.open = !pkg.open; rerender();
    });

    const pkgNameInp = el('input',{type:'text',class:'et-name-inp',value:pkg.name});
    pkgNameInp.addEventListener('blur', e=>{pkg.name=e.target.value;rerender();});
    pkgNameInp.addEventListener('keydown', e=>{if(e.key==='Enter')e.target.blur();});

    const pkgBadges = div('et-badges');
    const ktBadge = div('et-badge '+(pkg.kitType==='vlos'?'vlos':'bvlos'));
    ktBadge.textContent = pkg.kitType.toUpperCase();
    const inUseBadge = div('et-badge events');
    inUseBadge.textContent = inUse ? 'In Use' : 'Unassigned';
    if(inUse) inUseBadge.style.color = 'var(--green)';
    pkgBadges.append(ktBadge, inUseBadge);
    if(djiBanned){
      const banBadge = div('et-badge');
      banBadge.textContent = '(!) DJI BAN';
      banBadge.style.cssText = 'background:rgba(245,196,91,0.15);color:var(--yellow);border:0.5px solid var(--yellow)';
      pkgBadges.append(banBadge);
    }

    const pkgStats = div('et-stats');
    const addPS = (l,v,c) => {const s=div('et-stat'),lb=div('et-stat-lbl'),vl=div('et-stat-val');lb.textContent=l;vl.textContent=v;if(c)vl.style.color=c;s.append(lb,vl);pkgStats.append(s);};
    addPS('One-Time CapEx', fmt(capex), '#f5c45b');
    addPS('Annual Recurring', annual>0?fmt(annual):'None', annual>0?'#f5c45b':'var(--t3)');
    addPS('Items', pkg.hwItems.length);

    const ktToggle = div('');ktToggle.style.cssText='display:flex;gap:4px;';
    ['vlos','bvlos'].forEach(kt=>{
      const btn=el('button',{class:'cfg-btn'+(pkg.kitType===kt?' active':'')});
      btn.textContent=kt.toUpperCase();btn.style.cssText='font-size:10px;padding:2px 7px;';
      btn.addEventListener('click',e=>{e.stopPropagation();pkg.kitType=kt;rerender();});
      ktToggle.append(btn);
    });

    const removePkgBtn = el('button',{class:'et-remove'});removePkgBtn.textContent='x';
    removePkgBtn.title='Delete package';
    removePkgBtn.addEventListener('click',e=>{
      e.stopPropagation();
      if(inUse){alert('This package is assigned to one or more events. Re-assign before deleting.');return;}
      if(S.hwPackages.length<=1){alert('Need at least one package.');return;}
      S.hwPackages=S.hwPackages.filter(p=>p.id!==pkg.id);rerender();
    });

    pkgHdr.append(pkgNameInp, pkgBadges, pkgStats, ktToggle, removePkgBtn);
    card.append(pkgHdr);

    const pkgBody = div('et-body'+(pkg.open?' open':''));
    const pkgSumBox=div('hw-kit-box');
    [["One-Time CapEx",fmt(capex),'#f5c45b'],["Annual Recurring",annual>0?fmt(annual):'None',annual>0?'#f5c45b':'var(--t3)'],["Amort Period",S.amortWeeks+' weeks',undefined]].forEach(([l,v,c])=>{
      const r=div('hw-kit-row');const lb=div('hw-kit-lbl');lb.textContent=l;const vl=div('hw-kit-val');vl.textContent=v;if(c)vl.style.color=c;r.append(lb,vl);pkgSumBox.append(r);
    });
    if(djiBanned){
      const banNote=div('');banNote.style.cssText='padding:6px 8px;background:#2a1400;border-radius:3px;font-size:10px;color:var(--yellow);margin-top:6px;';
      banNote.innerHTML='(!) DJI BAN ACTIVE — This package contains DJI equipment.';
      pkgSumBox.append(banNote);
    }
    pkgBody.append(pkgSumBox);
    const pkgHwSub=div('sec-sub');pkgHwSub.textContent='Hardware items — amortized per event based on Amort Period above';
    const pkgHwTable=makeItemTable(
      ()=>pkg.hwItems,
      newItems=>{pkg.hwItems=newItems;},
      ()=>3, false, ()=>S.amortWeeks, ()=>7, ()=>false
    );
    pkgBody.append(pkgHwSub, pkgHwTable);
    card.append(pkgBody);
    pkgLibBody.append(card);
  });

  const addPkgRow = div('');
  addPkgRow.style.cssText = 'display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap;';

  const newPkgNameInp = el('input',{type:'text',placeholder:'Package name e.g. Skydio BVLOS Package 1'});
  newPkgNameInp.style.cssText = 'flex:1;min-width:200px;font-size:12px;padding:5px 8px;border-radius:4px;border:1px dashed var(--border2);background:var(--bg2);color:var(--t1);';

  const newPkgKtSel = el('select',{class:'itbl-sel'});
  newPkgKtSel.style.cssText = 'font-size:12px;padding:5px 8px;border-radius:4px;width:auto;';
  [['bvlos','BVLOS Kit'],['vlos','VLOS Kit']].forEach(([v,l])=>{
    const o=el('option',{value:v});o.textContent=l;newPkgKtSel.append(o);
  });

  const newPkgPresetSel = el('select',{class:'itbl-sel'});
  newPkgPresetSel.style.cssText = 'font-size:12px;padding:5px 8px;border-radius:4px;width:auto;';
  [
    ['dji-bvlos','Start from DJI BVLOS preset'],
    ['dji-vlos','Start from DJI VLOS preset'],
    ['skydio-bvlos','Start from Skydio BVLOS preset'],
    ['skydio-vlos','Start from Skydio VLOS preset'],
    ['empty','Start empty'],
  ].forEach(([v,l])=>{const o=el('option',{value:v});o.textContent=l;newPkgPresetSel.append(o);});

  const addPkgBtn=el('button',{class:'cfg-btn'});addPkgBtn.textContent='+ ADD PACKAGE';
  addPkgBtn.style.cssText='border-color:var(--green);color:var(--green);padding:4px 12px;';
  addPkgBtn.addEventListener('click',()=>{
    const name = newPkgNameInp.value.trim();
    if(!name){newPkgNameInp.style.borderColor='var(--red2)';return;}
    const kt   = newPkgKtSel.value;
    const preset = newPkgPresetSel.value;
    let hwItems;
    if(preset==='dji-bvlos')    hwItems = clone(DJI_BVLOS_HW);
    else if(preset==='dji-vlos') hwItems = clone(DJI_VLOS_HW);
    else if(preset==='skydio-bvlos') hwItems = clone(SKYDIO_BVLOS_HW);
    else if(preset==='skydio-vlos')  hwItems = clone(SKYDIO_VLOS_HW);
    else hwItems = [];
    S.hwPackages.push(newHwPackage({name, kitType:kt, hwItems, open:true}));
    newPkgNameInp.value = '';
    rerender();
  });

  addPkgRow.append(newPkgNameInp, newPkgKtSel, newPkgPresetSel, addPkgBtn);

  root.append(makeSection('HARDWARE PACKAGE LIBRARY — Assign packages to events via dropdown in each event profile', pkgLibBody, addPkgRow));

  const risks=[
    ['#e24b4a','Mixed VLOS + BVLOS portfolio requires BOTH kits — combined CapEx is additive, not shared'],
    ['#e24b4a','VLOS pilot count directly drives labor cost — model minimum pilots needed per event type'],
    ['#e24b4a','Idle weeks = HW amortization cost with zero revenue — fill capacity or shorten amort window'],
    ['#e24b4a','Software recurring every event — DroneSense per-drone cost never amortizes'],
    ['#f5c45b','Annual items (Casia G $26K, Sky Maintenance $104K) — marked Annual/52 in the package item table, spreading cost over 52 weeks'],
    ['#f5c45b','BVLOS travel: 1 integrator travels with system; remote pilots fly from home base — model ship vs. drive cost difference in rental/gas vs. airfare'],
    ['#f5c45b','Low-margin fill events can hurt portfolio margin even if revenue-positive — check per-ET margin'],
    ['#f5c45b','Seasonal cash flow: HW cost is front-loaded; revenue is earned event-by-event through the season'],
    ['#f5c45b','Op profit per event is the rate at which the HW CapEx is recovered — watch break-even events count'],
  ];
  const riskBody=div('');
  risks.forEach(([c,t])=>{
    const f=div('risk-flag');
    const dot=div('risk-dot');dot.style.background=c;
    const txt=div('risk-txt');txt.textContent=t;
    f.append(dot,txt);riskBody.append(f);
  });
  root.append(makeSection('KEY RISK FLAGS', riskBody));

  const ta=el('textarea',{class:'notes-area',placeholder:"Notes, assumptions, open questions, client context..."});
  ta.value=S.notes;
  const notesFooter=div('notes-footer');
  const charCount=div('notes-char');charCount.textContent=S.notes.length+' chars';
  ta.addEventListener('input',e=>{S.notes=e.target.value;charCount.textContent=S.notes.length+' chars';});
  const clearBtn=el('button',{class:'notes-clear'});clearBtn.textContent='Clear';
  clearBtn.addEventListener('click',()=>{S.notes='';ta.value='';charCount.textContent='0 chars';});
  notesFooter.append(charCount,clearBtn);
  const notesWrap=div('');notesWrap.append(ta,notesFooter);
  root.append(makeSection('NOTES',notesWrap));

  return root;
}

const STORAGE_KEY='dxd_event_pricing_v5';
function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(S));return true;}
  catch(e){console.warn('Save failed:',e);return false;}
}
function migrateEventType(et) {
  if(et.vlos && et.bvlos) return et;

  const isOldVlos = et.configType === 'vlos' || et.activeConfig === 'vlos';
  const days = et.daysPerEvent || 7;
  const hrs  = et.coverageHours || 24;
  const ot   = et.otMultiplier || 1.0;

  const defSw = () => [
    {id:Date.now()+Math.random(), name:"Starlink Subscription", qty:1, unitCost:70,  margin:30, perDrone:false},
    {id:Date.now()+Math.random(), name:"Drone Tag License",      qty:1, unitCost:30,  margin:30, perDrone:false},
    {id:Date.now()+Math.random(), name:"DroneSense",             qty:1, unitCost:700, margin:30, perDrone:true},
  ];

  const vlosProfile = {
    packageId: 1,
    daysPerEvent: days,
    coverageHours: hrs,
    otMultiplier: ot,
    rate1099: et.vlos1099Rate || et.vlos?.rate1099 || 68.46,
    pilots: et.vlosPilots || et.vlos?.pilots || 4,
    dronesCount: et.dronesCount || 3,
    travel: (isOldVlos && et.travel)
      ? {...et.travel}
      : {airfare:350, numTravelers:4, lodgingNights:days+1, lodgingRate:150, perDiemDays:days+1, rental:540, gas:100, eventWeeks:1},
    swItems: (isOldVlos && et.swItems) ? et.swItems : defSw(),
  };

  const bvlosProfile = {
    packageId: 2,
    daysPerEvent: days,
    coverageHours: hrs,
    otMultiplier: ot,
    intRate: et.bvlosIntRate || et.bvlos?.intRate || 65,
    pilotRate: et.bvlos1099Rate || et.bvlos?.pilotRate || 68.46,
    dronesCount: et.dronesCount || 3,
    travel: (!isOldVlos && et.travel)
      ? {...et.travel}
      : {airfare:350, numTravelers:1, lodgingNights:days, lodgingRate:150, perDiemDays:days, rental:0, gas:0, eventWeeks:1},
    swItems: (!isOldVlos && et.swItems) ? et.swItems : defSw(),
  };

  return Object.assign({}, et, {
    activeConfig: et.activeConfig || et.configType || 'bvlos',
    vlos: vlosProfile,
    bvlos: bvlosProfile,
    configType: undefined,
    daysPerEvent: undefined,
    coverageHours: undefined,
    otMultiplier: undefined,
    vlos1099Rate: undefined,
    vlosPilots: undefined,
    bvlosIntRate: undefined,
    bvlos1099Rate: undefined,
    travel: undefined,
    swItems: undefined,
    dronesCount: undefined,
  });
}

function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return false;
    const saved=JSON.parse(raw);
    if(saved.eventTypes){
      saved.eventTypes = saved.eventTypes.map(et => {
        if(!et.vlos || !et.bvlos) return migrateEventType(et);
        return et;
      });
    }
    Object.assign(S,saved);
    if(!S.hwPackages || S.hwPackages.length===0){
      S.hwPackages = [defaultVlosPackage(), defaultBvlosPackage()];
    }
    return true;
  }catch(e){
    console.warn('DXD: Load failed, clearing corrupt saved state:', e);
    try { localStorage.removeItem(STORAGE_KEY); } catch(e2) {}
    return false;
  }
}
function resetState(){
  if(!confirm('Reset all values to defaults?'))return;
  localStorage.removeItem(STORAGE_KEY);
  Object.assign(S,{
    skydioRisk:false, amortWeeks:36, seasonWeeks:36,
    djiVlosHw:clone(DJI_VLOS_HW), djiBvlosHw:clone(DJI_BVLOS_HW),
    skyVlosHw:clone(SKYDIO_VLOS_HW), skyBvlosHw:clone(SKYDIO_BVLOS_HW),
    hwPackages:[defaultVlosPackage(), defaultBvlosPackage()],
    eventTypes:[
      newEventType({id:1,name:"PGA Tour",color:"#4ec94e",configType:"bvlos",
        eventsPerYear:20,revenuePerEvent:45000,daysPerEvent:7,coverageHours:24,
        bvlosIntRate:65,bvlos1099Rate:68.46,
        travel:{airfare:350,numTravelers:1,lodgingNights:7,lodgingRate:150,perDiemDays:7,rental:0,gas:0,eventWeeks:1},open:true}),
      newEventType({id:2,name:"Fill-In Events",color:"#4a9eff",configType:"vlos",
        eventsPerYear:8,revenuePerEvent:25000,daysPerEvent:4,coverageHours:12,
        vlos1099Rate:68.46,vlosPilots:3,
        travel:{airfare:350,numTravelers:3,lodgingNights:4,lodgingRate:120,perDiemDays:4,rental:400,gas:80,eventWeeks:1},open:false}),
    ],
    notes:'',
  });
  rerender();
}

loadState();
rerender();
</script>
</body>
