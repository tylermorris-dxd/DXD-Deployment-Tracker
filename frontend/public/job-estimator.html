  lbl.textContent=used+' / '+seasonWeeks+' wks · '+idle+' idle';
  wrap.append(lbl);
  return wrap;
}

// ── MRR (sustained / monthly recurring) engine ─────────────────

function calcMrrClient(client) {
  const months      = client.contractMonths || 24;
  const amortMonths = client.hwAmortMonths  || months;
  const packagesOnSite = client.packagesOnSite || 1;

  const resolvedPkgObj = (client.hwPackageId && MRR.hwPackages)
    ? (MRR.hwPackages.find(p=>p.id===client.hwPackageId)||null)
    : null;
  const baseHwItems = resolvedPkgObj ? resolvedPkgObj.hwItems : (client.hwItems||[]);
  const resolvedHwItems = (client.pkgOverrideItems !== null && client.pkgOverrideItems !== undefined)
    ? client.pkgOverrideItems
    : baseHwItems;
  const isSflPkg = resolvedPkgObj ? (resolvedPkgObj.vendor==='sunflower') : false;

  const hwAcquisition = client.hwAcquisition || 'amortized';
  let hwCapex=0, hwMonthCost=0, hwMonthBill=0;
  let hwOneTimeSalePrice=0;
  resolvedHwItems.forEach(it=>{
    const tc = it.unitCost * it.qty * packagesOnSite;
    const tb = tc * (1 + (it.margin||30)/100);
    if(hwAcquisition==='client-purchase'){
      if(it.annual){
        const mc = tc/12, mb = tb/12;
        hwMonthCost+= mc; hwMonthBill+= mb;
      } else {
        hwOneTimeSalePrice += tb;
        hwCapex += tc;
      }
    } else {
      const mc = it.annual ? tc/12 : (amortMonths>0 ? tc/amortMonths : 0);
      const mb = it.annual ? tb/12 : (amortMonths>0 ? tb/amortMonths : 0);
      hwCapex    += tc;
      hwMonthCost+= mc;
      hwMonthBill+= mb;
    }
  });

  // ADS-B
  let adsbMonthCost=0, adsbMonthBill=0, adsbCapex=0;
  if(client.adsbEnabled && (client.adsbItems||[]).length>0){
    (client.adsbItems).forEach(it=>{
      const tc = it.unitCost * it.qty;
      const tb = tc * (1 + (it.margin||30)/100);
      const mc = it.annual ? tc/12 : (amortMonths>0 ? tc/amortMonths : 0);
      const mb = it.annual ? tb/12 : (amortMonths>0 ? tb/amortMonths : 0);
      adsbCapex+=tc; adsbMonthCost+=mc; adsbMonthBill+=mb;
    });
  }
  // Drone Tag (site-level)
  let droneTagMonthCost=0, droneTagMonthBill=0, droneTagCapex=0;
  if(client.droneTagEnabled && (client.droneTagItems||[]).length>0){
    (client.droneTagItems).forEach(it=>{
      const tc = it.unitCost * it.qty;
      const tb = tc * (1 + (it.margin||30)/100);
      const mc = it.annual ? tc/12 : (amortMonths>0 ? tc/amortMonths : 0);
      const mb = it.annual ? tb/12 : (amortMonths>0 ? tb/amortMonths : 0);
      droneTagCapex+=tc; droneTagMonthCost+=mc; droneTagMonthBill+=mb;
    });
  }
  // Networking (site-level)
  let networkingMonthCost=0, networkingMonthBill=0, networkingCapex=0;
  if(client.networkingEnabled && (client.networkingItems||[]).length>0){
    (client.networkingItems).forEach(it=>{
      const tc = it.unitCost * it.qty;
      const tb = tc * (1 + (it.margin||30)/100);
      const mc = it.annual ? tc/12 : (amortMonths>0 ? tc/amortMonths : 0);
      const mb = it.annual ? tb/12 : (amortMonths>0 ? tb/amortMonths : 0);
      networkingCapex+=tc; networkingMonthCost+=mc; networkingMonthBill+=mb;
    });
  }

  // Software
  const activeDrones = client.activeDrones || 1;
  let swMonthCost=0, swMonthBill=0;
  (client.swItems||[]).forEach(it=>{
    const eq = it.perDrone ? it.qty*activeDrones : it.qty;
    const tc = it.unitCost * eq;
    const tb = tc * (1 + (it.margin||30)/100);
    swMonthCost += tc; swMonthBill += tb;
  });

  // Piloting
  const coverageHrsDay = client.coverageHrsDay || 8;
  const daysPerMonth   = client.daysPerMonth   || 30;
  const pilotsFlying   = client.pilotsFlying   || 1;
  const sflMode        = isSflPkg ? (client.sflPilotMode||'dxd') : 'dxd';
  const pilotMode      = !isSflPkg ? (client.pilotMode||'dxd') : 'dxd';

  let pilotCost=0, pilotBill=0, sflPilotCost=0, sflPilotBill=0;
  let dxdHrsDay=coverageHrsDay, sflHrsDay=0;

  if(!isSflPkg){
    if(pilotMode==='client'){
      dxdHrsDay=0; pilotCost=0; pilotBill=0;
    } else if(pilotMode==='surge'){
      dxdHrsDay = 0;
      const surgeHrs = client.surgeEstHrsMonth || 0;
      pilotCost = (client.pilotCostRate||52.67) * surgeHrs;
      pilotBill = (client.surgeHourlyRate||150) * surgeHrs;
    } else if(pilotMode==='shared'){
      dxdHrsDay = 0;
      const sharedClients  = Math.max(1, client.sharedRouteClients || 4);
      const sharedShiftHrs = client.sharedShiftHrs || 8;
      const sharedDays     = client.sharedDaysPerMonth || daysPerMonth;
      const totalRouteHrsMo = sharedShiftHrs * sharedDays;
      pilotCost = (client.pilotCostRate||52.67) * totalRouteHrsMo / sharedClients;
      pilotBill = (client.pilotBillRate||68.46) * totalRouteHrsMo / sharedClients;
    } else {
      dxdHrsDay = coverageHrsDay;
      const hrs = dxdHrsDay * daysPerMonth * pilotsFlying;
      pilotCost = (client.pilotCostRate||52.67) * hrs;
      pilotBill = (client.pilotBillRate||68.46) * hrs;
    }
  } else if(sflMode==='dxd'){
    dxdHrsDay = coverageHrsDay;
    const hrs = dxdHrsDay * daysPerMonth * pilotsFlying;
    pilotCost = (client.pilotCostRate||52.67) * hrs;
    pilotBill = (client.pilotBillRate||68.46) * hrs;
  } else if(sflMode==='sfl'){
    dxdHrsDay = 0;
    sflHrsDay = coverageHrsDay;
    if(sflHrsDay > 0) {
      const tier = SFL_PILOT_TIERS.reduce((best,t)=>Math.abs(t.hrsPerDay-sflHrsDay)<Math.abs(best.hrsPerDay-sflHrsDay)?t:best, SFL_PILOT_TIERS[0]);
      sflPilotCost = tier.monthlyCost;
      sflPilotBill = tier.monthlyCost * (1 + (client.sflPilotMarkup||30)/100);
      if(client.sflSetupFeeIncluded!==false && months>0) sflPilotCost += SFL_PILOT_SETUP_FEE/months;
    }
  } else {
    dxdHrsDay  = Math.min(client.sflDxdHrsDay||0, coverageHrsDay);
    sflHrsDay  = Math.max(0, coverageHrsDay - dxdHrsDay);
    const dxdHrs = dxdHrsDay * daysPerMonth * pilotsFlying;
    pilotCost = (client.pilotCostRate||52.67) * dxdHrs;
    pilotBill = (client.pilotBillRate||68.46) * dxdHrs;
    if(sflHrsDay>0){
      const tier = SFL_PILOT_TIERS.reduce((best,t)=>Math.abs(t.hrsPerDay-sflHrsDay)<Math.abs(best.hrsPerDay-sflHrsDay)?t:best, SFL_PILOT_TIERS[0]);
      sflPilotCost = tier.monthlyCost;
      sflPilotBill = tier.monthlyCost * (1 + (client.sflPilotMarkup||30)/100);
      if(client.sflSetupFeeIncluded!==false && months>0) sflPilotCost += SFL_PILOT_SETUP_FEE/months;
    }
  }

  const remoteOpsCost  = (client.remoteOpsCostRate||52.67) * (client.remoteOpsHrsMonth||0);

  // Waiver
  const waiverMode = client.waiverMode || 'none';
  let waiverMonthCost=0, waiverMonthBill=0;
  let waiverOneTimeCost=0, waiverOneTimeBill=0;
  if(waiverMode==='dxd-writes'){
    const draftFee = client.waiverDraftFee || 0;
    const mgmtFee  = client.waiverMgmtFeeMonth || 0;
    if(client.waiverDraftAmortized!==false){
      const draftPerMonth = months>0 ? draftFee/months : 0;
      waiverMonthCost += draftPerMonth;
      waiverMonthBill += draftPerMonth;
    } else {
      waiverOneTimeCost += draftFee;
      waiverOneTimeBill += draftFee;
    }
    waiverMonthCost += mgmtFee;
    waiverMonthBill += mgmtFee;
  } else if(waiverMode==='under-dxd'){
    const trainFee = (client.waiverTrainingFeePerPilot||0) * (client.waiverTrainingPilots||1);
    if(client.waiverTrainingAmortized!==false){
      const trainPerMonth = months>0 ? trainFee/months : 0;
      waiverMonthCost += trainPerMonth;
      waiverMonthBill += trainPerMonth;
    } else {
      waiverOneTimeCost += trainFee;
      waiverOneTimeBill += trainFee;
    }
  }

  const laborCostMonth = pilotCost + sflPilotCost + remoteOpsCost;
  const laborBillMonth = pilotBill + sflPilotBill;

  function tripCost(t) {
    if(!t) return 0;
    const flights = (t.numFlights!==undefined?t.numFlights:(t.numTravelers||1));
    return (t.airfare||0)*flights
      + (t.lodgingNights||0)*(t.lodgingRate||150)*(t.numTravelers||1)
      + (t.perDiemRate||75)*(t.perDiemDays||0)*(t.numTravelers||1)
      + (t.rental||0) + (t.gas||0);
  }
  const installOneTime  = tripCost(client.installTrip);
  const installPerMonth = months>0 ? installOneTime/months : 0;
  const visitCostEach   = tripCost(client.visitTrip);
  const visitCostMonth  = visitCostEach * (client.monthlyVisits||0);

  const totalCostMonth = laborCostMonth + hwMonthCost + adsbMonthCost + droneTagMonthCost + networkingMonthCost + swMonthCost + installPerMonth + visitCostMonth + waiverMonthCost;
  const totalBillMonth = laborBillMonth + hwMonthBill + adsbMonthBill + droneTagMonthBill + networkingMonthBill + swMonthBill + installPerMonth + visitCostMonth + waiverMonthBill;
  const revenue        = client.monthlyFee || 0;
  const profitMonth    = revenue - totalCostMonth;
  const marginMonth    = revenue > 0 ? profitMonth / revenue : 0;
  const billMargin     = revenue > 0 ? (revenue - totalBillMonth) / revenue : 0;
  const totalOneTime   = (hwAcquisition==='amortized' ? hwCapex : 0) + adsbCapex + droneTagCapex + networkingCapex + installOneTime + waiverOneTimeCost;
  const beMonths       = profitMonth > 0 ? Math.ceil(totalOneTime / profitMonth) : null;

  return {
    hwCapex, hwMonthCost, hwMonthBill,
    hwAcquisition, hwOneTimeSalePrice,
    adsbCapex, adsbMonthCost, adsbMonthBill,
    droneTagCapex, droneTagMonthCost, droneTagMonthBill,
    networkingCapex, networkingMonthCost, networkingMonthBill,
    swMonthCost, swMonthBill,
    laborCostMonth, laborBillMonth,
    pilotCost, pilotBill, sflPilotCost, sflPilotBill,
    remoteOpsCost, sflMode, isSflPkg, pilotMode,
    dxdHrsDay, sflHrsDay,
    pilotHrsMonth: dxdHrsDay*daysPerMonth*pilotsFlying,
    coverageHrsDay, daysPerMonth, pilotsFlying, activeDrones,
    installOneTime, installPerMonth, visitCostMonth,
    waiverMonthCost, waiverMonthBill, waiverOneTimeCost, waiverOneTimeBill,
    totalCostMonth, totalBillMonth,
    revenue, profitMonth, marginMonth, billMargin,
    totalOneTime, beMonths,
    contractMonths: months, amortMonths, packagesOnSite,
  };
}

function deriveMrrPortfolio() {
  const calcs = MRR.clients.map(c=>({client:c, calc:calcMrrClient(c)}));
  function grpStats(filter){
    const g=calcs.filter(filter);
    const rev=g.reduce((s,x)=>s+x.calc.revenue,0);
    const cost=g.reduce((s,x)=>s+x.calc.totalCostMonth,0);
    const profit=rev-cost;
    return {count:g.length, rev, cost, profit, margin:rev>0?profit/rev:0, capex:g.reduce((s,x)=>s+x.calc.hwCapex,0)};
  }
  const active    = grpStats(x=>(x.client.status||'active')==='active');
  const potential = grpStats(x=>(x.client.status||'active')==='potential');
  const template  = grpStats(x=>(x.client.status||'active')==='template');
  const totalMRR    = active.rev;
  const totalCost   = active.cost;
  const totalProfit = active.profit;
  const blendMargin = active.margin;
  const totalCapex  = active.capex;
  return {calcs, active, potential, template, totalMRR, totalCost, totalProfit, blendMargin, totalCapex};
}

function makeMrrTripRow(label, tripObj, onUpdate, opts={}) {
  const wrap=div('');wrap.style.cssText='margin-bottom:2px;';
  const hdr=div('');hdr.style.cssText='font-size:10px;font-weight:700;color:var(--t2);letter-spacing:1px;text-transform:uppercase;margin:8px 0 4px;';
  hdr.textContent=label;wrap.append(hdr);
  if(opts.note){const n=div('');n.style.cssText='font-size:9px;color:var(--t3);margin-bottom:4px;';n.textContent=opts.note;wrap.append(n);}
  const fields=[
    ['# Travelers','numTravelers','#'],['# Flights','numFlights','#'],
    ['Airfare/ticket','airfare','$'],['Lodging nights','lodgingNights','#'],
    ['Lodging rate/night','lodgingRate','$'],['Per diem days','perDiemDays','#'],
    ['Per diem rate/day','perDiemRate','$'],['Rental','rental','$'],['Gas','gas','$'],
  ];
  fields.forEach(([lbl,key,pfx])=>{
    wrap.append(makeRow(lbl, tripObj[key], v=>{tripObj[key]=v;onUpdate();}, {prefix:pfx}));
  });
  return wrap;
}

function makeMrrClientCard(client, clientIdx) {
  const calc = calcMrrClient(client);
  if(client.status===undefined) client.status='active';
  const card=div('');
  card.style.cssText='background:var(--bg2);border:0.5px solid var(--border);border-top:3px solid '+client.color+';border-radius:6px;margin-bottom:12px;overflow:hidden;opacity:'+(client.status==='template'?'0.75':'1')+';';

  const cardHdr=div('');cardHdr.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none;';
  const dot=div('');dot.style.cssText='width:10px;height:10px;border-radius:50%;background:'+client.color+';flex-shrink:0;';
  const nameInp=el('input',{type:'text',value:client.name});
  nameInp.style.cssText="background:none;border:none;color:var(--t1);font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;flex:1;cursor:text;";
  nameInp.addEventListener('click',e=>e.stopPropagation());
  nameInp.addEventListener('change',e=>{client.name=e.target.value;rerender();});

  const statusColors={active:'#4ec94e',potential:'#4a9eff',template:'#a78bfa'};
  const statusLabels={active:'ACTIVE',potential:'POTENTIAL',template:'TEMPLATE'};
  const statusBtn=el('button',{class:'cfg-btn'});
  const sc=statusColors[client.status||'active'];
  statusBtn.textContent=statusLabels[client.status||'active'];
  statusBtn.style.cssText='font-size:9px;padding:2px 8px;border-color:'+sc+';color:'+sc+';white-space:nowrap;';
  statusBtn.title='Click to cycle: Active → Potential → Template';
  statusBtn.addEventListener('click',e=>{
    e.stopPropagation();
    const cycle={active:'potential',potential:'template',template:'active'};
    client.status=cycle[client.status||'active'];rerender();
  });

  const badge=div('');
  const mPct=(calc.marginMonth*100).toFixed(1);
  const mColor=calc.marginMonth<0?'#e24b4a':calc.marginMonth<(MRR.marginFloor/100)?'#f5c45b':'#4ec94e';
  badge.style.cssText='font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,0.3);color:'+mColor+';border:0.5px solid '+mColor+';font-weight:700;white-space:nowrap;';
  badge.textContent=fmt(calc.revenue)+'/mo · '+mPct+'% margin';
  const toggleBtn=el('button',{class:'cfg-btn'+(client.open?' active':'')});toggleBtn.textContent=client.open?'COLLAPSE':'EXPAND';
  toggleBtn.style.cssText='font-size:10px;padding:2px 10px;';

  const dupBtn=el('button',{class:'cfg-btn'});dupBtn.textContent='COPY';dupBtn.style.cssText='font-size:10px;padding:2px 10px;color:#a78bfa;border-color:#a78bfa;';
  dupBtn.addEventListener('click',e=>{
    e.stopPropagation();
    const copy=JSON.parse(JSON.stringify(client));
    copy.id=++_mrrId;
    copy.name=client.name+' (Copy)';
    copy.color='#a78bfa';
    copy.open=true;
    const idx=MRR.clients.findIndex(c=>c.id===client.id);
    MRR.clients.splice(idx+1,0,copy);
    rerender();
  });
  const delBtn=el('button',{class:'cfg-btn'});delBtn.textContent='X';delBtn.style.cssText='font-size:10px;padding:2px 8px;color:var(--red2);';
  delBtn.addEventListener('click',e=>{e.stopPropagation();if(MRR.clients.length>1&&confirm('Remove '+client.name+'?')){MRR.clients=MRR.clients.filter(c=>c.id!==client.id);rerender();}});
  cardHdr.addEventListener('click',()=>{client.open=!client.open;rerender();});
  cardHdr.append(dot,nameInp,statusBtn,badge,toggleBtn,dupBtn,delBtn);
  card.append(cardHdr);

  if(!client.open) return card;

  const body=div('');body.style.cssText='overflow-x:auto;';
  const inner=div('');inner.style.cssText='display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:0;min-width:780px;';

  // Column A — Contract / Coverage / Piloting / Ops / ADS-B / Drone Tag / Networking / Waiver
  const colA=div('');colA.style.cssText='padding:14px;border-right:0.5px solid var(--border);';
  const colAhdr=div('');colAhdr.style.cssText='font-size:10px;font-weight:700;color:var(--t2);letter-spacing:1px;margin-bottom:10px;text-transform:uppercase;';
  colAhdr.textContent='Contract & Coverage';colA.append(colAhdr);

  if(client.hwAmortMonths===undefined) client.hwAmortMonths=client.contractMonths||24;
  colA.append(
    makeRow("Monthly Fee ($)",          client.monthlyFee,     v=>{client.monthlyFee=v;rerender();}),
    makeRow("Contract Length (months)", client.contractMonths, v=>{client.contractMonths=Math.max(1,Math.round(v));rerender();},{prefix:'#'}),
    makeRow("HW Amort Window (months)", client.hwAmortMonths,  v=>{client.hwAmortMonths=Math.max(1,Math.round(v));rerender();},{prefix:'#',note:"Extend to model renewals"}),
  );

  const pkgCountHdr=div('');pkgCountHdr.style.cssText='font-size:10px;font-weight:700;color:var(--t2);letter-spacing:1px;margin:12px 0 4px;text-transform:uppercase;';pkgCountHdr.textContent='Deployment';colA.append(pkgCountHdr);
  if(client.packagesOnSite===undefined) client.packagesOnSite=1;
  if(client.activeDrones===undefined)   client.activeDrones=1;
  colA.append(
    makeRow("Packages on Site",  client.packagesOnSite, v=>{client.packagesOnSite=Math.max(1,Math.round(v));rerender();},{prefix:'#'}),
    makeRow("# Active Coverage", client.activeDrones,   v=>{client.activeDrones=Math.max(1,Math.round(v));rerender();},{prefix:'#'}),
  );

  const covHdr=div('');covHdr.style.cssText='font-size:10px;font-weight:700;color:var(--t2);letter-spacing:1px;margin:12px 0 4px;text-transform:uppercase;';covHdr.textContent='Coverage Schedule';colA.append(covHdr);
  if(client.coverageHrsDay===undefined) client.coverageHrsDay=8;
  if(client.daysPerMonth===undefined)   client.daysPerMonth=30;
  const covHrsWrap=div('');covHrsWrap.style.cssText='display:flex;align-items:center;gap:8px;padding:3px 0;';
  const covLbl=div('mini-lbl');covLbl.textContent='Coverage hrs/day';
  const covSel=el('select',{class:'itbl-sel'});covSel.style.cssText='width:auto;font-size:11px;padding:3px 6px;';
  [4,5,6,8,10,12,16,20,24].forEach(h=>{const o=el('option',{value:h});o.textContent=h+' hrs';if(client.coverageHrsDay===h)o.selected=true;covSel.append(o);});
  covSel.value=String(client.coverageHrsDay||8);
  covSel.addEventListener('change',e=>{client.coverageHrsDay=+e.target.value;rerender();});
  covHrsWrap.append(covLbl,covSel);colA.append(covHrsWrap);
  colA.append(makeRow("Days/month",client.daysPerMonth,v=>{client.daysPerMonth=Math.max(1,Math.min(31,Math.round(v)));rerender();},{prefix:'#'}));

  // Piloting — simplified to dxd-only here for stability; advanced modes are state-preserved
  const pilotHdr=div('');pilotHdr.style.cssText='font-size:10px;font-weight:700;color:var(--t2);letter-spacing:1px;margin:12px 0 4px;text-transform:uppercase;';pilotHdr.textContent='Piloting';colA.append(pilotHdr);
  if(client.pilotsFlying===undefined)  client.pilotsFlying=1;
  if(client.pilotCostRate===undefined) client.pilotCostRate=52.67;
  if(client.pilotBillRate===undefined) client.pilotBillRate=68.46;
  colA.append(
    makeRow("# Pilots Flying",        client.pilotsFlying,  v=>{client.pilotsFlying=Math.max(1,Math.round(v));rerender();},{prefix:'#'}),
    makeRow("Pilot Cost Rate ($/hr)", client.pilotCostRate, v=>{client.pilotCostRate=v;rerender();}, {note:"Your cost"}),
    makeRow("Pilot Bill Rate ($/hr)", client.pilotBillRate, v=>{client.pilotBillRate=v;rerender();}, {note:"Client rate"}),
  );
  const pilotHrsMonth=(calc.dxdHrsDay||0)*(client.daysPerMonth||30)*(client.pilotsFlying||1);
  const pilotMgn=calc.pilotBill>0?(calc.pilotBill-calc.pilotCost)/calc.pilotBill:0;
  const lStats=div('mini-stats');
  lStats.append(miniRow("Pilot hrs/mo",pilotHrsMonth+''),miniRow("Pilot cost/mo",fmt(calc.pilotCost)),miniRow("Pilot bill/mo",fmt(calc.pilotBill),'#4ec94e'),miniRow("Pilot margin",(pilotMgn*100).toFixed(1)+'%',pilotMgn>0?'#4ec94e':'#e24b4a'));
  colA.append(lStats);

  // Remote ops
  const opsHdr=div('');opsHdr.style.cssText='font-size:10px;font-weight:700;color:var(--t2);letter-spacing:1px;margin:12px 0 2px;text-transform:uppercase;';opsHdr.textContent='Remote Ops / Acct Mgmt';colA.append(opsHdr);
  if(client.remoteOpsHrsMonth===undefined) client.remoteOpsHrsMonth=10;
  if(client.remoteOpsCostRate===undefined) client.remoteOpsCostRate=52.67;
  colA.append(makeRow("Ops Hrs/Month",client.remoteOpsHrsMonth,v=>{client.remoteOpsHrsMonth=Math.max(0,v);rerender();},{prefix:'#'}),makeRow("Ops Cost Rate ($/hr)",client.remoteOpsCostRate,v=>{client.remoteOpsCostRate=v;rerender();}));
  if(calc.remoteOpsCost>0){const opsStats=div('mini-stats');opsStats.append(miniRow("Ops cost/mo",fmt(calc.remoteOpsCost),'#f5c45b'));colA.append(opsStats);}

  // Column B — Hardware Package + Software
  const colB=div('');colB.style.cssText='padding:14px;border-right:0.5px solid var(--border);';
  const colBhdr=div('');colBhdr.style.cssText='font-size:10px;font-weight:700;color:var(--t2);letter-spacing:1px;margin-bottom:6px;text-transform:uppercase;';
  colBhdr.textContent='Sustained HW Package';colB.append(colBhdr);

  const pkgSelWrap=div('');pkgSelWrap.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:10px;';
  const pkgSelLbl=div('');pkgSelLbl.style.cssText='font-size:11px;color:var(--t2);white-space:nowrap;';pkgSelLbl.textContent='Package:';
  const pkgSel=el('select',{class:'itbl-sel'});pkgSel.style.cssText='flex:1;font-size:11px;padding:4px 6px;';
  const noneOpt=el('option',{value:''});noneOpt.textContent='— Custom (inline items) —';pkgSel.append(noneOpt);
  (MRR.hwPackages||[]).forEach(pkg=>{
    const vendorLabel={dji:'DJI',skydio:'Skydio',sunflower:'Sunflower'}[pkg.vendor||'dji']||'';
    const o=el('option',{value:String(pkg.id)});
    o.textContent=(vendorLabel?'['+vendorLabel+'] ':'')+pkg.name;
    if(client.hwPackageId===pkg.id) o.selected=true;
    pkgSel.append(o);
  });
  pkgSel.value = client.hwPackageId ? String(client.hwPackageId) : '';
  pkgSel.addEventListener('change',e=>{
    client.hwPackageId = e.target.value ? Number(e.target.value) : null;
    rerender();
  });
  pkgSelWrap.append(pkgSelLbl,pkgSel);colB.append(pkgSelWrap);

  const resolvedPkg = client.hwPackageId ? (MRR.hwPackages||[]).find(p=>p.id===client.hwPackageId) : null;
  if(resolvedPkg) {
    const amortMo = client.hwAmortMonths || client.contractMonths;
    const pkgSumBox=div('hw-kit-box');
    const pkgBaseCapex=(resolvedPkg.hwItems||[]).reduce((s,i)=>s+i.unitCost*i.qty,0);
    const pos = client.packagesOnSite || 1;
    const pkgCapex=pkgBaseCapex*pos;
    [['One-Time CapEx',     fmt(pkgCapex),                '#f5c45b'],
     ['Items in Package',   (resolvedPkg.hwItems||[]).length+'', undefined],
     ['Amort Window',       amortMo+' mo', 'var(--t2)'],
     ['HW Cost/Month',      fmt(pkgCapex/amortMo),        'var(--t2)'],
    ].forEach(([l,v,c])=>{
      const r=div('hw-kit-row');const lb=div('hw-kit-lbl');lb.textContent=l;const vl=div('hw-kit-val');vl.textContent=v;if(c)vl.style.color=c;r.append(lb,vl);pkgSumBox.append(r);
    });
    colB.append(pkgSumBox);
  } else {
    const amortMo = client.hwAmortMonths || client.contractMonths;
    const hwWrap=div('');hwWrap.style.cssText='overflow-x:auto;';
    const hwInner=div('');hwInner.style.cssText='min-width:480px;';
    hwInner.append(makeItemTable(
      ()=>client.hwItems,
      items=>{client.hwItems=items;},
      ()=>client.activeDrones||1,
      false,
      ()=>S.amortWeeks, ()=>7, ()=>false,
      ()=>amortMo
    ));
    hwWrap.append(hwInner);colB.append(hwWrap);
  }

  const hwStats=div('mini-stats');
  hwStats.append(
    miniRow("HW CapEx (total)", fmt(calc.hwCapex), '#f5c45b'),
    miniRow("HW cost/mo (amort)", fmt(calc.hwMonthCost)),
    miniRow("HW bill/mo", fmt(calc.hwMonthBill), '#4ec94e'),
  );
  colB.append(hwStats);

  const swHdr=div('');swHdr.style.cssText='font-size:10px;font-weight:700;color:var(--t2);letter-spacing:1px;margin:10px 0 6px;text-transform:uppercase;';swHdr.textContent='Software (Monthly)';colB.append(swHdr);
  const swWrap=div('');swWrap.style.cssText='overflow-x:auto;';
  const swInner=div('');swInner.style.cssText='min-width:480px;';
  swInner.append(makeItemTable(
    ()=>client.swItems,
    items=>{client.swItems=items;},
    ()=>client.activeDrones||1,
    true,
    ()=>S.amortWeeks, ()=>7, ()=>false,
    ()=>client.contractMonths
  ));
  swWrap.append(swInner);colB.append(swWrap);

  // Column C — Travel & Cost Breakdown
  const colC=div('');colC.style.cssText='padding:14px;';
  const colChdr=div('');colChdr.style.cssText='font-size:10px;font-weight:700;color:var(--t2);letter-spacing:1px;margin-bottom:10px;text-transform:uppercase;';
  colChdr.textContent='Travel & Cost Breakdown';colC.append(colChdr);

  colC.append(makeRow("Site Visits / Month", client.monthlyVisits, v=>{client.monthlyVisits=Math.max(0,Math.round(v));rerender();}, {prefix:'#'}));

  if(!client.installTrip) client.installTrip={numTravelers:2,numFlights:2,airfare:350,lodgingNights:3,lodgingRate:150,perDiemDays:3,perDiemRate:75,rental:300,gas:60};
  colC.append(makeMrrTripRow("Install Trip (one-time)", client.installTrip, rerender, {note:"Amortized — "+fmt(calc.installPerMonth)+"/mo"}));

  if(!client.visitTrip) client.visitTrip={numTravelers:1,numFlights:1,airfare:350,lodgingNights:1,lodgingRate:150,perDiemDays:1,perDiemRate:75,rental:0,gas:0};
  colC.append(makeMrrTripRow("Per Visit Trip Cost", client.visitTrip, rerender, {note:client.monthlyVisits+" visit(s)/mo = "+fmt(calc.visitCostMonth)+"/mo"}));

  const cbHdr=div('');cbHdr.style.cssText='font-size:10px;font-weight:700;color:var(--t2);letter-spacing:1px;margin:14px 0 6px;text-transform:uppercase;';cbHdr.textContent='Monthly Cost Breakdown';colC.append(cbHdr);

  const cbColHdr=div('');cbColHdr.style.cssText='display:grid;grid-template-columns:1fr auto auto;gap:2px 8px;font-size:9px;color:var(--t3);letter-spacing:0.5px;margin-bottom:4px;';
  ['','Cost/Mo','Bill/Mo'].forEach((h,i)=>{const d=div('');d.textContent=h;if(i>0)d.style.textAlign='right';cbColHdr.append(d);});
  colC.append(cbColHdr);

  const cbGrid=div('');cbGrid.style.cssText='display:grid;grid-template-columns:1fr auto auto;gap:2px 8px;font-size:11px;align-items:baseline;';
  const rows=[
    ['Pilot labor',          fmt(calc.pilotCost),       fmt(calc.pilotBill)],
    ['Remote ops (cost)',    fmt(calc.remoteOpsCost),   '— cost only'],
    ['HW (amort/mo)',        fmt(calc.hwMonthCost),     fmt(calc.hwMonthBill)],
    ['Software',             fmt(calc.swMonthCost),     fmt(calc.swMonthBill)],
    ['Install (amort)',      fmt(calc.installPerMonth), fmt(calc.installPerMonth)],
    ['Site Visits',          fmt(calc.visitCostMonth),  fmt(calc.visitCostMonth)],
    ['Total Cost/Mo',        fmt(calc.totalCostMonth),  fmt(calc.totalBillMonth)],
    ['Monthly Fee',          fmt(calc.revenue),         fmt(calc.revenue)],
    ['Monthly Profit',       fmt(calc.profitMonth),     ''],
    ['Margin',               pct(calc.marginMonth),     pct(calc.billMargin)],
  ];
  rows.forEach(([l,cv,bv])=>{
    const bold=['Total Cost/Mo','Monthly Profit','Margin'].includes(l);
    const lEl=div('');lEl.textContent=l;if(bold)lEl.style.fontWeight='600';
    const cEl=div('');cEl.textContent=cv;cEl.style.textAlign='right';if(bold)cEl.style.fontWeight='600';
    const bEl=div('');bEl.textContent=bv;bEl.style.textAlign='right';
    if(l==='Monthly Profit'){cEl.style.color=calc.profitMonth<0?'#e24b4a':'#4ec94e';}
    else if(l==='Margin'){const c=calc.marginMonth<0?'#e24b4a':calc.marginMonth<MRR.marginFloor/100?'#f5c45b':'#4ec94e';cEl.style.color=c;bEl.style.color=c;}
    else if(l==='Remote ops (cost)'){cEl.style.color='#f5c45b';}
    cbGrid.append(lEl,cEl,bEl);
  });
  colC.append(cbGrid);

  inner.append(colA,colB,colC);
  body.append(inner);
  card.append(body);
  return card;
}

function renderMrrTab(root) {
  const p = deriveMrrPortfolio();

  const controls=div('controls');
  const floorGrp=div('ctrl-grp');
  const floorLbl=div('ctrl-label');floorLbl.textContent='MRR MARGIN FLOOR:';
  const floorInp=el('input',{type:'number',class:'row-inp',value:MRR.marginFloor,style:'width:45px'});
  floorInp.addEventListener('blur',e=>{MRR.marginFloor=Math.max(0,Math.min(100,+e.target.value));rerender();});
  const floorSfx=el('span',{class:'ctrl-label'});floorSfx.textContent='%';
  floorGrp.append(floorLbl,floorInp,floorSfx);controls.append(floorGrp);
  root.append(controls);

  // Top-line stats
  const statRow=div('stat-row');
  [
    ['Total MRR',         fmt(p.totalMRR),    undefined,                       p.active.count+' active client'+(p.active.count!==1?'s':'')],
    ['Total Monthly Cost',fmt(p.totalCost),   undefined,                       'all clients combined'],
    ['Monthly Profit',    fmt(p.totalProfit), p.totalProfit<0?'#e24b4a':'#4ec94e', pct(p.blendMargin)+' blended margin'],
    ['Annual Run Rate',   fmt(p.totalMRR*12), undefined,                       fmt(p.totalProfit*12)+' annual profit'],
    ['Total HW CapEx',    fmt(p.totalCapex),  '#f5c45b',                       'sustained kits combined'],
  ].forEach(([l,v,c,s])=>statRow.append(makeStatCard(l,v,c,s)));
  root.append(statRow);

  // Margin health
  const floor = MRR.marginFloor/100;
  const belowFloor=p.calcs.filter(x=>x.calc.marginMonth<floor);
  if(belowFloor.length>0){
    const mhBody=div('');
    const grid=div('');grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;';
    belowFloor.forEach(({client,calc})=>{
      const isCrit=calc.marginMonth<0;
      const cd=div('');cd.style.cssText='padding:10px 14px;border-radius:6px;background:'+(isCrit?'#1f0d0d':'#1a1400')+';border:0.5px solid '+(isCrit?'var(--red2)':'var(--yellow)')+';';
      const ch=div('');ch.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:6px;';
      const d=div('');d.style.cssText='width:8px;height:8px;border-radius:50%;background:'+client.color+';flex-shrink:0;';
      const n=div('');n.style.cssText="font-size:12px;font-weight:600;font-family:'Barlow Condensed',sans-serif;";n.textContent=client.name;
      const b=div('');b.style.cssText='margin-left:auto;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:'+(isCrit?'rgba(226,75,74,0.15)':'rgba(245,196,91,0.12)')+';color:'+(isCrit?'var(--red2)':'var(--yellow)')+';border:0.5px solid '+(isCrit?'var(--red2)':'var(--yellow)')+';';
      b.textContent=isCrit?'NEGATIVE':'BELOW FLOOR';ch.append(d,n,b);cd.append(ch);
      const revenueNeeded=calc.totalCostMonth/(1-floor);
      [['Actual Margin',(calc.marginMonth*100).toFixed(1)+'%',isCrit?'var(--red2)':'var(--yellow)'],
       ['Floor Target',MRR.marginFloor+'%','var(--t2)'],
       ['Cost/Month',fmt(calc.totalCostMonth),'var(--t2)'],
       ['Current Fee',fmt(calc.revenue),'var(--t2)'],
       ['Fee Needed @ Floor',fmt(revenueNeeded),'var(--t1)'],
       ['Add to Monthly Fee',fmt(revenueNeeded-calc.revenue),isCrit?'var(--red2)':'var(--yellow)'],
      ].forEach(([lbl,val,c])=>{const r=div('mini-row');const lb=div('mini-lbl');lb.textContent=lbl;const vl=el('span',{});vl.textContent=val;if(c)vl.style.color=c;r.append(lb,vl);cd.append(r);});
      grid.append(cd);
    });
    mhBody.append(grid);
    root.append(makeSection('MRR MARGIN HEALTH — '+MRR.marginFloor+'% FLOOR — '+belowFloor.length+' CLIENT'+(belowFloor.length>1?'S':'')+' BELOW TARGET', mhBody));
  }

  // Client cards
  const clientsBody=div('');
  p.calcs.forEach(({client},idx)=>clientsBody.append(makeMrrClientCard(client,idx)));
  const addClientBtn=el('button',{class:'add-et-btn'});addClientBtn.textContent='+ ADD MRR CLIENT';
  addClientBtn.addEventListener('click',()=>{
    const colors=['#f97316','#c084fc','#38bdf8','#fb7185','#a3e635','#fbbf24'];
    const used=MRR.clients.map(c=>c.color);
    const color=colors.find(c=>!used.includes(c))||colors[MRR.clients.length%colors.length];
    MRR.clients.push(newMrrClient({color}));rerender();
  });
  root.append(makeSection('MRR CLIENT PROFILES — Click header to expand / collapse', clientsBody, addClientBtn));

  // Notes
  const mrrNotes=MRR.notes||'';
  const ta=el('textarea',{class:'notes-area',placeholder:"MRR client context, pricing notes, contract status..."});
  ta.value=mrrNotes;
  const notesFooter=div('notes-footer');
  const charCount=div('notes-char');charCount.textContent=mrrNotes.length+' chars';
  ta.addEventListener('input',e=>{MRR.notes=e.target.value;charCount.textContent=MRR.notes.length+' chars';});
  const clearBtn=el('button',{class:'notes-clear'});clearBtn.textContent='Clear';
  clearBtn.addEventListener('click',()=>{MRR.notes='';ta.value='';charCount.textContent='0 chars';});
  notesFooter.append(charCount,clearBtn);
  const notesWrap=div('');notesWrap.append(ta,notesFooter);
  root.append(makeSection('NOTES',notesWrap));

  return root;
}

function renderApp() {
  const p=derivePortfolio();
  const root=div('');
  const idleWks=Math.max(0,S.seasonWeeks-p.totalWeeksUsed);

  // Header
  const hdr=div('hdr');
  const hdrL=div('');
  const ht=div('hdr-title');ht.textContent='DXD // JOB ESTIMATOR';
  const hs=div('hdr-sub');
  hs.textContent=(S.skydioRisk?'[!] DJI BAN FLAGGED':'DJI config active')+
    ' · $75 GSA per diem · HW amort '+S.amortWeeks+' wks · '+
    S.eventTypes.length+' event type'+(S.eventTypes.length!==1?'s':'')+
    ' · '+MRR.clients.length+' MRR client'+(MRR.clients.length!==1?'s':'');
  hdrL.append(ht,hs);
  const hdrR=div('hdr-right');
  const saveBtn=el('button',{class:'save-btn'});saveBtn.textContent='SAVE';
  saveBtn.addEventListener('click',()=>{if(saveState()){saveBtn.textContent='SAVED';saveBtn.style.background='rgba(78,201,78,0.15)';setTimeout(()=>{saveBtn.textContent='SAVE';saveBtn.style.background='transparent';},1500);}});
  const resetBtn=el('button',{class:'reset-btn'});resetBtn.textContent='RESET';
  resetBtn.addEventListener('click',resetState);
  const savedInd=div('saved-indicator');savedInd.textContent=localStorage.getItem(STORAGE_KEY)?'Auto-saved':'No saved state';
  hdrR.append(saveBtn,resetBtn,savedInd);
  hdr.append(hdrL,hdrR);root.append(hdr);

  // Tab bar
  const tabBar=div('');tabBar.style.cssText='display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--bg2);padding:0 20px;';
  [['events','EVENTS'],['mrr','MRR CLIENTS']].forEach(([key,label])=>{
    const tab=el('button',{});
    tab.textContent=label;
    const active=S.activeTab===key;
    tab.style.cssText="background:none;border:none;border-bottom:2px solid "+(active?'var(--red2)':'transparent')+
      ";color:"+(active?'var(--t1)':'var(--t3)')+";font-family:'Barlow Condensed',sans-serif;font-size:13px;"+
      "font-weight:700;letter-spacing:1.5px;padding:10px 20px;cursor:pointer;transition:color 0.15s;";
    tab.addEventListener('click',()=>{S.activeTab=key;rerender();});
    tabBar.append(tab);
  });
  root.append(tabBar);

  if(S.activeTab==='mrr') return renderMrrTab(root);

  // ── Events tab ──
  const controls=div('controls');

  const skyGrp=div('ctrl-grp');
  skyGrp.style.cssText=S.skydioRisk?'background:#2a1f00;border:1px solid var(--yellow)':'';
  const skyLbl=div('ctrl-label');skyLbl.style.cssText=S.skydioRisk?'color:var(--yellow);font-weight:700':'';
  skyLbl.textContent='DJI BAN / SKYDIO:';
  const skyBtn=el('button',{class:'sky-toggle'+(S.skydioRisk?' active':'')});
  skyBtn.textContent=S.skydioRisk?'ON — SKYDIO ACTIVE':'OFF';
  skyBtn.addEventListener('click',()=>{S.skydioRisk=!S.skydioRisk;rerender();});
  skyGrp.append(skyLbl,skyBtn);controls.append(skyGrp);

  const amortGrp=div('ctrl-grp');
  const amortLbl=div('ctrl-label');amortLbl.textContent='HW AMORT:';
  const amortInp=el('input',{type:'number',class:'row-inp',value:S.amortWeeks,style:'width:55px'});
  amortInp.addEventListener('blur',e=>{S.amortWeeks=Math.max(1,+e.target.value);rerender();});
  const amortSfx=el('span',{class:'ctrl-label'});amortSfx.textContent='wks';
  amortGrp.append(amortLbl,amortInp,amortSfx);controls.append(amortGrp);

  const seasonGrp=div('ctrl-grp');
  const seasonLbl=div('ctrl-label');seasonLbl.textContent='DXD SEASON:';
  const seasonInp=el('input',{type:'number',class:'row-inp',value:S.seasonWeeks,style:'width:55px'});
  seasonInp.addEventListener('blur',e=>{S.seasonWeeks=Math.max(1,+e.target.value);rerender();});
  const seasonSfx=el('span',{class:'ctrl-label'});seasonSfx.textContent='wks / yr';
  seasonGrp.append(seasonLbl,seasonInp,seasonSfx);controls.append(seasonGrp);

  const floorGrp=div('ctrl-grp');
  const floorLbl=div('ctrl-label');floorLbl.textContent='MARGIN FLOOR:';
  const floorInp=el('input',{type:'number',class:'row-inp',value:S.marginFloor,style:'width:45px'});
  floorInp.addEventListener('blur',e=>{S.marginFloor=Math.max(0,Math.min(100,+e.target.value));rerender();});
  const floorSfx=el('span',{class:'ctrl-label'});floorSfx.textContent='%';
  floorGrp.append(floorLbl,floorInp,floorSfx);controls.append(floorGrp);

  root.append(controls);

  if(S.skydioRisk){
    const banner=div('sky-banner');
    banner.innerHTML='<strong>DJI BAN SCENARIO FLAGGED</strong> — DJI packages are highlighted below. Add a Skydio package and assign it to model the replacement cost.';
    root.append(banner);
  }

  // Top stats
  const statRow=div('stat-row');
  [
    ['Total Annual Revenue',  fmt(p.totalRevenue),         undefined,              p.totalEvents+' events / yr'],
    ['Total Full Cost',       fmt(p.totalFullCost),        undefined,              'labor + HW + SW + travel'],
    ['Full Op Profit',        fmt(p.fullProfit),           p.fullProfit<0?'#e24b4a':'#4ec94e', pct(p.fullMargin)+' margin'],
    ['Net P&L (HW one-time)', fmt(p.netProfitAfterHw),     p.netProfitAfterHw<0?'#e24b4a':'#4ec94e', 'ex-CapEx view'],
    ['VLOS HW CapEx',         p.hasVlosEvents?fmt(p.hwOneTimeVlos):'N/A',  '#f5c45b', p.vlosBeEvents?p.vlosBeEvents+' events to break even':'not in use'],
    ['BVLOS HW CapEx',        p.hasBvlosEvents?fmt(p.hwOneTimeBvlos):'N/A','#f5c45b', p.bvlosBeEvents?p.bvlosBeEvents+' events to break even':'not in use'],
    ['Season Utilization',    (p.utilPct*100).toFixed(1)+'%', p.utilPct<0.5?'#e24b4a':p.utilPct<0.75?'#f5c45b':'#4ec94e', p.totalWeeksUsed.toFixed(1)+' / '+S.seasonWeeks+' wks'],
    ['Idle Weeks',            idleWks.toFixed(1)+' wks',   idleWks>8?'#e24b4a':idleWks>4?'#f5c45b':'#4ec94e', 'unused HW capacity'],
  ].forEach(([l,v,c,s])=>statRow.append(makeStatCard(l,v,c,s)));
  root.append(statRow);

  // Utilization
  const utilBody=div('');
  utilBody.append(makeUtilBar(p.etCalcs, p.totalWeeksUsed, S.seasonWeeks));
  root.append(makeSection('DXD SEASON UTILIZATION — '+S.seasonWeeks+' WK / YR TARGET', utilBody));

  // 5-yr table
  const tableRows=[
    {label:"Events in Period",           fn:d=>d.events+''},
    {label:"Gross Revenue",              fn:d=>fmt(d.rev)},
    {label:"VLOS HW (one-time CapEx)",   fn:()=>p.hasVlosEvents?fmt(p.hwOneTimeVlos):'—'},
    {label:"BVLOS HW (one-time CapEx)",  fn:()=>p.hasBvlosEvents?fmt(p.hwOneTimeBvlos):'—'},
    {label:"Op Costs (labor+SW+travel)", fn:d=>fmt(d.opCst)},
    {label:"Annual HW Recurring",        fn:d=>fmt(d.annHw), color:'#f5c45b'},
    {label:"Total Costs",                fn:d=>fmt(d.cost),   bold:true},
    {label:"Net Profit",                 fn:d=>fmt(d.profit), bold:true, colorFn:d=>d.profit<0?'#e24b4a':'#4ec94e'},
    {label:"Net Margin",                 fn:d=>pct(d.margin), bold:true, colorFn:d=>d.margin<0?'#e24b4a':d.margin<0.15?'#f5c45b':'#4ec94e'},
  ];
  const tbl=el('table',{class:'ptbl'});
  const thead=el('thead',{});const thr=el('tr',{});
  const th0=el('th',{});th0.textContent='Portfolio '+(S.skydioRisk?'(Skydio)':'(DJI)');th0.style.textAlign='left';thr.append(th0);
  p.periods.forEach(pp=>{const th=el('th',{});th.textContent=pp.label;thr.append(th);});
  thead.append(thr);tbl.append(thead);
  const tbody=el('tbody',{});
  tableRows.forEach(row=>{
    const tr=el('tr',{class:row.bold?'bold':row.dim?'dim':''});
    const td0=el('td',{});td0.textContent=row.label;tr.append(td0);
    p.periods.forEach(pp=>{
      const td=el('td',{});td.textContent=row.fn(pp.data);
      if(row.colorFn)td.style.color=row.colorFn(pp.data);
      else if(row.color)td.style.color=row.color;
      tr.append(td);
    });
    tbody.append(tr);
  });
  tbl.append(tbody);
  const tblWrap=div('overflow-x');tblWrap.append(tbl);
  root.append(makeSection('5-YEAR NET ANALYSIS — PORTFOLIO (12 / 24 / 36 / 48 / 60 MONTHS)', tblWrap));

  // Event-type cards
  const etBody=div('portfolio-grid');
  p.etCalcs.forEach(ec=>etBody.append(makeEventTypeCard(ec.et, ec)));
  const addBtn=el('button',{class:'add-et-btn'});addBtn.textContent='+ ADD EVENT TYPE';
  addBtn.addEventListener('click',()=>{
    const usedColors=S.eventTypes.map(e=>e.color);
    const color=ET_COLORS.find(c=>!usedColors.includes(c))||ET_COLORS[S.eventTypes.length%ET_COLORS.length];
    S.eventTypes.push(newEventType({color,open:true}));rerender();
  });
  root.append(makeSection('EVENT TYPE PORTFOLIO — Click header to expand / collapse', etBody, addBtn));

  // Hardware Package Library
  const pkgLibBody = div('portfolio-grid');
  S.hwPackages.forEach(pkg => {
    const capex   = pkg.hwItems.reduce((s,i)=>s+i.unitCost*i.qty, 0);
    const inUse   = S.eventTypes.some(et => {
      const vp = et.vlos||{}; const bp = et.bvlos||{};
      return (vp.packageId===pkg.id || bp.packageId===pkg.id);
    });
    const card = div('et-card');
    card.style.border = inUse ? '1px solid var(--red)' : '0.5px solid var(--border)';
    const pkgHdr = div('et-header');
    pkgHdr.addEventListener('click', e => {
      if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'||e.target.tagName==='SELECT') return;
      pkg.open = !pkg.open; rerender();
    });
    const pkgNameInp = el('input',{type:'text',class:'et-name-inp',value:pkg.name});
    pkgNameInp.addEventListener('blur', e=>{pkg.name=e.target.value;rerender();});
    const pkgBadges = div('et-badges');
    const ktBadge = div('et-badge '+(pkg.kitType==='vlos'?'vlos':'bvlos'));
    ktBadge.textContent = pkg.kitType.toUpperCase();
    const inUseBadge = div('et-badge events');
    inUseBadge.textContent = inUse ? 'In Use' : 'Unassigned';
    if(inUse) inUseBadge.style.color = 'var(--green)';
    pkgBadges.append(ktBadge, inUseBadge);

    const pkgStats = div('et-stats');
    const addPS = (l,v,c) => {const s=div('et-stat'),lb=div('et-stat-lbl'),vl=div('et-stat-val');lb.textContent=l;vl.textContent=v;if(c)vl.style.color=c;s.append(lb,vl);pkgStats.append(s);};
    addPS('CapEx', fmt(capex), '#f5c45b');
    addPS('Items', pkg.hwItems.length);

    const removePkgBtn = el('button',{class:'et-remove'});removePkgBtn.textContent='x';
    removePkgBtn.addEventListener('click',e=>{
      e.stopPropagation();
      if(inUse){alert('This package is assigned to one or more events. Re-assign before deleting.');return;}
      if(S.hwPackages.length<=1){alert('Need at least one package.');return;}
      S.hwPackages=S.hwPackages.filter(p=>p.id!==pkg.id);rerender();
    });

    pkgHdr.append(pkgNameInp, pkgBadges, pkgStats, removePkgBtn);
    card.append(pkgHdr);

    const pkgBody = div('et-body'+(pkg.open?' open':''));
    const pkgHwSub=div('sec-sub');pkgHwSub.textContent='Hardware items — amortized per event based on Amort Period above';
    const pkgHwTable=makeItemTable(
      ()=>pkg.hwItems,
      newItems=>{pkg.hwItems=newItems;},
      ()=>3, false, ()=>S.amortWeeks, ()=>7, ()=>false
    );
    pkgBody.append(pkgHwSub, pkgHwTable);
    card.append(pkgBody);
    pkgLibBody.append(card);
  });

  const addPkgRow = div('');
  addPkgRow.style.cssText = 'display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap;';
  const newPkgNameInp = el('input',{type:'text',placeholder:'Package name'});
  newPkgNameInp.style.cssText = 'flex:1;min-width:200px;font-size:12px;padding:5px 8px;border-radius:4px;border:1px dashed var(--border2);background:var(--bg2);color:var(--t1);';
  const newPkgKtSel = el('select',{class:'itbl-sel'});
  newPkgKtSel.style.cssText = 'font-size:12px;padding:5px 8px;border-radius:4px;width:auto;';
  [['bvlos','BVLOS Kit'],['vlos','VLOS Kit']].forEach(([v,l])=>{const o=el('option',{value:v});o.textContent=l;newPkgKtSel.append(o);});
  const addPkgBtn=el('button',{class:'cfg-btn'});addPkgBtn.textContent='+ ADD PACKAGE';
  addPkgBtn.style.cssText='border-color:var(--green);color:var(--green);padding:4px 12px;';
  addPkgBtn.addEventListener('click',()=>{
    const name = newPkgNameInp.value.trim();
    if(!name){newPkgNameInp.style.borderColor='var(--red2)';return;}
    const kt = newPkgKtSel.value;
    S.hwPackages.push(newHwPackage({name, kitType:kt, hwItems:clone(kt==='vlos'?DJI_VLOS_HW:DJI_BVLOS_HW), open:true}));
    newPkgNameInp.value = '';
    rerender();
  });
  addPkgRow.append(newPkgNameInp, newPkgKtSel, addPkgBtn);
  root.append(makeSection('HARDWARE PACKAGE LIBRARY', pkgLibBody, addPkgRow));

  // Notes
  const ta=el('textarea',{class:'notes-area',placeholder:"Notes, assumptions, open questions, client context..."});
  ta.value=S.notes;
  const notesFooter=div('notes-footer');
  const charCount=div('notes-char');charCount.textContent=S.notes.length+' chars';
  ta.addEventListener('input',e=>{S.notes=e.target.value;charCount.textContent=S.notes.length+' chars';});
  const clearBtn=el('button',{class:'notes-clear'});clearBtn.textContent='Clear';
  clearBtn.addEventListener('click',()=>{S.notes='';ta.value='';charCount.textContent='0 chars';});
  notesFooter.append(charCount,clearBtn);
  const notesWrap=div('');notesWrap.append(ta,notesFooter);
  root.append(makeSection('NOTES',notesWrap));

  return root;
}

// ── Storage ────────────────────────────────────────────────────
const STORAGE_KEY='dxd_business_model_v10';
function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({S,MRR}));return true;}
  catch(e){console.warn('Save failed:',e);return false;}
}
function migrateEventType(et) {
  if(et.vlos && et.bvlos) return et;
  const isOldVlos = et.configType === 'vlos' || et.activeConfig === 'vlos';
  const days = et.daysPerEvent || 7;
  const hrs  = et.coverageHours || 24;
  const ot   = et.otMultiplier || 1.0;
  const defSw = () => [
    {id:Date.now()+Math.random(), name:"Starlink Subscription", qty:1, unitCost:70,  margin:30, perDrone:false},
    {id:Date.now()+Math.random(), name:"Drone Tag License",      qty:1, unitCost:30,  margin:30, perDrone:false},
    {id:Date.now()+Math.random(), name:"DroneSense",             qty:1, unitCost:700, margin:30, perDrone:true},
  ];
  return Object.assign({}, et, {
    activeConfig: et.activeConfig || et.configType || 'bvlos',
    vlos: {packageId:1, daysPerEvent:days, coverageHours:hrs, otMultiplier:ot, rate1099:68.46, pilots:4, dronesCount:3, perDiemRate:75, otherItems:[], shipping:{outbound:0,inbound:0}, travel:{airfare:350,numTravelers:4,numFlights:4,airfareRows:[],lodgingNights:days+1,lodgingRate:150,perDiemDays:days+1,rental:540,gas:100,miles:0,mileageRate:0.70,travelExtras:[],eventWeeks:1}, swItems:defSw()},
    bvlos:{packageId:2, daysPerEvent:days, coverageHours:hrs, otMultiplier:ot, intRate:65, intCount:1, intDays:7, pilotRate:68.46, pilotCount:2, dronesCount:3, perDiemRate:75, otherItems:[], shipping:{outbound:0,inbound:0}, travel:{airfare:350,numTravelers:1,numFlights:1,airfareRows:[],lodgingNights:days,lodgingRate:150,perDiemDays:days,rental:0,gas:0,miles:0,mileageRate:0.70,travelExtras:[],eventWeeks:1}, swItems:defSw()},
  });
}
function loadState(){
  if(window.__DXD_INJECTED__) return false;
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const saved=JSON.parse(raw);
    const savedS=saved.S||saved;
    if(savedS.eventTypes) savedS.eventTypes=savedS.eventTypes.map(et=>(!et.vlos||!et.bvlos)?migrateEventType(et):et);
    Object.keys(savedS).forEach(k=>{ S[k]=savedS[k]; });
    if(!S.hwPackages||S.hwPackages.length===0) S.hwPackages=[defaultVlosPackage(),defaultBvlosPackage()];
    if(saved.MRR){
      const m=saved.MRR;
      if(!m.hwPackages||m.hwPackages.length===0) m.hwPackages=[defaultMrrDjiPackage(),defaultMrrSkyPackage(),defaultMrrSflPackage()];
      const seen=new Map();
      (m.hwPackages||[]).forEach(p=>seen.set(p.id,p));
      m.hwPackages=[...seen.values()];
      MRR.clients    = m.clients    || MRR.clients;
      MRR.hwPackages = m.hwPackages || MRR.hwPackages;
      MRR.marginFloor= m.marginFloor!==undefined ? m.marginFloor : MRR.marginFloor;
      MRR.notes      = m.notes      !==undefined ? m.notes : MRR.notes;
      const maxPkgId=Math.max(500,...(MRR.hwPackages||[]).map(p=>p.id||0));
      if(maxPkgId>_mrrPkgId) _mrrPkgId=maxPkgId;
      const maxClientId=Math.max(200,...(MRR.clients||[]).map(c=>c.id||0));
      if(maxClientId>_mrrId) _mrrId=maxClientId;
    }
    return true;
  }catch(e){console.warn('Load failed:',e);try{localStorage.removeItem(STORAGE_KEY);}catch(e2){}return false;}
}
function resetState(){
  if(!confirm('Reset all values to defaults?'))return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

function rerender() {
  saveState();
  try {
    const newApp = renderApp();
    const appEl = document.getElementById('app');
    appEl.innerHTML='';
    appEl.append(newApp);
  } catch(e) {
    console.error('Job Estimator rerender failed:', e);
  }
}

loadState();
rerender();
</script>
</body></html>
